"Label on top, blanks below → Fill Down.", "why": ["Wrong — Replace Errors handles error values, not nulls.", "Wrong — Removing these rows would delete real sales data.", "Wrong — Fill Up copies the value from BELOW, which would assign rows to the wrong category.", "Correct — Fill Down copies the last non-null value downward until the next value appears."], "concept": "Report-style sheets often show a group label only once. Fill Down (Transform > Fill > Down) copies the value above into the null cells below it. Note it fills null values; if cells contain empty text instead, replace \"\" with null first.", "learn": "Fill values in a column", "lesson": "Lesson 6 ⏱ 02:15:37", "cluster": "P3"}, {"id": "PD2-013", "domain": "Prepare the data", "topic": "Clean and shape tables", "level": "easy", "question": "You connect to a CSV file. The column headers show as Column1, Column2, Column3, and the real names (OrderID, Date, Amount) appear in the first data row.\nWhat should you do?", "options": ["Transpose", "Remove Top Rows (1)", "Use First Row as Headers", "Rename each column manually and leave the first row"], "answer": [2], "pick": 1, "tip": "Names stuck in row 1? Promote them: Use First Row as Headers.", "why": ["Wrong — Transpose flips the whole table; it doesn't fix headers.", "Wrong — Removing the first row deletes the real column names, leaving Column1, Column2…", "Correct — This promotes the first row's values to column names and removes that row from the data.", "Wrong — Renaming fixes the names but the header row stays as a bad data row (text in a numeric column causes errors)."], "concept": "A clean table has exactly one header row with unique column names. 'Use First Row as Headers' (Home or Transform tab) moves the first row into the headers; 'Use Headers as First Row' does the reverse. Set data types AFTER promoting headers.", "learn": "Promote or demote column headers", "lesson": "Lesson 6 ⏱ 00:33:54", "cluster": "P3"}, {"id": "PD2-014", "domain": "Prepare the data", "topic": "Merge queries (joins)", "level": "medium", "question": "Northwind has a Customers query and an Orders query, both with CustomerID. Marketing wants a list of customers who have NEVER placed an order.\nYou start Merge Queries with Customers as the first (left) table and Orders as the second (right) table. Which join kind should you choose?", "options": ["Left anti", "Inner", "Full outer", "Left outer"], "answer": [0], "pick": 1, "tip": "Anti = 'not in'. Left anti keeps left rows with NO match on the right.", "why": ["Correct — Left anti returns only the rows from the left table (Customers) that have no matching row in the right table (Orders).", "Wrong — Inner keeps only customers that DO have orders.", "Wrong — Full outer keeps everything from both tables.", "Wrong — Left outer keeps all customers, both with and without orders, so you'd still need to filter."], "concept": "Merge Queries joins two tables on matching key columns (like SQL JOIN). Join kinds: Left outer (all left + matches), Right outer (all right + matches), Full outer (all from both), Inner (only matches), Left anti (left rows with no match), Right anti (right rows with no match).", "learn": "Merge queries overview", "lesson": "Lesson 8 ⏱ 02:19:13", "cluster": "P3"}, {"id": "PD2-015", "domain": "Prepare the data", "topic": "Merge queries (joins)", "level": "medium", "question": "You merge Sales (left) with Products (right) on ProductID to bring in Category. A few sales rows use ProductIDs that are missing from Products. Finance requires that NO sales rows are lost; missing categories can show as null.\nWhich join kind should you use?", "options": ["Inner", "Right anti", "Left outer", "Right outer"], "answer": [2], "pick": 1, "tip": "Keep every row of the table you merge INTO → Left outer (the default).", "why": ["Wrong — Inner drops the sales rows with unknown ProductIDs, so totals would be too low.", "Wrong — Right anti returns products that have no sales — a different question.", "Correct — Left outer keeps every Sales row and fills Category with null where there is no matching product.", "Wrong — Right outer keeps all products but drops sales rows without a match."], "concept": "Left outer is the default join in Power Query and is the usual way to 'look up' extra columns: every row of the first table stays, and matching columns from the second table are added. Inner is stricter and silently drops unmatched rows, which can make totals wrong.", "learn": "Left outer join", "lesson": "Lesson 8 ⏱ 02:18:06", "cluster": "P3"}, {"id": "PD2-016", "domain": "Prepare the data", "topic": "Merge queries (joins)", "level": "hard", "question": "You must find products that have NEVER been sold. A colleague already started Merge Queries with Sales as the first (left) table and Products as the second (right) table, joined on ProductID.\nWithout swapping the tables, which join kind returns exactly the unsold products?", "options": ["Left outer", "Right anti", "Left anti", "Inner"], "answer": [1], "pick": 1, "tip": "Anti keeps the 'lonely' rows of ONE side — check which side your target table is on.", "why": ["Wrong — Left outer keeps all Sales rows; unsold products never appear because they aren't in Sales.", "Correct — Right anti returns rows from the right table (Products) that have no match in the left table (Sales).", "Wrong — Left anti returns Sales rows with no matching product (orphan sales), not unsold products.", "Wrong — Inner returns only products that were sold."], "concept": "The order of tables in a merge matters. 'Left' is the first table you selected and 'right' is the second. Left anti and right anti both mean 'rows with no match', but on opposite sides. Ask: which table do I want rows FROM?", "learn": "Right anti join", "lesson": "Lesson 8 ⏱ 02:24:17", "cluster": "P3"}, {"id": "PD2-017", "domain": "Prepare the data", "topic": "Merge queries (joins)", "level": "medium", "question": "Adventure Works is reconciling invoices between the billing system and the ERP system. Both queries have InvoiceID. The auditor wants ONE table showing every invoice from either system, so invoices missing from one side are visible as nulls.\nWhich join kind should you use?", "options": ["Inner", "Left anti", "Left outer", "Full outer"], "answer": [3], "pick": 1, "tip": "Full outer = nobody gets left behind (all rows from both sides).", "why": ["Wrong — Inner shows only invoices found in both systems, hiding the mismatches.", "Wrong — Left anti shows only billing invoices missing from ERP, not the other direction.", "Wrong — Left outer would miss invoices that exist only in the ERP (right) table.", "Correct — Full outer keeps all rows from both tables; where there is no match, the other side's columns are null."], "concept": "Full outer join returns every row from both tables, matched where possible. It's ideal for reconciliation: a null on one side shows a record exists in only one system. For one-directional checks use the anti joins.", "learn": "Full outer join", "lesson": "", "cluster": "P3"}, {"id": "PD2-018", "domain": "Prepare the data", "topic": "Append queries", "level": "easy", "question": "You have three queries, Sales_Jan, Sales_Feb and Sales_Mar, with exactly the same columns. You need one Sales table containing all rows from the three months.\nWhat should you use?", "options": ["Append Queries (three or more tables)", "Merge Queries", "Group By", "Pivot Column"], "answer": [0], "pick": 1, "tip": "Append = stack rows (taller). Merge = add columns (wider).", "why": ["Correct — Append stacks the rows of the tables on top of each other into one table.", "Wrong — Merge joins tables side by side on a key, adding columns, not rows.", "Wrong — Group By summarizes rows; it doesn't combine separate tables.", "Wrong — Pivot reshapes one table; it doesn't combine tables."], "concept": "Append Queries is like SQL UNION ALL: it stacks tables vertically. Use 'Append Queries as New' to create a new query and keep the originals. Merge Queries is like SQL JOIN: it combines tables horizontally by matching a key.", "learn": "Append queries", "lesson": "Lesson 8 ⏱ 02:01:40", "cluster": "P3"}, {"id": "PD2-019", "domain": "Prepare the data", "topic": "Append queries", "level": "medium", "question": "You append StoreSales (columns: Date, StoreID, Amount — 1,000 rows) and WebSales (columns: Date, Amount, PromoCode — 400 rows).\nWhich TWO statements describe the result? (Select TWO.)", "options": ["Only the columns present in both tables (Date, Amount) are kept.", "The result has 1,400 rows.", "Rows are matched on Date, so the result has at most 1,000 rows.", "The append fails because the tables don't have identical columns.", "The result has columns Date, StoreID, Amount and PromoCode; values missing from a table are null."], "answer": [1, 4], "pick": 2, "tip": "Append stacks rows by column NAME; mismatched columns get nulls, nothing is matched.", "why": ["Wrong — Columns aren't dropped; all columns from both tables are kept.", "Correct — Append adds all rows of both tables: 1,000 + 400 = 1,400.", "Wrong — Append never matches rows on a key; that's what Merge does.", "Wrong — Append works with different columns; it just fills the gaps with null.", "Correct — The result includes every column from both tables; StoreID is null for web rows and PromoCode is null for store rows."], "concept": "Append lines columns up by name. Columns that exist in only one table are still added, with null for rows coming from the other table. That's why you should make column names consistent (e.g. Amount vs SalesAmount) before appending.", "learn": "Append queries", "lesson": "Lesson 8 ⏱ 02:01:40", "cluster": "P3"}, {"id": "PD2-020", "domain": "Prepare the data", "topic": "Reference vs duplicate", "level": "medium", "question": "You have a query Sales_Clean with 15 cleaning steps. You need two new queries — SalesByRegion and SalesByProduct — that start from the cleaned data. If someone later adds a cleaning step to Sales_Clean, both new queries must pick it up automatically.\nHow should you create the two queries?", "options": ["Copy the M code from the Advanced Editor into two blank queries", "Append Sales_Clean to two blank queries", "Duplicate Sales_Clean twice", "Reference Sales_Clean twice"], "answer": [3], "pick": 1, "tip": "Reference = a live link to the original. Duplicate = an independent photocopy.", "why": ["Wrong — Copied code is also an independent copy, the same problem as Duplicate.", "Wrong — Appending stacks rows and is not the way to build a query on top of another.", "Wrong — Duplicate copies all 15 steps into independent queries; future changes to Sales_Clean won't flow to them.", "Correct — A referenced query's source is the output of Sales_Clean, so any change to Sales_Clean flows through automatically."], "concept": "Reference creates a new query whose first step is simply the original query's output. Duplicate copies every step into a new, independent query. Use Reference to build several outputs (such as dimension tables) from one cleaned base; use Duplicate when you want a separate starting point you can change freely.", "learn": "Reference vs duplicate queries", "lesson": "", "cluster": "P3"}, {"id": "PD2-021", "domain": "Prepare the data", "topic": "Load settings", "level": "medium", "question": "You have a staging query Customers_Raw used only as the input for a referenced query DimCustomer. You right-click Customers_Raw and clear Enable load. Separately, on a static Country lookup table, you clear Include in report refresh.\nWhich TWO statements are true? (Select TWO.)", "options": ["DimCustomer will now return an error because its source query isn't loaded.", "The Country table stays in the model but isn't refreshed when you click Refresh.", "Clearing Enable load deletes the applied steps of Customers_Raw.", "The Country table is removed from the model and its relationships are deleted.", "Customers_Raw no longer appears as a table in the model, but DimCustomer can still use it."], "answer": [1, 4], "pick": 2, "tip": "Enable load = 'does it become a model table?'; Include in refresh = 'does Refresh re-run it?'", "why": ["Wrong — Referencing a query with load disabled works normally; Power Query evaluates it when DimCustomer refreshes.", "Correct — The table keeps its last loaded data and is skipped during report refresh, which saves time for data that never changes.", "Wrong — The steps are kept; only the load to the model is turned off.", "Wrong — Include in report refresh only controls refresh; the table and relationships stay.", "Correct — With load disabled the query stays in Power Query (shown in italics) and other queries can still reference it; it just doesn't become a model table."], "concept": "Two different query settings: Enable load decides whether a query's output becomes a table in the semantic model (turn it off for staging/helper queries to keep the model small and clean). Include in report refresh decides whether the table is re-run during refresh (turn it off for static data).", "learn": "Power Query query properties: enable load", "lesson": "", "cluster": "P3"}, {"id": "PD2-022", "domain": "Prepare the data", "topic": "Fact and dimension tables", "level": "medium", "question": "An Adventure Works model has these tables:\n- Sales (OrderID, DateKey, ProductKey, CustomerKey, Quantity, SalesAmount)\n- Product (ProductKey, Name, Color, Category)\n- Customer (CustomerKey, Name, City)\n- Date (DateKey, Date, Month, Year)\n- InventorySnapshot (DateKey, ProductKey, WarehouseKey, UnitsOnHand)\nWhich TWO are fact tables? (Select TWO.)", "options": ["Product", "InventorySnapshot", "Sales", "Date", "Customer"], "answer": [1, 2], "pick": 2, "tip": "Fact = events/measurements with numbers + many keys. Dimension = who/what/where/when descriptions.", "why": ["Wrong — Product describes WHAT was sold; it's a dimension.", "Correct — InventorySnapshot records a measurement (UnitsOnHand) per date, product and warehouse, with keys to dimensions — a fact table even though it isn't sales.", "Correct — Sales records business events (orders) with numeric measures and foreign keys to dimensions.", "Wrong — Date describes WHEN; it's a dimension even though it's used by every fact table.", "Wrong — Customer describes WHO bought; it's a dimension."], "concept": "Fact tables store events or measurements: many rows, numeric columns you aggregate (Quantity, Amount, UnitsOnHand) and key columns pointing to dimensions. Dimension tables store descriptive attributes used to filter and group (Product, Customer, Date, Store), with one row per item. A model can have several fact tables sharing the same dimensions.", "learn": "Understand star schema and the importance for Power BI", "lesson": "", "cluster": "P4"}, {"id": "PD2-023", "domain": "Prepare the data", "topic": "Fact and dimension tables", "level": "easy", "question": "You are explaining dimension tables to a new analyst.\nWhich TWO statements correctly describe a dimension table? (Select TWO.)", "options": ["It holds descriptive attributes (names, categories, cities) used to filter and group data.", "It mainly contains numeric columns that are summed in measures.", "It has a key column with a unique value on every row.", "It usually has the most rows in the model, one per transaction.", "It sits on the 'many' side of its relationship to the fact table."], "answer": [0, 2], "pick": 2, "tip": "Dimension = the 'by' in 'sales BY product BY month'.", "why": ["Correct — Dimensions answer who, what, where and when, and their columns become slicers, axes and filters.", "Wrong — Numeric columns you sum (amounts, quantities) belong in fact tables.", "Correct — Each row describes one item, identified by a unique key (e.g. ProductKey), which is the 'one' side of the relationship.", "Wrong — That describes a fact table; dimensions usually have far fewer rows.", "Wrong — Dimensions are on the 'one' side; the fact table is on the 'many' side."], "concept": "A dimension table has one row per business entity (one row per product, customer, date…) with a unique key and descriptive columns. When you build a visual like 'Sales by Category', the category comes from the dimension and the sales number comes from the fact table.", "learn": "Understand star schema and the importance for Power BI", "lesson": "", "cluster": "P4"}, {"id": "PD2-024", "domain": "Prepare the data", "topic": "Star schema", "level": "easy", "question": "Which description matches a star schema in Power BI?", "options": ["One wide table that contains every column needed for the report", "A dimension table in the center, with several fact tables related to it by many-to-many relationships", "Dimension tables chained to each other (Category → Subcategory → Product) with no fact table", "A fact table in the center, with each dimension table related directly to it by a one-to-many relationship (dimension on the 'one' side)"], "answer": [3], "pick": 1, "tip": "Picture a star: the fact is the body, each dimension is a point connected straight to it.", "why": ["Wrong — That's a flat (denormalized) table, not a star schema.", "Wrong — Dimensions don't sit in the center, and star schemas rely on one-to-many, not many-to-many, relationships.", "Wrong — Chained dimensions describe a snowflake pattern, and a model without a fact table has nothing to measure.", "Correct — In a star schema, dimensions surround the fact table and filter it through one-to-many relationships."], "concept": "A star schema separates data into fact tables (what happened, with numbers) and dimension tables (descriptions). Each dimension connects directly to the fact table with a one-to-many relationship, so filters flow from dimension to fact. Microsoft recommends this design for Power BI models.", "learn": "Understand star schema and the importance for Power BI", "lesson": "", "cluster": "P4"}, {"id": "PD2-025", "domain": "Prepare the data", "topic": "Star schema", "level": "medium", "question": "Contoso currently loads one flat table: every sales row repeats ProductName, Category, Brand, CustomerName and City. The team also wants to add a Budget table later and filter both Sales and Budget by Category.\nWhich TWO are benefits of reshaping into a star schema? (Select TWO.)", "options": ["A star schema means DAX measures are no longer needed.", "A star schema removes the need for any relationships.", "A star schema lets you skip data types in Power Query.", "Descriptive text such as ProductName is stored once per product instead of on every sales row, so the model is smaller.", "A single Product dimension can filter both the Sales and Budget fact tables consistently."], "answer": [3, 4], "pick": 2, "tip": "Star = store descriptions once, share them across many facts.", "why": ["Wrong — You still write measures; a star schema just makes them simpler and more reliable.", "Wrong — A star schema is built ON relationships between dimensions and facts.", "Wrong — Data types are still essential in any model.", "Correct — Moving repeated text into a dimension reduces duplication, which shrinks the model and speeds it up.", "Correct — Shared (conformed) dimensions let one slicer filter several fact tables the same way."], "concept": "A flat table is easy to start with but repeats descriptive text on every row and can't easily share filters with other fact tables. A star schema stores each description once in a dimension, keeps the fact table narrow (keys + numbers), and lets the same dimension filter many facts.", "learn": "Understand star schema and the importance for Power BI", "lesson": "", "cluster": "P4"}, {"id": "PD2-026", "domain": "Prepare the data", "topic": "Fact and dimension tables", "level": "hard", "question": "You have a flat query SalesFlat with columns OrderID, OrderDate, ProductID, ProductName, Category, Brand, Quantity, Amount. You need a DimProduct dimension table with one row per product, and future cleaning steps on SalesFlat should flow into it.\nWhich THREE steps should you take? (Select THREE.)", "options": ["Append SalesFlat to the new query", "Remove ProductID because ProductName is enough", "Remove duplicates based on ProductID", "Create a new query by Referencing SalesFlat", "Keep only ProductID, ProductName, Category and Brand (Remove Other Columns)", "Unpivot the product columns"], "answer": [2, 3, 4], "pick": 3, "tip": "Dimension recipe: Reference → keep descriptive columns → remove duplicates on the key.", "why": ["Wrong — Appending doubles the rows; it doesn't produce one row per product.", "Wrong — The key column is needed to relate DimProduct to the fact table, and names aren't guaranteed to be unique.", "Correct — Removing duplicates on ProductID leaves one row per product, so the key is unique.", "Correct — Referencing reuses SalesFlat's cleaned output and keeps the two queries linked.", "Correct — A dimension needs only the key and descriptive attributes; order and amount columns belong in the fact table.", "Wrong — Unpivoting would turn product attributes into rows, which isn't a dimension shape."], "concept": "To split a flat table into a star schema in Power Query: reference the flat query for each dimension, keep the key plus descriptive columns, and remove duplicates so the key is unique. In the fact query, keep the keys and numeric columns and remove the descriptive columns that now live in the dimensions.", "learn": "Create dimension tables from a flat table in Power Query", "lesson": "", "cluster": "P4"}, {"id": "PD2-027", "domain": "Prepare the data", "topic": "Key columns", "level": "medium", "question": "You load a Product table and a Sales table and try to create a one-to-many relationship on ProductID. Power BI only allows many-to-many because a few ProductIDs appear twice in Product (the product was re-listed with a new price).\nWhat is the best fix for a star schema?", "options": ["Keep the many-to-many relationship and set the cross-filter direction to Both", "Change ProductID to Text in both tables", "Make ProductID unique in the Product table (for example keep the current row per ProductID and remove duplicates)", "Remove duplicates in the Sales table on ProductID"], "answer": [2], "pick": 1, "tip": "The 'one' side must be unique: fix the dimension, never delete fact rows.", "why": ["Wrong — Many-to-many with Both direction hides the data problem and can give confusing results; fix the key instead.", "Wrong — Changing the type doesn't remove the duplicate values.", "Correct — A dimension key must be unique on the 'one' side. Deduplicating Product allows a proper one-to-many relationship.", "Wrong — Sales rows are real transactions; removing them makes totals wrong, and it doesn't fix duplicates in Product."], "concept": "A one-to-many relationship requires the column on the 'one' side (the dimension key) to have no duplicates. When duplicates appear, clean the dimension in Power Query (trim, decide which row to keep, remove duplicates). Column profiling (distinct vs unique counts) helps you spot this quickly.", "learn": "Model relationships in Power BI Desktop", "lesson": "", "cluster": "P4"}, {"id": "PD2-028", "domain": "Prepare the data", "topic": "Key columns", "level": "hard", "question": "Fabrikam merged two companies. Both old systems have a Customer table, and both use CustomerID values like 1001 — but 1001 is a different customer in each system. You append the two Customer tables into DimCustomer and need a key that uniquely identifies every customer.\nWhat should you do?", "options": ["Group DimCustomer by CustomerID with Count Rows", "Remove duplicates on CustomerID after appending", "Add a SourceSystem column to each table before appending, then add an Index Column to DimCustomer as a surrogate key (and bring that key into the fact table by merging on SourceSystem + CustomerID)", "Change CustomerID to Text before appending"], "answer": [2], "pick": 1, "tip": "When source IDs clash, create your own key: a surrogate key (e.g. an Index Column).", "why": ["Wrong — Grouping collapses two different customers into one row with a count.", "Wrong — Different customers share the same ID, so removing duplicates would delete real customers.", "Correct — SourceSystem + CustomerID identifies each customer; an Index Column gives a simple unique surrogate key that the fact table can use after a merge.", "Wrong — \"1001\" as text is still duplicated across the two systems."], "concept": "A surrogate key is an artificial key (often a whole number from Add Column > Index Column) created in the data model instead of relying on source IDs. It's useful when sources overlap or IDs change. The fact table must then carry the same surrogate key, usually obtained by merging on the original identifying columns.", "learn": "Add an index column", "lesson": "", "cluster": "P4"}, {"id": "PD2-029", "domain": "Prepare the data", "topic": "Many-to-many / bridge tables", "level": "hard", "question": "A bank model has Customer (CustomerID…), Account (AccountID…) and Transactions (AccountID, Date, Amount). Accounts can be joint: one customer can own many accounts and one account can have several owners. Users must filter transactions by customer.\nWhat should you build?", "options": ["A direct relationship between Customer and Transactions on CustomerID", "Merge Customer into Account so each account has one CustomerName column", "Append Customer and Account into one table", "A bridge table CustomerAccount with one row per CustomerID–AccountID pair, related one-to-many from Customer and from Account"], "answer": [3], "pick": 1, "tip": "Many-to-many between two dimensions? Put a bridge (pair) table between them.", "why": ["Wrong — Transactions has no CustomerID, and a joint account belongs to several customers.", "Wrong — An account with two owners would either be duplicated (doubling transactions) or keep only one owner.", "Wrong — Customer and Account have different columns and meanings; appending them makes no sense.", "Correct — The bridge stores each owner–account pair once, so Customer and Account keep unique keys and filters can pass through the bridge to Account and on to Transactions."], "concept": "A bridge (factless/link) table resolves a many-to-many relationship between two dimensions by storing each valid pair once. Each dimension keeps its unique key and relates one-to-many to the bridge. To let a Customer filter reach Account, the bridge-to-Account relationship typically needs to filter in both directions — use this carefully.", "learn": "Many-to-many relationship guidance", "lesson": "", "cluster": "P4"}, {"id": "PD2-030", "domain": "Prepare the data", "topic": "Reduce data", "level": "medium", "question": "You connect to a SQL Server table with 150 columns and 10 years of history. The report uses only 12 columns and the last 2 years. You want a smaller, faster model.\nWhich TWO actions should you take? (Select TWO.)", "options": ["Remove the unused columns in Power Query", "Hide the unused columns in Report view", "Rename the unused columns so they sort to the bottom", "Filter the rows to the last 2 years in Power Query", "Add a report-level filter for the last 2 years"], "answer": [0, 3], "pick": 2, "tip": "Smaller model = fewer columns and fewer rows loaded, decided in Power Query — not hidden later.", "why": ["Correct — Removed columns are never loaded, which reduces model size and refresh time.", "Wrong — Hidden columns are still loaded and still take space.", "Wrong — Renaming doesn't reduce data at all.", "Correct — Filtering rows before loading means old data never enters the model.", "Wrong — A report filter only hides rows in visuals; all 10 years are still imported."], "concept": "Data reduction means loading only what the report needs: remove unneeded columns (vertical) and filter unneeded rows (horizontal) in Power Query. Doing these early also helps query folding, where Power Query pushes the work back to the source database.", "learn": "Data reduction techniques for Import modeling", "lesson": "", "cluster": "P3"}, {"id": "PD2-031", "domain": "Prepare the data", "topic": "Applied steps", "level": "hard", "question": "A Power Query query connects to a large SQL Server Orders table. You need these steps: (A) Filter rows to the current year, (B) Remove unneeded columns, (C) Merge with the Customers query to add Segment, (D) Add a custom column with text formatting.\nWhich order is the best practice for performance?", "options": ["C, A, D, B", "A, B, C, D", "C, D, A, B", "D, C, B, A"], "answer": [1], "pick": 1, "tip": "Shrink first, then join and calculate: filter and remove columns at the top.", "why": ["Wrong — The merge still runs before the filter on all rows.", "Correct — Filtering and removing columns first reduce the data early (and usually fold back to SQL Server), so the merge and custom column work on far fewer rows.", "Wrong — Merging and adding columns before filtering processes every historical row.", "Wrong — Filtering last means all expensive steps run on the full table."], "concept": "Applied steps run in order, top to bottom, and each step works on the output of the previous one. Put steps that reduce data (filters, removing columns) as early as possible. This keeps later steps cheap and helps query folding, because complex steps can stop folding for every step after them.", "learn": "Query folding guidance in Power BI Desktop", "lesson": "Lesson 7 ⏱ 01:45:58", "cluster": "P3"}, {"id": "PD2-032", "domain": "Prepare the data", "topic": "Advanced Editor (M)", "level": "hard", "question": "You open the Advanced Editor and see this M code:\n```\nlet\n    Source   = Sql.Database(\"srv01\", \"SalesDB\"),\n    Orders   = Source{[Schema=\"dbo\", Item=\"Orders\"]}[Data],\n    Filtered = Table.SelectRows(Orders, each [Amount] > 0),\n    Removed  = Table.RemoveColumns(Filtered, {\"Notes\"})\nin\n    Filtered\n```\nWhat does this query return?", "options": ["Orders with Amount > 0, still including the Notes column", "All orders without the Notes column", "An error, because the Removed step isn't used", "Orders with Amount > 0, without the Notes column"], "answer": [0], "pick": 1, "tip": "The query returns whatever step is named after 'in' — not automatically the last line.", "why": ["Correct — The 'in' part returns Filtered, so the result is filtered but the Notes column is still there.", "Wrong — The returned step includes the Amount > 0 filter.", "Wrong — Unused steps don't cause an error; they're simply not part of the output.", "Wrong — Notes is removed only in the Removed step, which isn't the step returned."], "concept": "An M query is a 'let … in' expression. Inside 'let', each step is a named expression that usually builds on the previous one. The 'in' part says which step is the query's output — normally the last step, but it can be any step. Each Applied Step in the UI is one of these named steps.", "learn": "Power Query M language: let expression", "lesson": "Lesson 6 ⏱ 02:00:13", "cluster": "P3"}, {"id": "PD2-033", "domain": "Prepare the data", "topic": "Merge queries (joins)", "level": "medium", "question": "After you merge Sales with Products on ProductID, Power Query adds a new column named Products where every cell shows the word Table. The step generated is:\n```\nTable.NestedJoin(Sales, {\"ProductID\"}, Products, {\"ProductID\"}, \"Products\", JoinKind.LeftOuter)\n```\nYou need the Category and Brand columns from Products. Which step should come next?", "options": ["Table.Combine — combine Sales and Products", "Table.Transpose — transpose the Products column", "Table.PromoteHeaders — use the first row as headers", "Table.ExpandTableColumn — expand the Products column and select Category and Brand"], "answer": [3], "pick": 1, "tip": "Merge gives you a nested 'Table' column — Expand it (the ↔ icon) to get real columns.", "why": ["Wrong — Table.Combine is the M function behind Append; it stacks rows.", "Wrong — Transpose flips a whole table; it doesn't pull out nested columns.", "Wrong — Promoting headers isn't related to nested tables.", "Correct — Expanding the nested table column (the expand icon in the header) adds the chosen columns, such as Category and Brand, to each Sales row."], "concept": "Merge Queries is a two-step process: first Table.NestedJoin adds a column containing a small table of matching rows for each row, then you expand that column to choose which columns to bring in. You can also aggregate instead of expanding (e.g. sum matching amounts).", "learn": "Merge queries overview", "lesson": "Lesson 8 ⏱ 02:35:22", "cluster": "P3"}, {"id": "PD2-034", "domain": "Prepare the data", "topic": "Custom functions", "level": "medium", "question": "You created this custom function named fnNetPrice:\n```\n(price as number, discount as number) as number =>\n    price * (1 - discount)\n```\nIn the Orders query you need a NetPrice column calculated for each row from UnitPrice and DiscountPct.\nWhat should you do?", "options": ["Append fnNetPrice to Orders", "Use Merge Queries between Orders and fnNetPrice", "Enable load on fnNetPrice so it appears in the model", "Use Add Column > Invoke Custom Function, select fnNetPrice and map price to UnitPrice and discount to DiscountPct"], "answer": [3], "pick": 1, "tip": "A function is a reusable recipe: Invoke Custom Function runs it once per row.", "why": ["Wrong — Append stacks tables; it can't call a function.", "Wrong — Merge joins two tables; a function isn't a table.", "Wrong — Loading a function doesn't apply it to any rows.", "Correct — Invoke Custom Function adds a column that calls the function for every row, passing the mapped columns as parameters."], "concept": "A custom function in M has parameters and a body: (x, y) => expression. You can write it in the Advanced Editor or create one from a query with parameters (Create Function). Use Add Column > Invoke Custom Function to apply it row by row — handy for reusing the same logic across many queries or files.", "learn": "Using custom functions in Power Query", "lesson": "", "cluster": "P3"}, {"id": "PD2-035", "domain": "Prepare the data", "topic": "Applied steps", "level": "medium", "question": "A query's Applied Steps are: Source → Promoted Headers → Changed Type → Renamed Columns (Amt → Amount) → Filtered Rows (Amount > 0).\nYou delete the Renamed Columns step. What happens?", "options": ["The Changed Type step shows an error", "Nothing — Power Query automatically updates later steps to use Amt", "All steps after Source are deleted", "The Filtered Rows step shows an error because the column Amount can't be found"], "answer": [3], "pick": 1, "tip": "Each step depends on the one before it — remove a step and later steps may break.", "why": ["Wrong — Changed Type runs before the deleted step and isn't affected.", "Wrong — Power Query does not rewrite later steps; they still refer to Amount.", "Wrong — Deleting one step deletes only that step.", "Correct — Filtered Rows still refers to Amount, which no longer exists, so that step errors."], "concept": "Applied Steps are a chain: each step takes the previous step's output. Deleting, reordering or inserting steps can break later steps that refer to column names. Power Query warns you when you delete or insert a step in the middle; check the steps below afterwards.", "learn": "Applied Steps in Power Query", "lesson": "Lesson 6 ⏱ 01:52:18", "cluster": "P3"}, {"id": "MD1-001", "domain": "Model the data", "topic": "Column properties: data category", "level": "easy", "question": "Fabrikam's Store table has a City column with values such as \"Paris\" and \"London\". On a map visual, some stores are plotted in the wrong place because Power BI guesses what the text means.\nWhich column property should you set first to help Power BI geocode the values correctly?", "options": ["Summarization = Don't summarize", "Sort by column", "Data category = City", "Display folder"], "answer": [2], "pick": 1, "tip": "Data category tells maps WHAT the text is (City, Country, Postal code, URL...).", "why": ["Wrong — Summarization controls default aggregation of numeric columns, not how text is interpreted on a map.", "Wrong — Sort by column only changes the order values appear in; it has no effect on geocoding.", "Correct — Data category tells Power BI the text represents a city, so map visuals geocode it as a place instead of guessing.", "Wrong — Display folders only organize fields in the Fields pane."], "concept": "Data category is a column property that adds meaning to a column: geographic types (City, Country/Region, State, Postal code, Latitude, Longitude), Web URL, Image URL and Barcode. Map visuals use it to geocode values more accurately. For ambiguous names (Paris, France vs Paris, Texas) it also helps to add a Country column or a combined \"City, Country\" column.", "learn": "Data categorization in Power BI Desktop", "lesson": "", "cluster": "M2"}, {"id": "MD1-002", "domain": "Model the data", "topic": "Column properties: sort by column", "level": "easy", "question": "In the Date table, the MonthName column (January, February, ...) appears in visuals in alphabetical order: April, August, December... The table also has a MonthNumber column (1-12).\nWhat should you do so months display in calendar order?", "options": ["Set the Sort by column property of MonthName to MonthNumber", "Mark the Date table as a date table", "Change the data type of MonthName to Date", "Set MonthName's Summarization to Don't summarize"], "answer": [0], "pick": 1, "tip": "Text sorts A-Z; to sort it any other way, give it a 'Sort by column' partner.", "why": ["Correct — Sort by column makes MonthName sort by the numeric MonthNumber, giving January-December everywhere the column is used.", "Wrong — Marking a date table enables time intelligence but does not change how a text column sorts.", "Wrong — \"January\" is not a valid date value, so the conversion would fail; and it isn't how display order is controlled.", "Wrong — Summarization affects aggregation of numbers, not the sort order of text."], "concept": "By default a text column sorts alphabetically. The Sort by column property lets a column borrow the order of another column in the same table, as long as each value maps to exactly one value in the sort column. Typical pairs: MonthName -> MonthNumber, DayName -> DayOfWeekNumber.", "learn": "Sort one column by another column in Power BI", "lesson": "", "cluster": "M2"}, {"id": "MD1-003", "domain": "Model the data", "topic": "Column properties: summarization", "level": "easy", "question": "The Sales table has a whole-number column FiscalYear. When a user drags it into a table visual, Power BI shows one row with a value like 4,048,150 (the sum of all years) instead of listing each year.\nWithout changing the data type, what should you do?", "options": ["Set the Data category of FiscalYear to Year", "Hide the FiscalYear column", "Set the Summarization (Summarize by) property of FiscalYear to Don't summarize", "Create a measure SUM(Sales[FiscalYear])"], "answer": [2], "pick": 1, "tip": "Numbers that are labels (years, IDs, codes) -> Don't summarize.", "why": ["Wrong — There is no 'Year' data category for this purpose; data categories describe geographic, URL and barcode meaning, not aggregation.", "Wrong — Hiding the column removes it from the Fields pane but doesn't fix how it aggregates when used.", "Correct — Don't summarize makes the column behave like a category, so each year is listed instead of being added up.", "Wrong — A SUM measure is exactly the unwanted behavior: adding years together is meaningless."], "concept": "Power BI applies a default aggregation (usually Sum) to numeric columns. For numeric columns that are really labels — years, IDs, postal codes, phone numbers — set Summarize by to Don't summarize so they group rather than add. Real measures of quantity (amount, quantity) should normally be wrapped in explicit DAX measures.", "learn": "Work with aggregates (sum, average, and so on) in Power BI", "lesson": "", "cluster": "M2"}, {"id": "MD1-004", "domain": "Model the data", "topic": "Hide fields", "level": "medium", "question": "Northwind's model has a Sales fact table related to Product and Customer on ProductKey and CustomerKey. Report authors keep using Sales[ProductKey] and Sales[CustomerKey] in visuals by mistake and get confusing results. They still need Sales[Quantity] and Sales[Amount], and the relationships must keep working.\nWhich TWO actions should you take? (Select TWO)", "options": ["Delete Product[ProductKey]", "Hide Sales[CustomerKey]", "Hide the entire Sales table", "Hide Sales[ProductKey]", "Set Sales[ProductKey] Summarization to Sum"], "answer": [1, 3], "pick": 2, "tip": "Hide the 'many-side' keys: relationships still work, the field list gets cleaner.", "why": ["Wrong — Deleting the key on the one side breaks the Product-Sales relationship.", "Correct — Same reason: the fact-table foreign key is only needed for the relationship, so hide it.", "Wrong — Hiding the whole table also hides Quantity and Amount, which authors still need.", "Correct — Hiding a foreign key removes it from the report field list while the relationship continues to work.", "Wrong — Summing a key produces meaningless numbers and still leaves the field visible."], "concept": "Hiding a field removes it from report view but keeps it in the model, so relationships, measures and RLS can still use it. A common best practice is to hide foreign key columns in fact tables (users filter with the dimension's attributes instead) and to hide raw numeric columns once explicit measures exist.", "learn": "Hide columns and tables in Power BI Desktop", "lesson": "", "cluster": "M2"}, {"id": "MD1-005", "domain": "Model the data", "topic": "Display folders", "level": "easy", "question": "Contoso's Sales table contains 45 measures. Users find the list hard to navigate. You want to group the measures into collapsible groups such as \"Revenue\", \"Margin\" and \"Targets\" while keeping them in the Sales table.\nWhat should you use?", "options": ["A hierarchy", "Sort by column", "The Display folder property of each measure", "A calculated column for each group"], "answer": [2], "pick": 1, "tip": "Display folders = folders in the Fields pane, nothing more.", "why": ["Wrong — Hierarchies combine columns for drill-down; measures can't be put in a hierarchy.", "Wrong — Sort by column orders the values of a column, not fields in the Fields pane.", "Correct — The Display folder property groups fields into folders (and subfolders) in the Fields pane without changing the model.", "Wrong — A calculated column adds data to every row and does not organize measures."], "concept": "Display folders are a purely cosmetic property for columns and measures, set in the Properties pane of Model view. You can nest them with a backslash (e.g. Revenue\\YTD). They make large models easier to browse but do not affect calculations or performance.", "learn": "Work with Model view in Power BI Desktop", "lesson": "", "cluster": "M2"}, {"id": "MD1-006", "domain": "Model the data", "topic": "Relationship cardinality", "level": "easy", "question": "The Product table has one row per ProductKey (each key is unique). The Sales table has many rows per ProductKey, one per sale line.\nWhat cardinality should the relationship between Product[ProductKey] and Sales[ProductKey] have?", "options": ["One-to-one", "Many-to-many", "One-to-many (Product on the one side, Sales on the many side)", "No relationship; use a measure with LOOKUPVALUE instead"], "answer": [2], "pick": 1, "tip": "Unique key in the dimension, repeated key in the fact = 1:*.", "why": ["Wrong — One-to-one requires unique values on BOTH sides; Sales repeats ProductKey.", "Wrong — Many-to-many is for when neither side has unique values; it's less efficient and not needed here.", "Correct — ProductKey is unique in Product (one side) and repeats in Sales (many side), which is the classic dimension-to-fact relationship.", "Wrong — A relationship is the normal, efficient way to filter facts by dimension attributes; avoid replacing it with lookups."], "concept": "Cardinality describes how many rows on each side match. One-to-many (1:*) is the most common and recommended: a dimension table with a unique key filters a fact table where the key repeats. If the 'one' side contains duplicate keys, Power BI can't create 1:* — which is why you check key uniqueness during profiling.", "learn": "Model relationships in Power BI Desktop", "lesson": "Lesson 6 ⏱ 00:46:02", "cluster": "M1"}, {"id": "MD1-007", "domain": "Model the data", "topic": "One-to-one relationships", "level": "medium", "question": "Adventure Works has a Product table and a ProductDetails table. Both have exactly one row per ProductKey and every product appears in both. Power BI created a one-to-one relationship between them.\nWhat is the recommended way to model this?", "options": ["Change the relationship to many-to-many", "Relate ProductDetails directly to the Sales table instead of to Product", "Keep the one-to-one relationship and change its cross-filter direction to Single", "Merge the ProductDetails columns into the Product table in Power Query and remove ProductDetails"], "answer": [3], "pick": 1, "tip": "Two tables describing the same thing, row for row? Make them one table.", "why": ["Wrong — Both keys are unique, so many-to-many is the wrong cardinality and adds overhead.", "Wrong — That creates a second path to Sales and still leaves product attributes split across two tables.", "Wrong — A one-to-one relationship always cross-filters in both directions; Single isn't available for this cardinality.", "Correct — When two tables share the same grain, merging them gives one clean Product dimension, simpler navigation and fewer relationships."], "concept": "A one-to-one relationship means the key is unique on both sides. Such relationships are always bi-directional. When both tables describe the same entity at the same grain, Microsoft's guidance is usually to combine them into a single dimension table so users see all attributes in one place and the model stays a simple star.", "learn": "One-to-one relationship guidance", "lesson": "", "cluster": "M1"}, {"id": "MD1-008", "domain": "Model the data", "topic": "Many-to-many and granularity", "level": "medium", "question": "Contoso's Budget table has one row per Category per month. The Product table has one row per product, and many products share the same Category. You try to relate Budget[Category] to Product[Category].\nWhich cardinality will this relationship need?", "options": ["One-to-many from Budget to Product", "One-to-many from Product to Budget", "One-to-one", "Many-to-many"], "answer": [3], "pick": 1, "tip": "Neither column unique? Then it's *:* (or add a unique Category table).", "why": ["Wrong — Budget[Category] repeats across months, so Budget can't be the one side.", "Wrong — Product[Category] is not unique, so Product can't be the one side.", "Wrong — One-to-one needs unique values on both sides; neither is unique.", "Correct — Category repeats in Product (many products per category) and in Budget (many months per category), so neither side is unique."], "concept": "Granularity (grain) is the level of detail of a table's rows. When a fact table is stored at a higher grain than a dimension (budget by category vs products), the matching column isn't unique on either side. You can use a many-to-many relationship, or create a separate Category dimension with unique categories and relate both tables to it with one-to-many relationships.", "learn": "Many-to-many relationship guidance", "lesson": "", "cluster": "M1"}, {"id": "MD1-009", "domain": "Model the data", "topic": "Granularity mismatch: date", "level": "hard", "question": "Sales is stored per day and is related to a Date table (one row per day). A new Targets table stores one row per Month per Store (columns: Year, MonthNumber, StoreKey, TargetAmount). You need to filter targets with the same Date table slicers (Year, Month) used for sales.\nWhat should you do?", "options": ["Create a relationship between Targets and Sales on StoreKey so dates flow from Sales", "Create a relationship from Date[Date] to Targets[MonthNumber]", "Leave Targets unrelated; slicers on the Date table will still filter it", "Add a column to Targets containing the first date of each month, create a one-to-many relationship from Date[Date] to it, and make target measures return BLANK below month level"], "answer": [3], "pick": 1, "tip": "Higher-grain fact? Give it a 'first day of period' date key and relate to the Date table.", "why": ["Wrong — Relating two fact tables directly is poor design and does not give Targets a proper date filter.", "Wrong — Date[Date] holds dates and MonthNumber holds 1-12; the values don't match, and MonthNumber repeats every year.", "Wrong — Filters only propagate along relationships; an unrelated table isn't filtered by Date slicers.", "Correct — A month-start date matches exactly one Date row, giving a valid one-to-many relationship; hiding day-level results prevents misleading daily targets."], "concept": "Facts don't always share the same grain. A common pattern for a monthly fact is to store a date key representing the period (such as the first day of the month) and relate it to the daily Date table. Because the target belongs to the whole month, measures should hide or warn about values at day level, while Year and Month filters work naturally.", "learn": "Model relationships in Power BI Desktop (relate higher grain facts)", "lesson": "", "cluster": "P4"}, {"id": "MD1-010", "domain": "Model the data", "topic": "Cross-filter direction", "level": "medium", "question": "A colleague wants to set every relationship in a large star-schema model to cross-filter direction Both \"so all slicers filter everything\".\nWhich TWO are real risks of doing this? (Select TWO)", "options": ["It can slow down query performance", "Measures can no longer be created on fact tables", "It can create ambiguous filter paths between tables, giving unexpected results or preventing some relationships from being created/active", "Row-level security will stop working in the model", "The model can no longer be refreshed"], "answer": [0, 2], "pick": 2, "tip": "Single by default; Both only when you truly need it.", "why": ["Correct — Filters that flow both ways mean more work for the engine, which can make visuals slower.", "Wrong — Cross-filter direction has nothing to do with whether measures can be created.", "Correct — Bi-directional filters add extra filter paths; with several of them Power BI may face ambiguity and results can be confusing.", "Wrong — RLS still works; there is even an option to apply security filters in both directions on a relationship.", "Wrong — Refresh is unaffected by filter direction."], "concept": "Cross-filter direction controls which way filters flow across a relationship. Single (dimension filters fact) is the default and best practice for star schemas. Both lets the fact filter the dimension too, which is occasionally useful (e.g. some many-to-many designs) but can cause ambiguity and slower queries, so enable it only where needed — or use CROSSFILTER inside a specific measure.", "learn": "Bi-directional relationship guidance", "lesson": "", "cluster": "M1"}, {"id": "MD1-011", "domain": "Model the data", "topic": "Cross-filter direction", "level": "hard", "question": "Customer relates to Sales (one-to-many, single direction) and Product relates to Sales (one-to-many, single direction). On a report page, when a user picks a product in a Product slicer, the Customer slicer should list only customers who bought that product. You must NOT change any relationship to bi-directional.\nWhat should you do?", "options": ["Add a visual-level filter to the Customer slicer using a measure such as [Sales Quantity] is not blank", "Mark the Customer table as a date table", "Add a hierarchy that contains Customer[Name] and Product[Name]", "Set the Product slicer's Summarization to Don't summarize"], "answer": [0], "pick": 1, "tip": "Want a slicer to show only 'items with data'? Filter the slicer with a measure.", "why": ["Correct — The measure is evaluated in the current filter context (including the product selection), so only customers with sales remain in the slicer.", "Wrong — Mark as date table only applies to a table with a date column and has nothing to do with this requirement.", "Wrong — Hierarchies must use columns from a single table and do not control slicer cross-filtering.", "Wrong — Summarization doesn't affect which values a slicer lists."], "concept": "With single-direction relationships, filters flow from dimensions to the fact, not from one dimension through the fact to another dimension. Instead of making relationships bi-directional, you can filter a slicer with a measure (e.g. 'is not blank'), which keeps the model simple and only affects that visual.", "learn": "Bi-directional relationship guidance", "lesson": "", "cluster": "M1"}, {"id": "MD1-012", "domain": "Model the data", "topic": "Active vs inactive relationships", "level": "easy", "question": "Sales has two date columns, OrderDate and ShipDate. You create a relationship from Date[Date] to each one. In Model view, the second relationship is shown as a dashed line.\nWhy?", "options": ["ShipDate contains blank values", "Only one relationship between two tables can be active at a time, so the second one is inactive", "A table can have only one relationship in total", "The two columns have different data types"], "answer": [1], "pick": 1, "tip": "Dashed line = inactive. One active path between two tables.", "why": ["Wrong — Blanks don't make a relationship inactive.", "Correct — Power BI allows only one active relationship between the same two tables so the filter path is unambiguous; others are inactive (dashed).", "Wrong — A table can have many relationships (e.g. Sales to Date, Product and Customer); the limit is on active paths between the same tables.", "Wrong — Mismatched data types would block or break the relationship, not mark it inactive."], "concept": "An inactive relationship exists in the model but does not filter by default. It is used only when a DAX measure explicitly activates it with USERELATIONSHIP inside CALCULATE. This is the classic setup for a role-playing Date dimension with order date, ship date and due date.", "learn": "Model relationships in Power BI Desktop", "lesson": "", "cluster": "M1"}, {"id": "MD1-013", "domain": "Model the data", "topic": "USERELATIONSHIP", "level": "medium", "question": "Date[Date] has an active relationship to Sales[OrderDate] and an inactive relationship to Sales[ShipDate]. [Total Sales] is defined as SUM(Sales[Amount]).\nWhich measure returns sales by ship date when used with Date columns in a visual?", "options": ["```\nSales by Ship Date =\nUSERELATIONSHIP ( Sales[ShipDate], 'Date'[Date] )\n```", "```\nSales by Ship Date =\nCALCULATE ( [Total Sales], CROSSFILTER ( Sales[ShipDate], 'Date'[Date], BOTH ) )\n```", "```\nSales by Ship Date =\nCALCULATE ( [Total Sales], USERELATIONSHIP ( Sales[ShipDate], 'Date'[Date] ) )\n```", "```\nSales by Ship Date =\nCALCULATE ( [Total Sales], ALL ( Sales[OrderDate] ) )\n```"], "answer": [2], "pick": 1, "tip": "Inactive relationship? CALCULATE + USERELATIONSHIP.", "why": ["Wrong — USERELATIONSHIP returns no value by itself; it can only be used as a filter argument inside CALCULATE (or similar functions).", "Wrong — CROSSFILTER changes the filter direction of a relationship; it does not activate an inactive one.", "Correct — USERELATIONSHIP, used as a CALCULATE modifier, activates the ShipDate relationship for this measure only.", "Wrong — Removing filters on OrderDate doesn't make the Date filter flow through ShipDate."], "concept": "USERELATIONSHIP(column1, column2) tells CALCULATE to use an existing inactive relationship for that calculation, temporarily overriding the active one. The order of the two columns doesn't matter, but the relationship must already exist in the model.", "learn": "USERELATIONSHIP function (DAX)", "lesson": "", "cluster": "M1"}, {"id": "MD1-014", "domain": "Model the data", "topic": "Role-playing dimensions", "level": "hard", "question": "Report users need two slicers on the same page: Order Year and Ship Year. Selecting 2025 in Order Year and 2026 in Ship Year must show orders placed in 2025 that shipped in 2026. Today the model has one Date table with an active relationship to Sales[OrderDate] and an inactive one to Sales[ShipDate].\nWhat should you do?", "options": ["Create a second date table (e.g. 'Ship Date') and give it an active relationship to Sales[ShipDate]", "Make both relationships from Date to Sales active", "Write all measures with USERELATIONSHIP on ShipDate", "Change the Date-to-Sales relationship to bi-directional"], "answer": [0], "pick": 1, "tip": "Need to slice by two date roles at the same time? Give each role its own table.", "why": ["Correct — A separate Ship Date table lets each slicer filter Sales through its own active relationship, independently and at the same time.", "Wrong — Only one relationship between two tables can be active.", "Wrong — Then measures would use ShipDate instead of OrderDate; one Date table still can't hold two different year selections at once.", "Wrong — Filter direction doesn't create a second, independent date filter."], "concept": "A role-playing dimension is one dimension used in several roles (order date, ship date, due date). You can handle roles with inactive relationships + USERELATIONSHIP, or by creating one copy of the dimension per role (for example a calculated table or Power Query reference). Copies are needed when users must filter by several roles simultaneously; rename columns clearly (e.g. 'Ship Year').", "learn": "Star schema and the importance for Power BI (role-playing dimensions)", "lesson": "", "cluster": "M1"}, {"id": "MD1-015", "domain": "Model the data", "topic": "Mark as date table", "level": "medium", "question": "You want to mark your Calendar table as a date table using its Date column.\nWhich THREE conditions must the Date column meet? (Select THREE)", "options": ["It has no missing dates between the first and last date", "The table must be created with CALENDARAUTO", "It uses the Text data type", "It contains unique values", "It contains no blank values", "The table must be named \"Date\""], "answer": [0, 3, 4], "pick": 3, "tip": "Mark as date table: unique, no blanks, no gaps, Date type.", "why": ["Correct — Dates must be contiguous: every day between the first and last date must exist.", "Wrong — The table can come from anywhere: CALENDAR, CALENDARAUTO, Power Query or the data warehouse.", "Wrong — The column must be a Date or Date/Time type, not text.", "Correct — Each date must appear once.", "Correct — Blank dates are not allowed.", "Wrong — The table can have any name."], "concept": "Marking a table as a date table tells Power BI which table and column to use for dates and time intelligence. Power BI validates that the column is Date/Date-Time, unique, has no blanks and has no gaps. In practice, date tables usually cover whole years so functions like TOTALYTD behave as expected.", "learn": "Set and use date tables in Power BI Desktop", "lesson": "", "cluster": "M2"}, {"id": "MD1-016", "domain": "Model the data", "topic": "Auto date/time", "level": "medium", "question": "Your model has a proper Date table marked as a date table. The model also has 12 other date columns across several tables. The file is larger than expected.\nWhy is it recommended to turn off the Auto date/time option for this file?", "options": ["Auto date/time stops the model from being refreshed in the Power BI service", "Auto date/time creates a hidden date table for each date column, which increases model size and duplicates the calendar", "Auto date/time prevents you from marking a table as a date table", "Auto date/time disables DAX time-intelligence functions"], "answer": [1], "pick": 1, "tip": "Own Date table? Turn off Auto date/time.", "why": ["Wrong — Auto date/time doesn't affect refresh in the service.", "Correct — Each eligible date column gets its own hidden date table, which wastes memory and gives separate, unshared calendars.", "Wrong — You can mark a date table whether or not Auto date/time is on.", "Wrong — Time-intelligence functions still work; a shared marked Date table is the recommended way to use them."], "concept": "Auto date/time is a convenience for simple models: Power BI adds a hidden date table with a Year-Quarter-Month-Day hierarchy for every date column. In a modeled solution with one shared Date table, those hidden tables only add size and can't filter several fact tables together, so disable it in Options (Data Load > Time intelligence).", "learn": "Auto date/time guidance in Power BI Desktop", "lesson": "", "cluster": "M2"}, {"id": "MD1-017", "domain": "Model the data", "topic": "Create a date table with DAX", "level": "easy", "question": "You need a calculated table that contains one row for every day from 1 January 2022 to 31 December 2026.\nWhich DAX expression should you use?", "options": ["```\nDate = CALENDAR ( DATE ( 2022, 1, 1 ), DATE ( 2026, 12, 31 ) )\n```", "```\nDate = CALENDARAUTO ( 2022 )\n```", "```\nDate = CALENDAR ( 2022, 2026 )\n```", "```\nDate = DATE ( 2022, 1, 1 ) - DATE ( 2026, 12, 31 )\n```"], "answer": [0], "pick": 1, "tip": "CALENDAR(start, end) = you choose the range; CALENDARAUTO = Power BI chooses.", "why": ["Correct — CALENDAR returns a single Date column with every day between the two dates you supply.", "Wrong — CALENDARAUTO's optional argument is the fiscal-year-end month (1-12), not a start year.", "Wrong — CALENDAR needs date values; 2022 and 2026 would be read as date serial numbers (days after 30 Dec 1899), giving dates in 1905, not years.", "Wrong — Subtracting dates returns a single number (days between them), not a table."], "concept": "CALENDAR(<start>, <end>) creates a one-column table of contiguous dates over an explicit range. You then add columns such as Year, MonthNumber and MonthName and mark it as a date table. Explicit ranges keep the table predictable.", "learn": "CALENDAR function (DAX)", "lesson": "", "cluster": "M2"}, {"id": "MD1-018", "domain": "Model the data", "topic": "CALENDARAUTO", "level": "medium", "question": "You create Date = CALENDARAUTO(). Sales data only covers 2023 to 2025, but the new table starts in 1948. The model also has a Customer[BirthDate] column imported from the source.\nWhat explains this, and what is a better approach?", "options": ["CALENDARAUTO scans date columns across the model, including BirthDate; use CALENDAR with the first and last sales dates instead", "The Sales table contains a corrupted date; delete the Sales relationship", "CALENDARAUTO uses the system clock; change the computer's date settings", "CALENDARAUTO always starts in 1900; filter the table in Power Query"], "answer": [0], "pick": 1, "tip": "CALENDARAUTO looks at EVERY date column — birthdays included.", "why": ["Correct — CALENDARAUTO covers the full years of all dates found in model columns (not calculated columns/tables), so old birth dates stretch the range; CALENDAR gives you control.", "Wrong — Nothing in the scenario points to a bad Sales date; the birth dates explain the range.", "Wrong — CALENDARAUTO is based on model data, not the system clock.", "Wrong — CALENDARAUTO doesn't have a fixed 1900 start; it follows the data. Also you can't filter a DAX calculated table in Power Query."], "concept": "CALENDARAUTO([fiscal_year_end_month]) builds a date range covering complete years of all dates in the model's imported date columns. It's convenient but can be surprised by unrelated dates such as birth dates or far-future 'end dates' (e.g. 9999-12-31). CALENDAR with explicit or MIN/MAX-based bounds is more predictable.", "learn": "CALENDARAUTO function (DAX)", "lesson": "", "cluster": "M2"}, {"id": "MD1-019", "domain": "Model the data", "topic": "Measures vs calculated columns", "level": "easy", "question": "You need a Profit Margin % value that changes when users select different years, regions or products in slicers.\nWhat should you create?", "options": ["A calculated column in the Sales table", "A measure", "A calculated table", "A hierarchy"], "answer": [1], "pick": 1, "tip": "Reacts to slicers = measure. Fixed per row = column.", "why": ["Wrong — A calculated column is computed per row at refresh; summing per-row percentages gives wrong results and doesn't respond as a ratio.", "Correct — Measures are evaluated at query time in the current filter context, so the margin recalculates for every slicer selection.", "Wrong — A calculated table is computed at refresh and doesn't react to slicers.", "Wrong — A hierarchy organizes columns for drill-down; it doesn't calculate anything."], "concept": "A measure is a DAX formula evaluated when a visual is queried, using the filter context coming from slicers, rows, columns and filters. Ratios like margin % must be measures: DIVIDE(SUM(profit), SUM(revenue)) gives the correct ratio at any level, while averaging row-level percentages does not.", "learn": "Create measures for data analysis in Power BI Desktop", "lesson": "Lesson 5 ⏱ 01:56:47", "cluster": "M3"}, {"id": "MD1-020", "domain": "Model the data", "topic": "Calculated columns", "level": "medium", "question": "Product managers want a Price Band (Low, Medium, High) for each product, based on the product's list price, and they want to use Price Band on a slicer and on chart axes.\nWhat should you create in the model?", "options": ["An inactive relationship", "A measure", "A display folder", "A calculated column in the Product table"], "answer": [3], "pick": 1, "tip": "Need to slice or group BY it? It must be a column, not a measure.", "why": ["Wrong — Relationships don't create new attribute values.", "Wrong — Measures return aggregated values and cannot be used as slicer items or axis categories.", "Wrong — Display folders only organize the Fields pane.", "Correct — A calculated column stores a fixed value per product, so it can be placed on slicers and axes (a Power Query custom column would also work)."], "concept": "Use a column (calculated column in DAX or custom column in Power Query) when the value belongs to each row and you want to filter, group or slice by it. Use a measure when the value is an aggregation that should change with filter context. When possible, create such columns in Power Query or the source for better compression.", "learn": "Create calculated columns in Power BI Desktop", "lesson": "", "cluster": "M3"}, {"id": "MD1-021", "domain": "Model the data", "topic": "Calculated columns", "level": "medium", "question": "Which TWO statements about DAX calculated columns are true? (Select TWO)", "options": ["They are not saved in the model and take no storage", "They are computed during data refresh and stored in the model, so they use memory", "They are evaluated row by row (row context) for the table they belong to", "They are recalculated every time a user changes a slicer", "They cannot reference columns from any other table"], "answer": [1, 2], "pick": 2, "tip": "Calculated column: computed at refresh, stored, row by row.", "why": ["Wrong — That describes measures; calculated columns are stored and add to model size.", "Correct — Calculated columns are materialized when the table is refreshed and stored like any other column.", "Correct — The formula runs once for each row of its table, using that row's values.", "Wrong — Slicers don't recompute calculated columns; that's how measures behave.", "Wrong — They can use functions such as RELATED to read from a related table."], "concept": "Calculated columns, measures and calculated tables are all DAX, but they behave differently. Columns and tables are computed at refresh and stored (costing memory); measures are computed at query time and store only their formula. Choose the one that matches when and how the result should be computed.", "learn": "Calculated columns vs measures in DAX", "lesson": "", "cluster": "M3"}, {"id": "MD1-022", "domain": "Model the data", "topic": "Calculated columns: RELATED", "level": "medium", "question": "Sales and Product are related one-to-many on ProductKey (Product on the one side). You need a calculated column in the Sales table that shows each sale's product Category.\nWhich DAX expression should you use?", "options": ["```\nCategory = Product[Category]\n```", "```\nCategory = RELATED ( Product[Category] )\n```", "```\nCategory = RELATEDTABLE ( Product )\n```", "```\nCategory = VALUES ( Product[Category] )\n```"], "answer": [1], "pick": 1, "tip": "From the many side, look up the one side with RELATED.", "why": ["Wrong — You can't reference a column of another table directly in row context; Power BI can't tell which Product row to use.", "Correct — RELATED follows the existing relationship from the current Sales row to its single Product row and returns the Category.", "Wrong — RELATEDTABLE returns a table of rows from the many side; it's used from the one side, and a column can't hold a table.", "Wrong — Without a filter for the current row, VALUES returns all categories, causing an error when more than one exists."], "concept": "In a calculated column you are in row context on one table. To fetch a value from the one side of a relationship, use RELATED. To go the other way (one side looking at many rows), use RELATEDTABLE with an aggregation such as COUNTROWS(RELATEDTABLE(Sales)).", "learn": "RELATED function (DAX)", "lesson": "", "cluster": "M3"}, {"id": "MD1-023", "domain": "Model the data", "topic": "Star schema", "level": "medium", "question": "Which TWO are benefits of designing a Power BI model as a star schema (fact tables surrounded by dimension tables)? (Select TWO)", "options": ["You no longer need a date table", "The model no longer needs to be refreshed", "Simpler, more predictable filtering and simpler DAX measures", "Better compression and faster queries than one very wide flat table with repeated attributes", "All relationships can be many-to-many without any downside"], "answer": [2, 3], "pick": 2, "tip": "Star = dimensions filter facts. Simple, fast, compact.", "why": ["Wrong — A Date dimension is itself a key part of a star schema.", "Wrong — Schema design doesn't affect whether Import data needs refreshing.", "Correct — Filters flow from dimensions to facts along clear one-to-many paths, which makes measures easier to write and results easier to trust.", "Correct — Descriptive attributes are stored once per dimension row instead of repeating on every fact row, which compresses better and speeds queries.", "Wrong — Star schemas rely on one-to-many relationships; many-to-many is a special case with trade-offs."], "concept": "A star schema separates facts (events with numeric values, e.g. sales lines) from dimensions (descriptive tables like Product, Customer, Date). Dimensions filter facts through one-to-many relationships. Power BI's engine and DAX are optimized for this shape, so it is Microsoft's recommended modeling approach.", "learn": "Understand star schema and the importance for Power BI", "lesson": "", "cluster": "P4"}, {"id": "MD1-024", "domain": "Model the data", "topic": "Star schema", "level": "medium", "question": "Northwind loads one flat table with 60 columns: each sales line repeats the customer name, customer city, product name, product category and supplier. Measures are getting complicated and the model is large.\nWhat should you do?", "options": ["In Power Query, split the data into a Sales fact table plus Customer and Product dimension tables, and relate them with one-to-many relationships", "Keep the flat table and set every column's Summarization to Don't summarize", "Create a calculated table that copies the flat table", "Turn on Auto date/time"], "answer": [0], "pick": 1, "tip": "Flat and wide -> split into fact + dimensions.", "why": ["Correct — Moving repeated descriptive columns into dimensions creates a star schema, which is smaller and easier to write DAX against.", "Wrong — Summarization settings don't change the table's structure or size.", "Wrong — Copying the table doubles memory use and fixes nothing.", "Wrong — Auto date/time adds hidden tables and doesn't address the flat design."], "concept": "Normalizing a flat extract into a star schema means: keep keys and numeric columns in the fact table; move descriptive attributes into dimension tables with one row per entity and a unique key. Power Query (Reference + Remove duplicates, or source views) is the usual place to do this.", "learn": "Understand star schema and the importance for Power BI", "lesson": "", "cluster": "P4"}, {"id": "MD1-025", "domain": "Model the data", "topic": "Snowflake vs star", "level": "medium", "question": "Your model has Product -> Subcategory -> Category as three chained tables (a snowflake), each related one-to-many. Users find it confusing to search three tables for product attributes, and you want a simpler star schema.\nWhat should you do?", "options": ["Relate Category directly to the Sales table as well", "Merge Subcategory and Category columns into the Product table in Power Query, creating one denormalized Product dimension", "Hide the Product table", "Set all three relationships to bi-directional"], "answer": [1], "pick": 1, "tip": "Snowflake chains -> flatten into one dimension.", "why": ["Wrong — Category has no key in Sales, and an extra path would create ambiguity.", "Correct — Denormalizing the chain gives one Product dimension with Product, Subcategory and Category columns, simplifying navigation and filter paths.", "Wrong — Hiding Product hides the attributes users need.", "Wrong — Bi-directional filters add ambiguity and don't make the model easier to use."], "concept": "A snowflake schema normalizes dimensions into several related tables. Power BI works with it, but a star schema usually performs better and is easier for report authors. Merging related lookup tables into a single dimension table (denormalizing) is the standard fix and also allows a single-table hierarchy Category > Subcategory > Product.", "learn": "Understand star schema and the importance for Power BI", "lesson": "", "cluster": "P4"}, {"id": "MD1-026", "domain": "Model the data", "topic": "Hierarchies", "level": "medium", "question": "You want a drill-down hierarchy Category > Subcategory > Product Name. Product Name is in the Product table, but Category is in a separate Category table. When you try to add Category to a hierarchy in the Product table, you can't.\nWhy?", "options": ["A hierarchy can only contain columns from a single table", "Category must be a measure to be used in a hierarchy", "Hierarchies can only have two levels", "Hierarchies can only contain date columns"], "answer": [0], "pick": 1, "tip": "Hierarchy = levels from ONE table.", "why": ["Correct — All levels of a hierarchy must come from the same table; bring Category into Product (e.g. merge in Power Query or a RELATED column) first.", "Wrong — Measures can't be hierarchy levels; levels are columns.", "Wrong — Hierarchies can have more than two levels.", "Wrong — Any column type can be a level, e.g. Category and Product Name text columns."], "concept": "A hierarchy is a named, ordered set of columns (e.g. Year > Quarter > Month, or Category > Subcategory > Product) that enables drill-down in visuals. Because its levels must live in one table, denormalized dimension tables make hierarchies easy to build.", "learn": "Create and use hierarchies in Power BI Desktop", "lesson": "", "cluster": "M2"}, {"id": "MD1-027", "domain": "Model the data", "topic": "Performance Analyzer", "level": "easy", "question": "A report page takes several seconds to load. You want to see, for each visual on the page, how long its DAX query and its rendering take.\nWhich Power BI Desktop tool should you use?", "options": ["Lineage view", "Performance Analyzer", "Q&A", "Query diagnostics in Power Query Editor"], "answer": [1], "pick": 1, "tip": "Slow visual? Performance Analyzer -> Start recording -> Refresh visuals.", "why": ["Wrong — Lineage view in the service shows dependencies between items, not timings.", "Correct — Performance Analyzer records each visual's duration, split into DAX query, Visual display and Other.", "Wrong — Q&A lets users ask natural-language questions; it doesn't measure performance.", "Wrong — Query diagnostics analyze Power Query (refresh/transform) steps, not report visuals."], "concept": "Performance Analyzer (Optimize ribbon / View pane) records what happens when you interact with or refresh visuals. For each visual it shows timings and lets you copy the DAX query, so you can find which visual or measure is slow before optimizing.", "learn": "Use Performance Analyzer to examine report element performance", "lesson": "", "cluster": "M6"}, {"id": "MD1-028", "domain": "Model the data", "topic": "Performance Analyzer", "level": "hard", "question": "Performance Analyzer shows these timings for a slow table visual:\nDAX query: 60 ms\nVisual display: 4,200 ms\nOther: 150 ms\nThe visual lists every individual transaction (hundreds of thousands of rows).\nWhat is the most likely cause, and the best first fix?", "options": ["Too many relationships; set them all to bi-directional", "The data source is slow; switch to DirectQuery", "Rendering too many data points; reduce the rows shown (e.g. summarize, filter, or use a drill-through for details)", "A slow DAX measure; rewrite the measure"], "answer": [2], "pick": 1, "tip": "Big 'Visual display' = too much to draw; big 'DAX query' = slow calculation.", "why": ["Wrong — Bi-directional filters don't reduce rendering and can make queries slower.", "Wrong — DirectQuery would usually make queries slower, and the query time is already small.", "Correct — Almost all time is in Visual display, so drawing the huge number of rows is the bottleneck; showing less detail fixes it.", "Wrong — The DAX query took only 60 ms, so the calculation is not the problem."], "concept": "Performance Analyzer splits time into DAX query (engine computing the result), Visual display (the visual drawing the result) and Other (waiting on other operations). Read the biggest number first: optimize DAX/model when the query is slow, reduce data points or visual complexity when display is slow, and reduce the number of visuals when 'Other' grows.", "learn": "Use Performance Analyzer to examine report element performance", "lesson": "", "cluster": "M6"}, {"id": "MD1-029", "domain": "Model the data", "topic": "DAX query view", "level": "medium", "question": "You copied the DAX query of a slow visual from Performance Analyzer. You want to run it, edit it and test a modified measure definition inside Power BI Desktop, without installing external tools.\nWhere should you paste it?", "options": ["DAX query view", "Power Query Editor", "The Q&A visual", "Table view"], "answer": [0], "pick": 1, "tip": "EVALUATE lives in DAX query view.", "why": ["Correct — DAX query view lets you run EVALUATE queries, define query-scoped measures and see results, all inside Desktop.", "Wrong — Power Query Editor uses the M language for data preparation, not DAX queries.", "Wrong — Q&A takes natural-language questions, not DAX code.", "Wrong — Table view shows table data and lets you create columns/measures, but it doesn't run DAX queries."], "concept": "DAX query view is a Power BI Desktop view for writing DAX queries (EVALUATE ...), with DEFINE MEASURE for testing measure variants before updating the model. Together with Performance Analyzer it's a built-in way to troubleshoot and tune slow measures.", "learn": "DAX query view in Power BI Desktop", "lesson": "", "cluster": "M6"}, {"id": "MD1-030", "domain": "Model th
