      <div class="panel" style="display:grid;gap:10px"><h3 style="font-size:17px">Half mock</h3><p class="sub">25 questions · 50 minutes</p><div><button class="btn" type="button" data-exam="25">Start half mock</button></div></div>
    </div>
    <p class="small">The real exam is scored out of 1,000 and the pass mark is 700. Your mock score is shown on the same scale (percentage correct × 10) as a rough guide only, since Microsoft weights questions differently.</p>
    <div class="panel"><h3>Past mocks</h3>${hist.length ? `<div class="tablewrap"><table><thead><tr><th>Date</th><th class="num">Score</th><th class="num">Correct</th><th class="num">Time used</th><th></th></tr></thead><tbody>${hist.map(e => `<tr><td>${fmtDate(e.start.slice(0,10))} ${fmtTime(e.start)}</td><td class="num ${e.score >= 700 ? "pass" : "fail"}"><b>${e.score}</b></td><td class="num">${e.right}/${e.size}</td><td class="num">${Math.round(e.secs/60)} min</td><td><button class="linkbtn" type="button" data-review="${e.id}">Review</button></td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">No mock exams yet.</p>`}</div>
  </div>`;
}
function examRunner(){
  const E = S.exam, q = BYID[E.qids[E.i]], sel = E.ans[q.id] || [];
  const answered = E.qids.filter(id => hasAns(E.ans[id])).length;
  const grid = E.qids.map((id, i) => `<button class="qc ${hasAns(E.ans[id]) ? "done" : ""} ${i === E.i ? "cur" : ""} ${E.flags[id] ? "flag" : ""}" type="button" data-qi="${i}" aria-label="Question ${i+1}">${i+1}</button>`).join("");
  return `<div class="examgrid">
    <div class="col" style="max-width:none;margin:0">
      ${questionHTML(q, {sel, answered: null, shown: true, counter: `Question ${E.i + 1} of ${E.qids.length}`, feedback:false,
        extraMeta: `<button class="flagbtn" type="button" data-act="eflag" aria-pressed="${!!E.flags[q.id]}" style="margin-left:auto">${E.flags[q.id] ? "⚑ Flagged" : "⚐ Flag for review"}</button>`,
        actions: `<div class="nav"><button class="btn" type="button" data-act="eprev" ${E.i ? "" : "disabled"}>← Previous</button><span class="sp"></span>${E.i < E.qids.length - 1 ? `<button class="btn primary" type="button" data-act="enext">Next →</button>` : `<button class="btn primary" type="button" data-act="esubmit">Finish exam</button>`}</div>`})}
    </div>
    <aside class="examside">
      <div class="panel" style="display:grid;gap:8px"><span class="small">Time left</span><span class="timer" id="timer">--:--</span><span class="small">${answered} of ${E.qids.length} answered · ${Object.keys(E.flags).length} flagged</span></div>
      <div class="panel" style="display:grid;gap:10px"><div class="qgrid">${grid}</div>
        ${E.confirm ? `<div class="confirm"><span>${E.qids.length - answered ? `${E.qids.length - answered} question${E.qids.length - answered === 1 ? " is" : "s are"} unanswered and will count as wrong. ` : ""}Submit now?</span><div class="row"><button class="btn primary" type="button" data-act="esubmit-yes">Submit</button><button class="btn" type="button" data-act="esubmit-no">Keep going</button></div></div>`
        : `<button class="btn" type="button" data-act="esubmit">Submit exam</button>`}
        <button class="linkbtn" type="button" data-act="eabandon" style="justify-self:start;font-size:13px">Abandon this mock</button></div>
    </aside>
  </div>`;
}
function submitExam(){
  const E = S.exam; if (!E || E.done) return;
  const end = Date.now(), secs = Math.min(Math.round((end - (E.deadline - E.minutes*60000)) / 1000), E.minutes * 60);
  const per = Math.max(1000, secs * 1000 / E.qids.length);
  let right = 0; const byDomain = {}, byCluster = {};
  for (const id of E.qids){
    const q = BYID[id], sel = normSel(q, E.ans[id] || []);
    const ok = isRight(q, sel);
    if (ok) right++;
    (byDomain[q.domain] ||= {r:0, n:0}).n++; if (ok) byDomain[q.domain].r++;
    (byCluster[q.cluster] ||= {r:0, n:0}).n++; if (ok) byCluster[q.cluster].r++;
    record(id, sel, ok, per, "exam");
  }
  const doc = {id: E.id, start: E.start, end: new Date(end).toISOString(), size: E.qids.length, minutes: E.minutes, secs, right, score: Math.round(1000 * right / E.qids.length), qids: E.qids, ans: E.ans, flags: E.flags, byDomain, byCluster};
  S.docs["exam-" + E.id] = doc; persist("exam-" + E.id);
  clearActiveExam(); S.exam = {...doc, done:true, reviewFilter:"wrong"}; render(); window.scrollTo({top:0});
}
function examResults(E){
  const pass = E.score >= 700;
  const doms = DOMAINS.map(d => { const x = E.byDomain[d.key] || {r:0,n:0}; return `<tr><td>${esc(d.short)}</td><td class="num">${x.r}/${x.n}</td><td style="width:45%"><span class="meter"><i class="${pct(x.r,x.n) >= 70 ? "m-ok" : "m-bad"}" style="width:${pct(x.r,x.n)}%"></i></span></td><td class="num">${pct(x.r,x.n)}%</td></tr>`; }).join("");
  const weak = Object.entries(E.byCluster).map(([k,x]) => ({k, ...x, p: x.r / x.n})).filter(x => x.p < .7).sort((a,b) => a.p - b.p);
  const list = E.qids.filter(id => BYID[id] && (E.reviewFilter === "all" || !isRight(BYID[id], normSel(BYID[id], E.ans[id] || []))));
  return `<div class="col">
    <div class="eyebrow">Mock exam · ${fmtDate(E.start.slice(0,10))}</div>
    <div class="row" style="align-items:baseline;gap:16px"><span class="score ${pass ? "pass" : "fail"}">${E.score}</span><span class="lead" style="font-size:20px">${pass ? "Pass level" : "Below the 700 pass mark"}</span></div>
    <p class="sub">${E.right} of ${E.size} correct in ${Math.round(E.secs/60)} of ${E.minutes} minutes. All answers were logged and scheduled for review.</p>
    <div class="panel"><h3>By skill area</h3><div class="tablewrap"><table><tbody>${doms}</tbody></table></div></div>
    ${weak.length ? `<div class="panel"><h3>Topics to work on</h3><div class="row">${weak.map(x => `<button class="chip" type="button" data-topic="${x.k}"><b>${esc(CL[x.k]?.name || x.k)}</b> ${x.r}/${x.n} · drill</button>`).join("")}</div></div>` : ""}
    <div class="row" style="justify-content:space-between"><h2 style="font-size:17px">Review</h2>
      <div class="seg" role="group" aria-label="Review filter"><button type="button" data-rf="wrong" aria-pressed="${E.reviewFilter === "wrong"}">Wrong only</button><button type="button" data-rf="all" aria-pressed="${E.reviewFilter === "all"}">All</button></div></div>
    ${list.length ? list.map(id => { const q = BYID[id], sel = normSel(q, E.ans[id] || []); const ok = isRight(q, sel);
      return `<div class="panel" style="display:grid;gap:14px;background:var(--paper)">${questionHTML(q, {sel, answered: {sel, ok}, shown:true, counter: `Q${E.qids.indexOf(id) + 1} · ${q.id}`})}</div>`; }).join("") : `<p class="empty">No wrong answers. Nice work.</p>`}
    <div class="row"><button class="btn primary" type="button" data-act="exam-home">Back to Exam</button><button class="btn" type="button" data-go="today">Go to Today</button></div>
  </div>`;
}

/* ---------- progress ---------- */
function viewProgress(){
  const days = dayDocs(), cards = srs(), t = today();
  const all = days.flatMap(d => d.answers), right = all.filter(a => a.ok).length;
  const mastered = Object.values(cards).filter(c => c.reps >= 2 && c.lastOk).length;
  const due = Object.values(cards).filter(c => c.due <= t).length;
  const byDay = Object.fromEntries(days.map(d => [d.date, d.answers.length]));
  // heatmap: 16 weeks ending this week (columns = weeks, rows = Mon..Sun)
  const end = new Date(t + "T12:00:00"); const dow = (end.getDay() + 6) % 7; const start = addDays(t, -(15*7 + dow));
  let cells = ""; for (let i = 0; i < 16*7; i++){ const d = addDays(start, i); if (d > t){ cells += `<i style="visibility:hidden"></i>`; continue; } const n = byDay[d] || 0; const h = n === 0 ? "" : n < 5 ? "h1" : n < 15 ? "h2" : n < 30 ? "h3" : "h4"; cells += `<i class="${h}" title="${d}: ${n} answers"></i>`; }
  const ex = examDocs();
  const sessions = days.flatMap(d => d.sessions.map(s => ({...s, date: d.date}))).filter(s => s.n).sort((a,b) => a.start < b.start ? 1 : -1).slice(0, 12);
  const rows = CLUSTERS.map(c => ({c, s: clusterStats(c.code)}));
  return `<div class="col" style="max-width:none">
    <div><div class="eyebrow">Progress</div><div class="lead">Your study record</div></div>
    <div class="stats six">
      <div class="stat"><div class="n">${streak()}</div><div class="l">day streak</div></div>
      <div class="stat"><div class="n">${all.length}</div><div class="l">answers logged</div></div>
      <div class="stat"><div class="n">${all.length ? pct(right, all.length) + "%" : "–"}</div><div class="l">overall accuracy</div></div>
      <div class="stat"><div class="n">${mastered}<span class="small"> / ${BANK.length}</span></div><div class="l">mastered</div></div>
      <div class="stat"><div class="n">${due}</div><div class="l">due now</div></div>
      <div class="stat"><div class="n">${ex.length ? Math.max(...ex.map(e => e.score)) : "–"}</div><div class="l">best mock score</div></div>
    </div>
    <div class="panel"><h3>Activity, last 16 weeks</h3><div class="heat-wrap"><div class="heat">${cells}</div></div><p class="small" style="margin-top:8px">${forecastLine()}</p></div>
    <div class="panel"><h3>Mastery by topic</h3><div class="tablewrap"><table><thead><tr><th>Topic</th><th class="num">Seen</th><th class="num">Mastered</th><th class="num">Accuracy</th><th class="num">Due</th><th style="width:22%"></th></tr></thead><tbody>
      ${rows.map(({c, s}) => `<tr><td><span class="small" style="font-family:var(--font-mono)">${c.code}</span> ${esc(c.name)}</td><td class="num">${s.seen}/${s.total}</td><td class="num">${s.mastered}</td><td class="num">${s.acc == null ? "–" : Math.round(s.acc*100) + "%"}</td><td class="num">${s.due || ""}</td><td><span class="meter"><i class="m-ok" style="width:${pct(s.mastered, s.total)}%"></i><i class="m-seen" style="width:${pct(s.seen - s.mastered, s.total)}%"></i></span></td></tr>`).join("")}
    </tbody></table></div></div>
    <div class="two">
      <div class="panel"><h3>Recent study sessions</h3>${sessions.length ? `<div class="tablewrap"><table><thead><tr><th>Day</th><th>Time</th><th>Mode</th><th class="num">Answers</th></tr></thead><tbody>${sessions.map(s => `<tr><td>${fmtDate(s.date)}</td><td>${fmtTime(s.start)}–${fmtTime(s.end)}</td><td>${esc(s.modes.join(", "))}</td><td class="num">${s.n}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">Sessions appear here once you answer a question.</p>`}</div>
      <div class="panel"><h3>Mock exams</h3>${ex.length ? `<div class="tablewrap"><table><thead><tr><th>Date</th><th class="num">Score</th><th class="num">Correct</th></tr></thead><tbody>${ex.map(e => `<tr><td>${fmtDate(e.start.slice(0,10))}</td><td class="num ${e.score >= 700 ? "pass" : "fail"}"><b>${e.score}</b></td><td class="num">${e.right}/${e.size}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">No mock exams yet.</p>`}</div>
    </div>
    <div class="panel" style="display:grid;gap:10px"><h3>Your data</h3>
      <p class="small">${S.cloud ? "Saved privately to your account: only you can read it, and it follows you to other devices." : "Saved in this browser only. Open the page signed in to claude.ai to keep it in your account."} Stored: your spaced-repetition schedule, one log per study day (sessions and every answer with time), and mock exam results.</p>
      ${S.confirmReset ? `<div class="confirm"><span>Delete all your answers, schedule, sessions and mock results? This can't be undone.</span><div class="row"><button class="btn primary" type="button" data-act="reset-yes" style="background:var(--bad);border-color:var(--bad)">Delete everything</button><button class="btn" type="button" data-act="reset-no">Cancel</button></div></div>` : `<div><button class="btn danger" type="button" data-act="reset">Reset my progress</button></div>`}
    </div>
  </div>`;
}

/* ================= render + events ================= */
let timerId = null;
function render(){
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-current", b.dataset.go === S.view ? "page" : "false"));
  const v = S.view;
  $("view").innerHTML = v === "today" ? viewToday() : v === "topics" ? viewTopics() : v === "exam" ? viewExam() : viewProgress();
  clearInterval(timerId);
  if (v === "exam" && S.exam && !S.exam.done){ tick(); timerId = setInterval(tick, 1000); }
}
function tick(){
  const E = S.exam; if (!E || E.done) return clearInterval(timerId);
  const left = Math.max(0, E.deadline - Date.now()), el = $("timer");
  if (el){ const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60; el.textContent = `${pad(m)}:${pad(s)}`; el.classList.toggle("low", left < 5*60000); }
  if (left <= 0) submitExam();
}
function go(v){ S.view = v; if (v !== "exam" && S.exam?.done) S.exam = null; render(); window.scrollTo({top:0}); }

document.addEventListener("click", e => {
  const t = e.target.closest("button, input"); if (!t) return;
  const d = t.dataset;
  if (d.go){ if (d.go !== S.view || S.run) { if (S.run && (S.run.i >= S.run.ids.length || d.go !== S.view)) S.run = null; } return go(d.go); }
  if (d.goal){ S.prefs.goal = +d.goal; savePrefs(); return render(); }
  if (d.src){ S.prefs.src = d.src; savePrefs(); return render(); }
  if (d.topic) return startTopic(d.topic);
  if (d.exam) return newExam(+d.exam, +d.exam === 50 ? 100 : 50);
  if (d.review){ const ex = S.docs["exam-" + d.review]; if (ex){ S.exam = {...ex, done:true, reviewFilter:"wrong"}; render(); window.scrollTo({top:0}); } return; }
  if (d.rf){ S.exam.reviewFilter = d.rf; return render(); }
  if (d.qi != null){ S.exam.i = +d.qi; saveActiveExam(); render(); return; }
  if (d.opt != null && !t.disabled){
    const k = +d.opt;
    if (S.view === "exam" && S.exam && !S.exam.done){
      const q = BYID[S.exam.qids[S.exam.i]], cur = S.exam.ans[q.id] || [];
      S.exam.ans[q.id] = q.pick === 1 ? [k] : cur.includes(k) ? cur.filter(x => x !== k) : cur.length < q.pick ? [...cur, k] : cur;
      saveActiveExam(); return render();
    }
    const R = S.run; if (!R || R.answered) return;
    const q = BYID[R.ids[R.i]];
    if (q.pick === 1) return runAnswer([k]);
    R.pending = R.pending.includes(k) ? R.pending.filter(x => x !== k) : R.pending.length < q.pick ? [...R.pending, k] : R.pending;
    return render();
  }
  switch (d.act){
    case "start-today": { const b = buildToday(); if (b.ids.length) startRun("today", "Today's set", b.ids); break; }
    case "reveal": S.run.shown = true; S.run.t0 = performance.now(); render(); break;
    case "check": { const q = BYID[S.run.ids[S.run.i]]; if (q.parts ? q.parts.every((p, i) => S.run.pending[i] != null) : S.run.pending.length === q.pick) runAnswer(S.run.pending); break; }
    case "next": runNext(); break;
    case "guessed": { const R = S.run; if (R?.answered?.ok && !R.answered.guessed){ regradeGuessed(R.ids[R.i], R.answered.before); R.answered.guessed = true; render(); } break; }
    case "endrun": S.run.ids = S.run.ids.slice(0, S.run.i + (S.run.answered ? 1 : 0)); S.run.i = S.run.ids.length; render(); break;
    case "eprev": S.exam.i--; saveActiveExam(); render(); break;
    case "enext": S.exam.i++; saveActiveExam(); render(); window.scrollTo({top:0}); break;
    case "eflag": { const id = S.exam.qids[S.exam.i]; S.exam.flags[id] ? delete S.exam.flags[id] : S.exam.flags[id] = 1; saveActiveExam(); render(); break; }
    case "esubmit": S.exam.confirm = true; render(); break;
    case "esubmit-no": S.exam.confirm = false; render(); break;
    case "esubmit-yes": submitExam(); break;
    case "eabandon": clearActiveExam(); S.exam = null; render(); break;
    case "exam-home": S.exam = null; render(); break;
    case "reset": S.confirmReset = true; render(); break;
    case "reset-no": S.confirmReset = false; render(); break;
    case "reset-yes": resetAll(); break;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "recall"){ S.prefs.recall = e.target.checked; savePrefs(); return; }
  const part = e.target.dataset?.part; if (part == null) return;
  const i = +part, v = e.target.value === "" ? null : +e.target.value;
  if (S.view === "exam" && S.exam && !S.exam.done){
    const q = BYID[S.exam.qids[S.exam.i]], cur = normSel(q, S.exam.ans[q.id] || []); cur[i] = v;
    S.exam.ans[q.id] = hasAns(cur) ? cur : []; saveActiveExam();
    // update only the grid cell and counter, so the open drop-downs keep their place
    document.querySelector(`.qc[data-qi="${S.exam.i}"]`)?.classList.toggle("done", hasAns(cur));
    const cnt = $("timer")?.nextElementSibling; if (cnt) cnt.textContent = `${S.exam.qids.filter(id => hasAns(S.exam.ans[id])).length} of ${S.exam.qids.length} answered · ${Object.keys(S.exam.flags).length} flagged`;
    return;
  }
  const R = S.run; if (!R || R.answered) return;
  const q = BYID[R.ids[R.i]], cur = normSel(q, R.pending); cur[i] = v; R.pending = cur;
  const btn = document.querySelector('[data-act="check"]'); if (btn) btn.disabled = !q.parts.every((p, k) => cur[k] != null);
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.ctrlKey || e.metaKey || e.altKey) return;
  const R = S.run, inRun = R && R.i < R.ids.length && ((S.view === "today" && R.mode === "today") || (S.view === "topics" && R.mode === "topic"));
  const inExam = S.view === "exam" && S.exam && !S.exam.done;
  if (!inRun && !inExam) return;
  if (/^[a-fA-F]$/.test(e.key)){ const b = document.querySelector(`.opt[data-opt="${e.key.toUpperCase().charCodeAt(0) - 65}"]`); if (b && !b.disabled){ e.preventDefault(); b.click(); } }
  else if (e.key === " " && inRun && !R.shown){ e.preventDefault(); document.querySelector('[data-act="reveal"]')?.click(); }
  else if (e.key === "Enter" && inRun){ e.preventDefault(); (document.querySelector('[data-act="next"]') || document.querySelector('[data-act="check"]:not([disabled])'))?.click(); }
  else if (inExam && e.key === "ArrowRight") document.querySelector('[data-act="enext"]')?.click();
  else if (inExam && e.key === "ArrowLeft") document.querySelector('[data-act="eprev"]:not([disabled])')?.click();
});

async function resetAll(){
  const ids = Object.keys(S.docs);
  S.docs = {}; S.confirmReset = false; S.run = null;
  for (const id of ids){ lsDel(id); if (S.cloud){ try { await S.col.doc(id).delete(); } catch(e){} } }
  startSession(); render();
}

/* ================= boot ================= */
function boot(){
  S.docs = lsAll(); loadActiveExam(); startSession(); render(); setSync("local");
  if (!window.claude?.use) return;
  (async () => {
    const [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if (user){ const me = await user.me(); S.me = me; if (me.avatarUrl){ $("avatar").src = me.avatarUrl; $("avatar").hidden = false; } $("who-name").textContent = me.name || ""; S.uid = me.id; }
    if (!db || !S.uid){ if (S.me && !S.uid) note("Sign in to claude.ai to keep your progress in your account. For now it's saved in this browser only."); render(); return; }
    S.db = db; S.col = db.collection("data/users/" + S.uid);
    setSync("saving");
    const timer = setTimeout(() => note("Your saved progress can't be reached yet. You can keep studying; answers are kept in this browser meanwhile."), 10000);
    let cloudDocs;
    try { const snap = await S.col.get(); cloudDocs = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); }
    catch(err){ clearTimeout(timer); setSync("local"); note("Your progress can't be saved to your account in this view, so it's kept in this browser only."); return; }
    clearTimeout(timer); note("");
    const localDocs = S.docs;                       // what was done in this browser before sign-in resolved
    const localExam = S.exam;
    S.ns = S.uid; S.cloud = true;
    S.docs = JSON.parse(JSON.stringify(cloudDocs));
    // merge: union of day logs and exams; schedule keeps the most recently answered card
    const merged = mergeDocs(S.docs, localDocs);
    S.docs = merged.docs;
    S.session = null; startSession();
    for (const id of merged.changed) persist(id);
    if (!Object.keys(cloudDocs).length) { /* first visit with an account */ }
    loadActiveExam(); if (!S.exam && localExam) { S.exam = localExam; saveActiveExam(); }
    try { for (const k of Object.keys(localStorage)) if (k.startsWith("pl300coach:local:")) localStorage.removeItem(k); } catch(e){}
    setSync("cloud"); render();
  })();
}
function mergeDocs(base, extra){
  const docs = base, changed = new Set();
  for (const [id, v] of Object.entries(extra)){
    if (id === "profile") continue;
    if (!docs[id]){
      const doc = id.startsWith("day-") ? {...v, sessions: (v.sessions || []).filter(s => s.n)} : v;   // drop empty pre-sign-in sessions
      if (id.startsWith("day-") && !doc.answers.length && !doc.sessions.length) continue;
      docs[id] = doc; changed.add(id); continue;
    }
    if (id === "srs"){
      const a = docs.srs.cards ||= {};
      for (const [q, c] of Object.entries(v.cards || {})) if (!a[q] || (c.last > a[q].last) || (c.last === a[q].last && c.seen > a[q].seen)){ a[q] = c; changed.add("srs"); }
    } else if (id.startsWith("day-")){
      const have = new Set(docs[id].answers.map(x => x.t + x.q));
      for (const x of v.answers || []) if (!have.has(x.t + x.q)){ docs[id].answers.push(x); changed.add(id); }
      const hs = new Set(docs[id].sessions.map(s => s.id));
      for (const s of v.sessions || []) if (s.n && !hs.has(s.id)){ docs[id].sessions.push(s); changed.add(id); }
    }
  }
  return {docs, changed: [...changed]};
}
boot();
</script>
