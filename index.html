e data", "topic": "Reduce model size", "level": "medium", "question": "An Import model is close to the size limit. The Sales table has 10 years of history (reports only use the last 3 years), a free-text Comments column nobody uses, and a unique TransactionGUID column that no visual or relationship uses.\nWhich TWO actions reduce model size the most appropriately? (Select TWO)", "options": ["Set all relationships to bi-directional", "Remove the Comments and TransactionGUID columns in Power Query", "Filter the Sales query to keep only the years the reports need", "Turn on Auto date/time", "Convert all numeric columns to Text"], "answer": [1, 2], "pick": 2, "tip": "Smallest model: only the rows and columns you need.", "why": ["Wrong — Filter direction doesn't affect stored size and can slow queries.", "Correct — Unused high-cardinality columns (unique IDs, free text) compress poorly and take lots of memory; removing them helps the most.", "Correct — Loading only the needed history cuts row count and model size.", "Wrong — Auto date/time adds hidden tables, making the model bigger.", "Wrong — Text columns usually need more memory and lose numeric aggregation."], "concept": "The simplest optimization is data reduction: remove columns that aren't used for reporting, relationships or security, and filter out rows that aren't needed (old history, irrelevant categories). Do this as early as possible in Power Query or the source so the data never enters the model.", "learn": "Data reduction techniques for Import modeling", "lesson": "", "cluster": "M6"}, {"id": "MD1-031", "domain": "Model the data", "topic": "Reduce cardinality", "level": "hard", "question": "The Sales table has a TransactionDateTime column with values down to the second, so almost every value is unique. Reports filter by date and occasionally by hour. The column is large in memory.\nWhat should you do?", "options": ["Mark the Sales table as a date table", "Split it into a Date column and a Time column (rounding time to the hour if that is enough), and relate the Date column to the Date table", "Change the column's data type to Text", "Add an index column to the Sales table"], "answer": [1], "pick": 1, "tip": "Fewer distinct values = better compression. Split date and time.", "why": ["Wrong — Sales is a fact table with repeated dates; marking it as a date table doesn't reduce cardinality.", "Correct — A Date column has only a few thousand distinct values and a rounded Time column very few, so they compress far better than one near-unique datetime.", "Wrong — Text keeps the same number of distinct values and usually takes more memory.", "Wrong — An index adds a new unique column, increasing size."], "concept": "VertiPaq compresses columns using dictionaries of distinct values, so cardinality (the number of distinct values) drives memory use. Reducing cardinality — splitting datetime into date and time, rounding, removing unnecessary decimals, removing unique IDs — is one of the most effective ways to shrink an Import model.", "learn": "Data reduction techniques for Import modeling", "lesson": "", "cluster": "M6"}, {"id": "MD1-032", "domain": "Model the data", "topic": "Data types", "level": "medium", "question": "The Sales[UnitPrice] column holds currency values with at most two decimal places. You want to avoid floating-point rounding issues in totals while keeping the column numeric.\nWhich data type should you choose?", "options": ["Fixed decimal number", "Date/Time", "Text", "Whole number"], "answer": [0], "pick": 1, "tip": "Money -> Fixed decimal number.", "why": ["Correct — Fixed decimal number stores up to four decimal places exactly, which suits currency and avoids floating-point rounding.", "Wrong — Date/Time is for dates and times, not prices.", "Wrong — Text can't be aggregated as a number.", "Wrong — Whole number would drop the cents."], "concept": "Choosing the right data type affects correctness and size. Decimal number is floating-point; Fixed decimal number (often called Currency) has a fixed four-digit decimal precision; Whole number is for integers. Use the narrowest type that fits — integer keys as Whole number, money as Fixed decimal, dates as Date rather than Date/Time when no time is needed.", "learn": "Data types in Power BI Desktop", "lesson": "", "cluster": "M6"}, {"id": "MD1-033", "domain": "Model the data", "topic": "Aggregation tables", "level": "hard", "question": "Contoso's Sales fact table in DirectQuery has billions of rows. Most report visuals show totals by Month and Product Category; only a few drill-through pages need transaction detail. Visuals are slow.\nWhat should you do?", "options": ["Add calculated columns for month and category to the DirectQuery Sales table", "Switch the whole Sales table to Import mode regardless of size", "Create an Import-mode aggregated table grouped by month and product category, and configure it with Manage aggregations so summary queries hit it while detail queries still go to DirectQuery", "Set every relationship to bi-directional"], "answer": [2], "pick": 1, "tip": "Summary in memory, detail at the source: aggregations.", "why": ["Wrong — Extra columns don't reduce the volume scanned per query and add load to the source.", "Wrong — Billions of rows may exceed model size limits and refresh time; aggregations avoid importing all of it.", "Correct — User-defined aggregations answer most queries from a small in-memory table and fall back to the detailed DirectQuery table only when needed.", "Wrong — Bi-directional filters don't reduce data volume and can slow queries."], "concept": "Aggregations store pre-summarized data at a higher grain (e.g. month x category). Power BI automatically uses the aggregated table when a query can be answered from it, giving Import-like speed, and queries the detailed table for anything finer. For simpler Import models, grouping rows to the needed grain in Power Query achieves a similar reduction.", "learn": "User-defined aggregations", "lesson": "", "cluster": "M6"}, {"id": "MD1-034", "domain": "Model the data", "topic": "VertiPaq column store", "level": "medium", "question": "Which TWO statements describe how the Import (VertiPaq) engine stores data? (Select TWO)", "options": ["Data is stored column by column and each column is compressed", "Every column uses the same amount of memory regardless of its contents", "DirectQuery tables are copied into VertiPaq at each refresh", "Columns with fewer distinct values generally compress better", "Measures are calculated during refresh and stored as values"], "answer": [0, 3], "pick": 2, "tip": "VertiPaq: columnar + compression; low cardinality = small.", "why": ["Correct — VertiPaq is a columnar in-memory store; each column is compressed independently.", "Wrong — Memory varies widely by cardinality and data type.", "Wrong — DirectQuery tables stay at the source and are queried live.", "Correct — Compression relies on dictionaries and run lengths, so low-cardinality columns (e.g. Country) are much smaller than near-unique ones (e.g. GUIDs).", "Wrong — Measures are evaluated at query time; only their formula is stored."], "concept": "Import mode loads data into VertiPaq, an in-memory column store. Because each column is compressed separately, the number of distinct values and the data type drive memory use. This is why removing unused columns and reducing cardinality are the core model-optimization techniques.", "learn": "Optimization guide for Power BI", "lesson": "Lesson 8 ⏱ 01:15:34", "cluster": "M6"}, {"id": "MD1-035", "domain": "Model the data", "topic": "Column properties: sort by column", "level": "hard", "question": "Your Date table has MonthName (January-December), MonthNumber (1-12) and YearMonth (e.g. 202501, 202502...). You try to set MonthName to Sort by column YearMonth, and Power BI returns an error saying there can't be more than one value in YearMonth for the same value in MonthName.\nWhat should you do?", "options": ["Mark the Date table as a date table before sorting", "Change MonthName's data type to Whole number", "Set YearMonth's Summarization to Don't summarize", "Sort MonthName by MonthNumber instead"], "answer": [3], "pick": 1, "tip": "Sort by column needs a one-to-one mapping: each value -> exactly one sort value.", "why": ["Wrong — Marking the date table doesn't change the Sort by column rule.", "Wrong — Month names are text; converting them to numbers would fail and doesn't address the mapping rule.", "Wrong — Summarization doesn't affect the sort-by validation.", "Correct — Each month name maps to exactly one MonthNumber, so the sort works; \"January\" maps to many YearMonth values (one per year), which is not allowed."], "concept": "Sort by column requires that every value in the column being sorted corresponds to only one value in the sort column. If you need a 'Jan 2025, Feb 2025...' axis, create a MonthYear text column and sort it by YearMonth — that pair is one-to-one.", "learn": "Sort one column by another column in Power BI", "lesson": "", "cluster": "M2"}, {"id": "MD2-001", "domain": "Model the data", "topic": "Calculated columns vs measures", "level": "easy", "question": "At Contoso, managers want a slicer that lets them pick a Price Band (\"Low\", \"Medium\", \"High\") for each product, based on the product's list price. What should you create?", "options": ["A calculation group", "A measure in the Product table", "A calculated column in the Product table", "A quick measure based on Product[ListPrice]"], "answer": [2], "pick": 1, "tip": "Need it on a slicer, axis or row? It must be a column. Need a number that reacts to filters? Measure.", "why": ["Wrong — Calculation groups change how existing measures are calculated (e.g. YTD, PY); they are not for categorising products.", "Wrong — A measure returns a single value for the current filter context; it cannot be placed in a slicer as a list of categories.", "Correct — A calculated column is evaluated row by row (one band per product) and stored, so it can be used in slicers, rows and axes.", "Wrong — A quick measure is still a measure, so it cannot be used as a slicer field."], "concept": "A calculated column is computed once per row at data refresh and stored in the table, so you can slice, filter and group by it. A measure is computed at query time and returns one value for whatever filters are active. Rule of thumb: categorise rows with columns, aggregate with measures.", "learn": "Create calculated columns in Power BI Desktop", "lesson": "", "cluster": "M3"}, {"id": "MD2-002", "domain": "Model the data", "topic": "Calculated columns vs measures", "level": "medium", "question": "You are explaining DAX to a new analyst at Fabrikam. Which TWO statements about calculated columns and measures are true?\n\nSelect TWO.", "options": ["A measure is computed when a visual queries it, using the current filter context (slicers, rows, columns, filters).", "A measure can be dragged into a slicer to filter other visuals.", "A calculated column is computed during data refresh and stored in the model, so it increases the model size.", "A calculated column automatically recalculates each time a user changes a slicer."], "answer": [0, 2], "pick": 2, "tip": "Columns are calculated at refresh and stored; measures are calculated at query time and use filters.", "why": ["Correct — Measures are not stored; they are evaluated on demand for each cell of a visual in its filter context.", "Wrong — Slicers need column values; measures cannot be used as slicer fields.", "Correct — Calculated column values are computed row by row at refresh and stored, using memory like any other column.", "Wrong — Calculated columns only change when the data is refreshed; slicers filter them but do not recompute them."], "concept": "Row context means 'the current row' while a formula walks through a table (used by calculated columns and iterators). Filter context is the set of filters coming from slicers, visual rows/columns and filter panes, and it is what measures respond to. The same measure therefore shows different numbers in different cells.", "learn": "Measures in Power BI Desktop", "lesson": "Lesson 5 ⏱ 01:56:47", "cluster": "M3"}, {"id": "MD2-003", "domain": "Model the data", "topic": "Implicit vs explicit measures", "level": "easy", "question": "A report author drags Sales[Amount] straight into a visual, and Power BI shows \"Sum of Amount\". A colleague suggests writing an explicit measure instead:\n```\nTotal Sales = SUM(Sales[Amount])\n```\nWhat is the main advantage of the explicit measure?", "options": ["It can be reused by name inside other measures, and its logic is defined once for every report.", "It is stored as a new column in the Sales table.", "It is the only way to show a total in a card visual.", "It is calculated during refresh, so reports load faster."], "answer": [0], "pick": 1, "tip": "Explicit measure = write it once, name it, reuse it everywhere.", "why": ["Correct — An explicit measure has a name you can reference in other DAX (e.g. [Total Sales] in a YoY measure) and gives one consistent definition.", "Wrong — Measures are not stored as columns; they hold a formula only.", "Wrong — A card can display an implicit aggregation too; explicit measures are better practice, not a requirement.", "Wrong — Measures (implicit or explicit) are evaluated at query time, not during refresh."], "concept": "An implicit measure is the automatic aggregation Power BI creates when you drop a numeric column into a visual (Sum, Count, Average…). An explicit measure is one you write in DAX. Explicit measures can be referenced in other formulas, formatted once, documented, and are required when calculation groups are used.", "learn": "Create measures for data analysis in Power BI Desktop", "lesson": "", "cluster": "M3"}, {"id": "MD2-004", "domain": "Model the data", "topic": "Implicit vs explicit measures", "level": "easy", "question": "In a table visual, the Date[Year] column (whole number type) shows one large meaningless number (the years added together) instead of a list of years such as 2024 and 2025. What should you change so Year is never added up automatically?", "options": ["Set the Year column's Summarization property to \"Don't summarize\".", "Create a measure Year = SUM('Date'[Year]).", "Change the Year column's data type to Decimal number.", "Mark the Date table as a date table."], "answer": [0], "pick": 1, "tip": "Numbers that are labels (year, ID, zip code) → Don't summarize.", "why": ["Correct — Setting the default summarization to \"Don't summarize\" stops Power BI from creating an implicit Sum for that column.", "Wrong — An explicit SUM of years is exactly the meaningless total you are trying to avoid.", "Wrong — Decimal is still numeric, so Power BI would still sum it by default.", "Wrong — Marking a date table enables time intelligence validation; it doesn't change the Year column's default aggregation."], "concept": "Power BI treats numeric columns as values to aggregate and builds an implicit measure (default: Sum) when you drag them into a visual. For numeric columns that are really labels, set Summarization to Don't summarize in the column properties.", "learn": "Work with aggregates (sum, average, and so on) in Power BI", "lesson": "", "cluster": "M2"}, {"id": "MD2-005", "domain": "Model the data", "topic": "Calculated columns vs measures", "level": "medium", "question": "Northwind added a calculated column to the Sales table:\n```\nMargin % = DIVIDE(Sales[Profit], Sales[Revenue])\n```\nIn a matrix by Region, the total row shows 1,250% for Margin %. What is the BEST fix?", "options": ["Replace the column with a measure: Margin % = DIVIDE(SUM(Sales[Profit]), SUM(Sales[Revenue]))", "Format the column as a percentage with no decimals.", "Change the column's summarization from Sum to Average.", "Use \"/\" instead of DIVIDE in the calculated column."], "answer": [0], "pick": 1, "tip": "Ratios are measures: sum the parts first, divide last.", "why": ["Correct — A measure divides total profit by total revenue in each filter context, giving the correct weighted margin at every level, including totals.", "Wrong — Formatting changes how the number looks, not the wrong calculation.", "Wrong — Averaging row-level percentages ignores the size of each sale, so a tiny sale counts as much as a huge one; the result is still not the true margin.", "Wrong — The operator doesn't matter; the problem is that row-level percentages are being added together."], "concept": "Non-additive results like ratios, percentages and averages must be calculated as measures. If you calculate them per row in a column, Power BI aggregates the row results (e.g. sums percentages), which is wrong. Calculate the numerator and denominator in the current context, then divide.", "learn": "Measures in Power BI Desktop", "lesson": "", "cluster": "M3"}, {"id": "MD2-006", "domain": "Model the data", "topic": "Iterators (SUMX)", "level": "medium", "question": "The Sales table has Quantity and UnitPrice columns but no amount column. Unit prices vary between rows. Which DAX measure returns the correct total revenue?", "options": ["Revenue = SUM(Sales[Quantity]) * SUM(Sales[UnitPrice])", "Revenue = SUMX(Sales, Sales[Quantity] * Sales[UnitPrice])", "Revenue = AVERAGE(Sales[UnitPrice]) * SUM(Sales[Quantity])", "Revenue = SUM(Sales[Quantity] * Sales[UnitPrice])"], "answer": [1], "pick": 1, "tip": "Multiply per row, then add: that's the X in SUMX.", "why": ["Wrong — This multiplies total quantity by the sum of all prices, which is far too large and meaningless.", "Correct — SUMX iterates Sales row by row, computes Quantity × UnitPrice for each row, then sums the results.", "Wrong — Average price × total quantity is only correct if every row has the same price or quantity; it ignores which price goes with which quantity.", "Wrong — SUM accepts only a single column reference, not an expression, so this is a syntax error."], "concept": "SUM aggregates one column. SUMX (and other X functions such as AVERAGEX, MAXX, COUNTX) is an iterator: it creates a row context on a table, evaluates an expression for each row, then aggregates. Use an iterator whenever the calculation must happen per row before aggregating.", "learn": "SUMX function (DAX)", "lesson": "", "cluster": "M3"}, {"id": "MD2-007", "domain": "Model the data", "topic": "Iterators (SUMX)", "level": "medium", "question": "Adventure Works has a Sales table (Quantity) related many-to-one to a Product table (StandardCost). Which measure correctly returns total cost?", "options": ["Total Cost = SUMX(Sales, Sales[Quantity] * RELATED(Product[StandardCost]))", "Total Cost = SUMX(Product, Product[StandardCost]) * SUM(Sales[Quantity])", "Total Cost = SUM(Sales[Quantity]) * SUM(Product[StandardCost])", "Total Cost = SUMX(Sales, Sales[Quantity] * Product[StandardCost])"], "answer": [0], "pick": 1, "tip": "Inside an iterator on the many side, use RELATED to reach the one side.", "why": ["Correct — For each Sales row, RELATED fetches that product's cost through the relationship, and SUMX adds up Quantity × cost.", "Wrong — Summing all product costs and multiplying by total quantity does not pair quantities with the right product.", "Wrong — This multiplies two unrelated totals instead of matching each sale to its product's cost.", "Wrong — In the Sales row context you can't reference a Product column directly; DAX returns an error without RELATED."], "concept": "Row context does not automatically follow relationships. In a calculated column or iterator over the many-side table, RELATED(Table[Column]) looks up the matching value on the one side. It needs an existing relationship.", "learn": "RELATED function (DAX)", "lesson": "", "cluster": "M3"}, {"id": "MD2-008", "domain": "Model the data", "topic": "Row context and context transition", "level": "hard", "question": "You add this calculated column to the Customer table, which has a one-to-many relationship to Sales:\n```\nTotal Spend = SUM(Sales[Amount])\n```\nEvery customer row shows the same value: the grand total of all sales. Which change makes the column show each customer's own total?", "options": ["Total Spend = SUMX(Sales, Sales[Amount])", "Total Spend = CALCULATE(SUM(Sales[Amount]))", "Total Spend = RELATED(Sales[Amount])", "Change the data type of Total Spend to Fixed decimal number."], "answer": [1], "pick": 1, "tip": "Row context doesn't filter; CALCULATE turns the current row into a filter.", "why": ["Wrong — SUMX iterates all of Sales because there is still no filter context, so it also returns the grand total.", "Correct — CALCULATE performs context transition: the current customer row becomes a filter, which flows to Sales through the relationship.", "Wrong — RELATED works from the many side to the one side; Sales is on the many side here, so this returns an error.", "Wrong — The data type doesn't change which rows are summed."], "concept": "A calculated column has a row context but no filter context, so an aggregation like SUM sees the whole table. Wrapping the expression in CALCULATE converts the row context into an equivalent filter context (context transition). Measures referenced inside a calculated column or iterator do this automatically, because every measure is implicitly wrapped in CALCULATE.", "learn": "Row context and filter context in DAX", "lesson": "", "cluster": "M4"}, {"id": "MD2-009", "domain": "Model the data", "topic": "CALCULATE", "level": "medium", "question": "This measure is placed in a matrix with Product[Color] on rows:\n```\nRed Sales = CALCULATE([Total Sales], Product[Color] = \"Red\")\n```\nWhat value does Red Sales show on the \"Blue\" row?", "options": ["The total sales of all colors", "The sales of blue products", "The total sales of red products", "Blank"], "answer": [2], "pick": 1, "tip": "A simple CALCULATE filter on a column REPLACES the existing filter on that column.", "why": ["Wrong — A Color filter is still applied (Red), so it isn't the all-color total.", "Wrong — The Blue filter from the row is overwritten by the Red filter on the same column.", "Correct — CALCULATE removes the existing filter on Product[Color] and applies Color = \"Red\", so every row shows red sales.", "Wrong — Blank would require the Red and Blue filters to be combined (intersected), which is what KEEPFILTERS does, not plain CALCULATE."], "concept": "CALCULATE evaluates an expression in a modified filter context. A Boolean filter such as Product[Color] = \"Red\" is shorthand for FILTER(ALL(Product[Color]), …), so it removes any existing filter on that column and replaces it. Filters on other columns are kept.", "learn": "CALCULATE function (DAX)", "lesson": "Lesson 6 ⏱ 00:49:10", "cluster": "M4"}, {"id": "MD2-010", "domain": "Model the data", "topic": "CALCULATE filter modifiers", "level": "hard", "question": "In a matrix with Product[Color] on rows, you want a measure that shows red sales on the \"Red\" row and blank on every other color row. Which measure returns this result?", "options": ["CALCULATE([Total Sales], KEEPFILTERS(Product[Color] = \"Red\"))", "CALCULATE([Total Sales], ALL(Product[Color]), Product[Color] = \"Red\")", "CALCULATE([Total Sales], Product[Color] = \"Red\")", "CALCULATE([Total Sales], REMOVEFILTERS(Product))"], "answer": [0], "pick": 1, "tip": "KEEPFILTERS = keep the visual's filter AND add mine (intersection).", "why": ["Correct — KEEPFILTERS intersects the new filter with the existing one: Red∩Red = Red, Blue∩Red = nothing, so non-red rows are blank.", "Wrong — ALL removes the color filter first, then Red is applied, so every row still shows red sales.", "Wrong — The plain filter replaces the row's color filter, so every row shows red sales.", "Wrong — REMOVEFILTERS(Product) clears all product filters, so every row shows total sales of all products."], "concept": "By default a CALCULATE filter overrides existing filters on the same column. KEEPFILTERS changes this so the new filter is added on top of (intersected with) the existing filter. Use it when a measure should respect what the user already selected.", "learn": "KEEPFILTERS function (DAX)", "lesson": "", "cluster": "M4"}, {"id": "MD2-011", "domain": "Model the data", "topic": "CALCULATE filter modifiers", "level": "medium", "question": "A matrix shows Product[Category] on rows. You need % of total, where each category is divided by the sales of all categories:\n```\nPct of Total =\nDIVIDE(\n    [Total Sales],\n    CALCULATE([Total Sales], <filter>)\n)\n```\nWhich TWO replacements for <filter> return the correct result?\n\nSelect TWO.", "options": ["VALUES(Product[Category])", "ALL(Product[Category])", "REMOVEFILTERS(Product[Category])", "ALLEXCEPT(Product, Product[Category])"], "answer": [1, 2], "pick": 2, "tip": "To get the denominator, remove the filter that the rows add.", "why": ["Wrong — VALUES returns the currently filtered category, so the denominator equals the numerator: 100%.", "Correct — ALL used as a CALCULATE filter removes the category filter, so the denominator is all-category sales.", "Correct — REMOVEFILTERS is the clearer-named equivalent of ALL when used as a CALCULATE modifier.", "Wrong — ALLEXCEPT keeps the Category filter (and removes the others), so each row is divided by itself: 100%."], "concept": "Percent-of-total measures divide the current value by the same measure with some filters removed. ALL and REMOVEFILTERS remove filters from the listed columns or tables; ALLEXCEPT removes filters from a table except the columns you list.", "learn": "REMOVEFILTERS function (DAX)", "lesson": "", "cluster": "M4"}, {"id": "MD2-012", "domain": "Model the data", "topic": "CALCULATE filter modifiers", "level": "medium", "question": "A matrix has Product[Category] and Product[ProductName] on rows. There are no other filters on the Product table. You want each product's share of its own category's sales. Which denominator should you use?\n```\nShare of Category =\nDIVIDE(\n    [Total Sales],\n    CALCULATE([Total Sales], <filter>)\n)\n```\n", "options": ["VALUES(Product[ProductName])", "ALLEXCEPT(Product, Product[Category])", "ALLEXCEPT(Product, Product[ProductName])", "ALL(Product)"], "answer": [1], "pick": 1, "tip": "ALLEXCEPT: wipe the table's filters EXCEPT the ones you name.", "why": ["Wrong — VALUES keeps the current product, so the result is 100% for every product.", "Correct — ALLEXCEPT removes all Product filters except Category, so the denominator is the total of the current category.", "Wrong — This keeps the ProductName filter, so the denominator equals the product's own sales (100%).", "Wrong — ALL(Product) removes every product filter, including Category, giving each product's share of the grand total."], "concept": "ALLEXCEPT(Table, Column1, …) removes all filters from the table except those on the listed columns. It is a compact way to calculate a subtotal such as 'my category' or 'my region' from a lower-level row.", "learn": "ALLEXCEPT function (DAX)", "lesson": "", "cluster": "M4"}, {"id": "MD2-013", "domain": "Model the data", "topic": "CALCULATE with FILTER", "level": "hard", "question": "Contoso wants a measure that adds up sales only from customers whose own total sales are greater than 1,000. The grand total must also follow this rule. [Total Sales] = SUM(Sales[Amount]). Which measure is correct?", "options": ["IF([Total Sales] > 1000, [Total Sales])", "CALCULATE([Total Sales], FILTER(VALUES(Customer[CustomerID]), [Total Sales] > 1000))", "CALCULATE([Total Sales], FILTER(VALUES(Customer[CustomerID]), SUM(Sales[Amount]) > 1000))", "CALCULATE([Total Sales], [Total Sales] > 1000)"], "answer": [1], "pick": 1, "tip": "Condition on a measure? Use FILTER over the list of items, not a Boolean filter.", "why": ["Wrong — It works on a single customer row, but at the grand total it tests the overall total (> 1,000) and returns all sales.", "Correct — FILTER iterates each customer; the measure [Total Sales] is evaluated per customer (context transition), and only customers above 1,000 are kept.", "Wrong — SUM without CALCULATE is not evaluated per customer inside FILTER; it returns the total for all customers in context, so almost every customer is kept.", "Wrong — A Boolean filter argument in CALCULATE can't reference a measure; DAX returns an error."], "concept": "Simple Boolean filters in CALCULATE work on column values. When the condition depends on an aggregated value (a measure), use FILTER over a table of the items to test (e.g. VALUES(Customer[CustomerID])). Measures used inside FILTER are evaluated for each row thanks to context transition.", "learn": "FILTER function (DAX)", "lesson": "", "cluster": "M4"}, {"id": "MD2-014", "domain": "Model the data", "topic": "CALCULATE", "level": "medium", "question": "You need a measure that returns sales of products that are Red OR Blue. Which TWO measures return this result?\n\nSelect TWO.", "options": ["CALCULATE([Total Sales], Product[Color] = \"Red\" || Product[Color] = \"Blue\")", "CALCULATE([Total Sales], Product[Color] = \"Red\" && Product[Color] = \"Blue\")", "CALCULATE([Total Sales], Product[Color] IN {\"Red\", \"Blue\"})", "CALCULATE([Total Sales], Product[Color] = \"Red\", Product[Color] = \"Blue\")"], "answer": [0, 2], "pick": 2, "tip": "Separate filter arguments are AND; use IN or || for OR.", "why": ["Correct — || is the DAX OR operator, so the filter keeps Red or Blue products.", "Wrong — && is AND; a single product can't have two colors, so the result is blank.", "Correct — IN keeps rows whose color is in the list, i.e. Red or Blue.", "Wrong — Multiple filter arguments are combined with AND; no product is both Red and Blue, so the result is blank."], "concept": "CALCULATE combines its filter arguments with AND logic. To express OR on the same column, use the IN operator with a list, or the || operator inside one filter argument.", "learn": "CALCULATE function (DAX)", "lesson": "", "cluster": "M4"}, {"id": "MD2-015", "domain": "Model the data", "topic": "DIVIDE function", "level": "easy", "question": "A measure Sales vs Target = [Total Sales] / [Total Target] shows \"Infinity\" for a new region whose target is 0. You want the measure to return blank instead, without writing an IF. What should you do?", "options": ["Change the measure's format to Percentage", "Rewrite the measure as DIVIDE([Total Sales], [Total Target])", "Rewrite the measure as SUMX(Sales, [Total Sales] / [Total Target])", "Wrap the measure in ROUND(…, 2)"], "answer": [1], "pick": 1, "tip": "DIVIDE = safe division: zero denominator → BLANK (or your alternate result).", "why": ["Wrong — Formatting changes display only, not the Infinity result.", "Correct — DIVIDE returns BLANK when the denominator is 0 or blank; an optional third argument lets you return another value, e.g. DIVIDE(x, y, 0).", "Wrong — Iterating the same division row by row still divides by zero and adds needless work.", "Wrong — Rounding doesn't handle division by zero."], "concept": "The \"/\" operator returns Infinity (or NaN for 0/0) when dividing by zero. DIVIDE(numerator, denominator, [alternateResult]) handles zero or blank denominators safely and is the recommended way to divide in DAX measures.", "learn": "DIVIDE function vs divide operator (/) in DAX", "lesson": "", "cluster": "M3"}, {"id": "MD2-016", "domain": "Model the data", "topic": "Variables", "level": "medium", "question": "A teammate asks why you use VAR … RETURN in long measures. Which TWO statements are true?\n\nSelect TWO.", "options": ["A variable is recalculated whenever CALCULATE changes the filter context inside RETURN.", "Variables make long formulas easier to read and to debug (you can temporarily RETURN a variable to check its value).", "A variable is evaluated once and its value can be reused several times in RETURN, avoiding repeated calculation.", "A variable defined in one measure can be referenced by name from other measures."], "answer": [1, 2], "pick": 2, "tip": "VAR = calculate once, name it, reuse it — but it's frozen and local.", "why": ["Wrong — Once evaluated, a variable is a constant; CALCULATE later in RETURN does not re-evaluate it.", "Correct — Named steps make logic clearer, and returning an intermediate variable is a common debugging technique.", "Correct — The variable is calculated once where it is defined, which can improve performance when the value is used more than once.", "Wrong — Variables are local to the expression where they are defined; to share logic, create a separate measure."], "concept": "VAR defines a named value inside one DAX expression, and RETURN gives the final result. Variables improve readability, performance and debugging. They are evaluated in the context where they are defined and then behave as constants.", "learn": "Use variables to improve your DAX formulas", "lesson": "", "cluster": "M3"}, {"id": "MD2-017", "domain": "Model the data", "topic": "Variables", "level": "hard", "question": "An analyst wrote this measure to show last year's sales. It returns the same numbers as [Total Sales].\n```\nSales LY =\nVAR CurrentSales = [Total Sales]\nRETURN\n    CALCULATE(CurrentSales, SAMEPERIODLASTYEAR('Date'[Date]))\n```\nWhy?", "options": ["The Date table is not related to Sales.", "The variable is evaluated once, before CALCULATE changes the filter context, so CALCULATE cannot change its value.", "Variables cannot be used in time intelligence measures.", "SAMEPERIODLASTYEAR only works inside TOTALYTD."], "answer": [1], "pick": 1, "tip": "Variables are frozen when defined — put the measure itself inside CALCULATE.", "why": ["Wrong — If the tables were unrelated, the measure would not match [Total Sales] for each period; the symptom points to the variable.", "Correct — CurrentSales is already a fixed number (this year's sales). The fix is CALCULATE([Total Sales], SAMEPERIODLASTYEAR('Date'[Date])).", "Wrong — Variables are fine in time intelligence; they just must hold the result you want, e.g. VAR PriorSales = CALCULATE([Total Sales], …).", "Wrong — SAMEPERIODLASTYEAR is a normal table function used as a CALCULATE filter."], "concept": "A variable captures its value in the filter context where it is defined. Passing that variable to CALCULATE does not re-evaluate it, because CALCULATE can only change the context of expressions it evaluates itself. Put the measure (not the variable) inside CALCULATE.", "learn": "Use variables to improve your DAX formulas", "lesson": "", "cluster": "M4"}, {"id": "MD2-018", "domain": "Model the data", "topic": "Time intelligence", "level": "medium", "question": "You have a marked Date table related to Sales. Which TWO measures return calendar year-to-date sales?\n\nSelect TWO.", "options": ["CALCULATE([Total Sales], DATESYTD('Date'[Date]))", "TOTALYTD([Total Sales], 'Date'[Date])", "CALCULATE([Total Sales], SAMEPERIODLASTYEAR('Date'[Date]))", "CALCULATE([Total Sales], ALL('Date'))"], "answer": [0, 1], "pick": 2, "tip": "TOTALYTD(x, dates) is shorthand for CALCULATE(x, DATESYTD(dates)).", "why": ["Correct — DATESYTD returns the dates from the start of the year to the current date, and CALCULATE applies them as a filter.", "Correct — TOTALYTD evaluates the expression from 1 January to the last date in the current context.", "Wrong — This returns the same period one year earlier, not year-to-date.", "Wrong — This removes all date filters, returning sales for all dates."], "concept": "Year-to-date (YTD) accumulates values from the start of the year to the current date in context. TOTALYTD is a convenient wrapper; CALCULATE + DATESYTD does the same thing and is easier to combine with other filters. Both need a proper date column, ideally from a marked date table.", "learn": "Time intelligence functions (DAX)", "lesson": "Lesson 5 ⏱ 01:57:10", "cluster": "M5"}, {"id": "MD2-019", "domain": "Model the data", "topic": "Time intelligence", "level": "medium", "question": "Fabrikam's fiscal year runs from 1 July to 30 June. Which measure returns fiscal year-to-date sales?", "options": ["CALCULATE([Total Sales], DATESYTD('Date'[Date], \"6-30\"))", "CALCULATE([Total Sales], DATESYTD('Date'[Date]))", "CALCULATE([Total Sales], DATESYTD('Date'[Date], \"7-1\"))", "CALCULATE([Total Sales], SAMEPERIODLASTYEAR('Date'[Date]))"], "answer": [0], "pick": 1, "tip": "The optional year-end argument is the LAST day of the fiscal year.", "why": ["Correct — \"6-30\" tells DATESYTD the year ends on 30 June, so accumulation restarts on 1 July.", "Wrong — Without a year-end date, DATESYTD uses 31 December (calendar year).", "Wrong — The argument is the year-END date, not the start date; \"7-1\" would make the year end on 1 July.", "Wrong — This shifts dates back a year; it doesn't accumulate year-to-date."], "concept": "DATESYTD, TOTALYTD and related functions accept an optional year_end_date string (e.g. \"6-30\") for fiscal years. Everything else about the measure stays the same.", "learn": "DATESYTD function (DAX)", "lesson": "", "cluster": "M5"}, {"id": "MD2-020", "domain": "Model the data", "topic": "Time intelligence", "level": "easy", "question": "You have a marked Date table related to Sales. Which measure returns sales for the same period in the previous year, so that a June 2025 row shows June 2024 sales?", "options": ["CALCULATE([Total Sales], 'Date'[Year] = YEAR(TODAY()) - 1)", "CALCULATE([Total Sales], SAMEPERIODLASTYEAR('Date'[Date]))", "[Total Sales] - 1", "CALCULATE([Total Sales], DATESYTD('Date'[Date]))"], "answer": [1], "pick": 1, "tip": "SAMEPERIODLASTYEAR = the dates in context, shifted back one year.", "why": ["Wrong — This always returns the whole previous calendar year relative to today, whatever row you are on.", "Correct — SAMEPERIODLASTYEAR shifts the dates in the current context back by one year.", "Wrong — This just subtracts 1 from the sales value.", "Wrong — This is year-to-date sales for the current year."], "concept": "Time intelligence functions return a set of dates relative to the dates in the current filter context. Used as a CALCULATE filter, SAMEPERIODLASTYEAR moves that period back one year, giving a 'last year' comparison at any level (day, month, quarter, year).", "learn": "SAMEPERIODLASTYEAR function (DAX)", "lesson": "", "cluster": "M5"}, {"id": "MD2-021", "domain": "Model the data", "topic": "Time intelligence", "level": "hard", "question": "You need a measure that returns year-over-year growth as a percentage (for example, 0.10 when sales grew from 100 to 110). Which measure is correct?", "options": ["Sales YoY % =\nVAR CurrentSales = [Total Sales]\nVAR PriorSales = CALCULATE([Total Sales], SAMEPERIODLASTYEAR('Date'[Date]))\nRETURN DIVIDE(PriorSales - CurrentSales, CurrentSales)", "Sales YoY % =\nVAR CurrentSales = [Total Sales]\nVAR PriorSales = CALCULATE([Total Sales], SAMEPERIODLASTYEAR('Date'[Date]))\nRETURN DIVIDE(CurrentSales - PriorSales, PriorSales)", "Sales YoY % =\nVAR CurrentSales = [Total Sales]\nVAR PriorSales = CALCULATE([Total Sales], SAMEPERIODLASTYEAR('Date'[Date]))\nRETURN DIVIDE(CurrentSales, PriorSales)", "Sales YoY % =\nVAR CurrentSales = [Total Sales]\nVAR PriorSales = CALCULATE(CurrentSales, SAMEPERIODLASTYEAR('Date'[Date]))\nRETURN DIVIDE(CurrentSales - PriorSales, PriorSales)"], "answer": [1], "pick": 1, "tip": "Growth % = (this − last) ÷ last.", "why": ["Wrong — The subtraction is reversed and divided by the current value: (100 − 110) ÷ 110 ≈ −0.09.", "Correct — (110 − 100) ÷ 100 = 0.10, and DIVIDE safely returns blank when there is no prior-year value.", "Wrong — This is the ratio this year ÷ last year (1.10), not the growth (0.10).", "Wrong — CALCULATE can't change a variable that is already evaluated, so PriorSales equals CurrentSales and the result is always 0."], "concept": "A YoY % measure combines a time intelligence filter (prior period), variables to name each part, and DIVIDE for safe division. Always divide the change by the prior-period value.", "learn": "Time intelligence functions (DAX)", "lesson": "", "cluster": "M5"}, {"id": "MD2-022", "domain": "Model the data", "topic": "Time intelligence", "level": "easy", "question": "You need a measure that shows the previous month's sales next to each month in a matrix. You have a marked Date table. Which measure should you use?", "options": ["CALCULATE([Total Sales], DATEADD('Date'[Date], 1, MONTH))", "CALCULATE([Total Sales], SAMEPERIODLASTYEAR('Date'[Date]))", "CALCULATE([Total Sales], PARALLELPERIOD('Date'[Date], -1, YEAR))", "CALCULATE([Total Sales], DATEADD('Date'[Date], -1, MONTH))"], "answer": [3], "pick": 1, "tip": "DATEADD(dates, -N, interval) shifts the period back N intervals.", "why": ["Wrong — A positive number shifts forward, giving next month's sales.", "Wrong — This returns the same month last year.", "Wrong — This returns the whole previous year.", "Correct — DATEADD shifts the dates in context back one month."], "concept": "DATEADD(dates, number_of_intervals, interval) moves the current dates by a number of days, months, quarters or years. Negative numbers go back in time. It is the most flexible 'shift' function.", "learn": "DATEADD function (DAX)", "lesson": "", "cluster": "M5"}, {"id": "MD2-023", "domain": "Model the data", "topic": "Time intelligence", "level": "hard", "question": "A matrix shows Year and Month on rows. On the May 2025 row, the business wants to see the total sales of the ENTIRE previous quarter (January–March 2025), and the same pattern for every month. Which measure should you use?", "options": ["CALCULATE([Total Sales], DATEADD('Date'[Date], -1, QUARTER))", "CALCULATE([Total Sales], SAMEPERIODLASTYEAR('Date'[Date]))", "CALCULATE([Total Sales], PARALLELPERIOD('Date'[Date], -1, QUARTER))", "CALCULATE([Total Sales], DATEADD('Date'[Date], -3, MONTH))"], "answer": [2], "pick": 1, "tip": "DATEADD shifts the same-sized slice; PARALLELPERIOD returns whole periods.", "why": ["Wrong — DATEADD shifts the visible dates (May) back one quarter, giving February only.", "Wrong — This returns May 2024.", "Correct — PARALLELPERIOD shifts back one quarter and returns the complete quarter, so May shows all of Q1.", "Wrong — Shifting May back three months returns February only."], "concept": "DATEADD keeps the same granularity as the current context (one month stays one month). PARALLELPERIOD returns full periods of the interval you specify (full quarter or full year), no matter which dates are currently selected.", "learn": "PARALLELPERIOD function (DAX)", "lesson": "", "cluster": "M5"}, {"id": "MD2-024", "domain": "Model the data", "topic": "Date tables", "level": "medium", "question": "You want to mark the 'Date' table as a date table so DAX time intelligence works reliably. Which THREE conditions must its date column meet?\n\nSelect THREE.", "options": ["The table starts on 1 January 2000.", "The table uses DirectQuery storage mode.", "There are no missing dates between the first and last date.", "The column only includes dates that appear in the Sales table.", "The column has the Date (or Date/Time) data type.", "Every value is unique (one row per date)."], "answer": [2, 4, 5], "pick": 3, "tip": "Date table: unique, no gaps, no blanks, real date type.", "why": ["Wrong — Any start date is fine; it should cover the full range of your data (ideally whole years).", "Wrong — Storage mode is not a requirement for marking a date table.", "Correct — Time intelligence needs a contiguous range of dates, with no gaps.", "Wrong — Using only dates with sales creates gaps (e.g. weekends, holidays), which breaks the contiguity rule.", "Correct — The column you mark must be a date (or date/time) column.", "Correct — Duplicates would break the one-side of the relationship and time intelligence."], "concept": "A date table has one row per day across a continuous range, usually whole years covering all your facts, plus columns like Year, Quarter and Month. Marking it as a date table tells Power BI which column to use for time intelligence and validates it: unique values, no blanks, no missing dates, date data type.", "learn": "Set and use date tables in Power BI Desktop", "lesson": "", "cluster": "M2"}, {"id": "MD2-025", "domain": "Model the data", "topic": "Date tables", "level": "medium", "question": "A model has only a Sales table. The analyst wrote Sales LY = CALCULATE([Total Sales], SAMEPERIODLASTYEAR(Sales[OrderDate])) and the results are wrong or blank for some periods. Sales are not recorded every day. What should you do?", "options": ["Switch the Sales table to DirectQuery.", "Change Sales[OrderDate] to the Text data type.", "Replace SAMEPERIODLASTYEAR with YEAR(Sales[OrderDate]) - 1.", "Create a separate Date table with continuous dates, mark it as a date table, relate it to Sales[OrderDate], and use 'Date'[Date] in time intelligence and visuals."], "answer": [3], "pick": 1, "tip": "Time intelligence wants a dedicated, gap-free Date table — not a fact column.", "why": ["Wrong — Storage mode doesn't fix missing or duplicate dates.", "Wrong — Time intelligence functions need a date column; text breaks them completely.", "Wrong — YEAR(…) - 1 returns a number, not a set of dates to filter by, so it can't replace a time intelligence filter.", "Correct — A dedicated, contiguous Date table on the one side of a relationship is the foundation for correct time intelligence."], "concept": "Fact table date columns have duplicates and gaps, so time intelligence functions that shift or expand date ranges give unreliable results on them. Build (or import) a Date table with one row per day, mark it, relate it to the fact's date column, and use the Date table's columns in visuals and DAX.", "learn": "Set and use date tables in Power BI Desktop", "lesson": "", "cluster": "M2"}, {"id": "MD2-026", "domain": "Model the data", "topic": "Semi-additive measures", "level": "easy", "question": "Which value is semi-additive: it can be summed across products or warehouses, but NOT across time?", "options": ["Units sold", "Inventory quantity on hand", "Sales amount", "Number of orders"], "answer": [1], "pick": 1, "tip": "Balances and stock levels: add across places, not across days.", "why": ["Wrong — Units sold can be summed over days, months and years.", "Correct — Adding daily stock levels over a month gives a meaningless number; you need the closing (or opening/average) value instead.", "Wrong — Sales amounts can be added across any dimension, including time (fully additive).", "Wrong — Order counts add up correctly over time."], "concept": "Additive measures can be summed over all dimensions. Semi-additive measures, like account balances or inventory levels (snapshots), can be summed across some dimensions but need a different rule over time, usually the last (closing) value of the period.", "learn": "Semi-additive measures in DAX", "lesson": "", "cluster": "M5"}, {"id": "MD2-027", "domain": "Model the data", "topic": "Semi-additive measures", "level": "hard", "question": "An Inventory table stores one row per product per business day (no rows on weekends). The Date table is marked and related. You want a Closing Stock measure that, at month level, shows the quantity from the last day of the month that has data — even if the month ends on a Sunday. Which measure is correct?", "options": ["Closing Stock =\nCALCULATE(\n    SUM(Inventory[Quantity]),\n    LASTDATE('Date'[Date])\n)", "Closing Stock =\nCALCULATE(\n    SUM(Inventory[Quantity]),\n    LASTNONBLANK('Date'[Date], CALCULATE(SUM(Inventory[Quantity])))\n)", "Closing Stock = SUM(Inventory[Quantity])", "Closing Stock = AVERAGE(Inventory[Quantity])"], "answer": [1], "pick": 1, "tip": "LASTDATE = last calendar day; LASTNONBLANK = last day that actually has data.", "why": ["Wrong — LASTDATE returns the last date in the Date table for the month (e.g. Sunday the 31st); with no row that day, the result is blank.", "Correct — LASTNONBLANK finds the latest date in the period where the inventory sum is not blank, and CALCULATE returns the stock on that date.", "Wrong — Summing daily snapshots adds up every day's stock, which overstates the month.", "Wrong — The average of daily rows is not the closing balance (and it averages across products too)."], "concept": "For snapshot data, use a closing-balance pattern: filter the period down to one date, then aggregate. LASTDATE picks the last calendar date in context; LASTNONBLANK(dates, expression) picks the last date where the expression has a value, which handles weekends and holidays.", "learn": "LASTNONBLANK function (DAX)", "lesson": "", "cluster": "M5"}, {"id": "MD2-028", "domain": "Model the data", "topic": "RELATED and RELATEDTABLE", "level": "easy", "question": "Sales has a many-to-one relationship to Product. You need a calculated column in Sales that shows each sale's product category. Which formula should you use?", "options": ["Category = SELECTEDVALUE(Product[Category])", "Category = RELATED(Product[Category])", "Category = Product[Category]", "Category = RELATEDTABLE(Product[Category])"], "answer": [1], "pick": 1, "tip": "RELATED: from many to one (get one value). RELATEDTABLE: from one to many (get a table).", "why": ["Wrong — A calculated column has no filter context on Product, so SELECTEDVALUE doesn't return the related product's category.", "Correct — From the many side (Sales), RELATED returns the single matching value from the one side (Product).", "Wrong — A calculated column can't reference another table's column directly; it returns an error.", "Wrong — RELATEDTABLE takes a table (not a column) and is used from the one side to get related many-side rows."], "concept": "RELATED follows a relationship from the many side to the one side and returns a single value. RELATEDTABLE goes the other way, from the one side, and returns the table of related many-side rows, usually wrapped in COUNTROWS or SUMX.", "learn": "RELATED function (DAX)", "lesson": "", "cluster": "M3"}, {"id": "MD2-029", "domain": "Model the data", "topic": "RELATED and RELATEDTABLE", "level": "medium", "question": "Customer (one) is related to Sales (many). Each Sales row is one order. You need a calculated column in Customer that shows each customer's number of orders. Which formula is correct?", "options": ["Order Count = COUNTROWS(Sales)", "Order Count = RELATED(Sales[OrderID])", "Order Count = DISTINCTCOUNT(Sales[CustomerID])", "Order Count = COUNTROWS(RELATEDTABLE(Sales))"], "answer": [3], "pick": 1, "tip": "From the one side, RELATEDTABLE gives you 'my rows' in the other table.", "why": ["Wrong — Without a filter, COUNTROWS(Sales) counts all orders, so every customer shows the same total.", "Wrong — RELATED only works from the many side to the one side; there are many Sales rows per customer.", "Wrong — Without filtering, this counts all distinct customers who bought anything, the same for every row.", "Correct — RELATEDTABLE returns the Sales rows for the current customer, and COUNTROWS counts them."], "concept": "In a calculated column, the current row does not filter other tables automatically. RELATEDTABLE(Table) uses the relationship to return only the related rows (it behaves like CALCULATETABLE), so you can count or sum them per row.", "learn": "RELATEDTABLE function (DAX)", "lesson": "", "cluster": "M3"}, {"id": "MD2-030", "domain": "Model the data", "topic": "Counting functions", "level": "easy", "question": "The Sales table has one row per order line and a CustomerID column. You need a measure that returns how many different customers bought something in the selected period. Which function should you use?", "options": ["COUNT(Sales[CustomerID])", "DISTINCTCOUNT(Sales[CustomerID])", "COUNTROWS(Customer)", "COUNTROWS(Sales)"], "answer": [1], "pick": 1, "tip": "Unique things → DISTINCTCOUNT.", "why": ["Wrong — COUNT counts every non-blank CustomerID, so a customer with 5 order lines is counted 5 times.", "Correct — DISTINCTCOUNT counts each customer once.", "Wrong — This counts all customers in the Customer table, including those with no purchases in the period (filters normally flow from Customer to Sales, not back).", "Wrong — COUNTROWS counts order lines, not customers."], "concept": "COUNT counts non-blank values in a column; COUNTROWS counts rows in a table; DISTINCTCOUNT counts unique values in a column. Pick the one that matches the business question.", "learn": "DISTINCTCOUNT function (DAX)", "lesson": "", "cluster": "M3"}, {"id": "MD2-031", "domain": "Model the data", "topic": "Counting functions", "level": "medium", "question": "Each Sales row is one order. Sales[ShipDate] is blank for orders that have not shipped yet. Which TWO measures return the number of unshipped orders?\n\nSelect TWO.", "options": ["COUNT(Sales[ShipDate])", "COUNTBLANK(Sales[ShipDate])", "COUNTROWS(Sales) - COUNT(Sales[ShipDate])", "DISTINCTCOUNT(Sales[ShipDate])"], "answer": [1, 2], "pick": 2, "tip": "COUNTROWS counts rows; COUNT skips blanks; COUNTBLANK counts only blanks.", "why": ["Wrong — COUNT ignores blanks, so this returns the number of shipped orders.", "Correct — COUNTBLANK counts the blank values in the column, i.e. unshipped orders.", "Correct — All orders minus orders with a ship date = orders without a ship date.", "Wrong — This counts how many different ship dates exist, not orders."], "concept": "COUNTROWS counts every row, while COUNT counts only non-blank values in a column. The difference between them (or COUNTBLANK) tells you how many rows have a missing value.", "learn": "COUNTROWS function (DAX)", "lesson": "", "cluster": "M3"}, {"id": "MD2-032", "domain": "Model the data", "topic": "RANKX", "level": "medium", "question": "A table visual lists Product[ProductName] and [Total Sales]. You need a measure that ranks products so the best-selling product shows 1. Which measure is correct?", "options": ["Product Rank = RANKX(ALL(Product[ProductName]), [Total Sales])", "Product Rank = RANKX(ALL(Product[ProductName]), [Total Sales], , ASC)", "Product Rank = RANKX(VALUES(Product[ProductName]), [Total Sales])", "Product Rank = COUNTROWS(ALL(Product[ProductName]))"], "answer": [0], "pick": 1, "tip": "RANKX needs ALL the competitors in its table — otherwise everyone is #1.", "why": ["Correct — ALL gives RANKX the full list of products to compare against; the default order is descending, so the highest sales gets 1.", "Wrong — ASC ranks the lowest sales as 1.", "Wrong — In each row VALUES returns only the current product, so every product ranks 1.", "Wrong — This returns the total number of products, not a rank."], "concept": "RANKX(table, expression, [value], [order], [ties]) evaluates the expression for each row of the table and returns the position of the current value. The table must contain all items you want to compare, which is why ALL (or ALLSELECTED) is usually used.", "learn": "RANKX function (DAX)", "lesson": "", "cluster": "M4"}, {"id": "MD2-033", "domain": "Model the data", "topic": "RANKX", "level": "medium", "question": "Product sales are: A = 500, B = 400, C = 400, D = 300. Management wants ranks 1, 2, 2, 3 (no gap after the tie). Which measure returns this?", "options": ["RANKX(VALUES(Product[ProductName]), [Total Sales], , DESC, DENSE)", "RANKX(ALL(Product[ProductName]), [Total Sales], , ASC, DENSE)", "RANKX(ALL(Product[ProductName]), [Total Sales], , DESC, SKIP)", "RANKX(ALL(Product[ProductName]), [Total Sales], , DESC, DENSE)"], "answer": [3], "pick": 1, "tip": "SKIP leaves gaps after ties (1,2,2,4); DENSE doesn't (1,2,2,3).", "why": ["Wrong — VALUES contains only the current product in each row, so all products rank 1.", "Wrong — Ascending order makes the lowest seller (D) rank 1.", "Wrong — SKIP (the default) gives D rank 4 because two products share rank 2.", "Correct — DENSE gives the next rank after a tie without a gap: 1, 2, 2, 3."], "concept": "The fifth argument of RANKX controls ties. SKIP (default) skips ranks after a tie, like a sports table; DENSE continues with the next number. The fourth argument sets DESC (default, highest = 1) or ASC.", "learn": "RANKX function (DAX)", "lesson": "", "cluster": "M4"}, {"id": "MD2-034", "domain": "Model the data", "topic": "Statistical functions", "level": "hard", "question": "Sales has several rows per order (one per order line) with columns OrderNumber and Amount. You need the average value per ORDER. Which TWO measures are correct?\n\nSelect TWO.", "options": ["AVERAGEX(VALUES(Sales[OrderNumber]), SUM(Sales[Amount]))", "AVERAGEX(VALUES(Sales[OrderNumber]), CALCULATE(SUM(Sales[Amount])))", "DIVIDE(SUM(Sales[Amount]), DISTINCTCOUNT(Sales[OrderNumber]))", "AVERAGE(Sales[Amount])"], "answer": [1, 2], "pick": 2, "tip": "Average per WHAT? Iterate (or divide by) the thing you are averaging over.", "why": ["Wrong — Without CALCULATE there is no context transition, so SUM returns the total of all orders for every iteration.", "Correct — AVERAGEX iterates each order; CALCULATE makes the SUM return that order's total, then the totals are averaged.", "Correct — Total sales divided by the number of distinct orders is the average order value.", "Wrong — This is the average order LINE amount, not the average order."], "concept": "AVERAGE averages a column's row values. AVERAGEX(table, expression) averages an expression evaluated for each row of a table, so you choose the level (orders, customers, days). A simple alternative is total ÷ count of distinct items.", "learn": "AVERAGEX function (DAX)", "lesson": "", "cluster": "M3"}, {"id": "MD2-035", "domain": "Model the data", "topic": "Statistical functions", "level": "easy", "question": "Delivery times are usually 2–4 days, but a few deliveries took over 60 days because of a strike. You want one number that shows the typical delivery time and is not pulled up by these extreme values. Which DAX function should you use?", "options": ["MAX(Deliveries[Days])", "MEDIAN(Deliveries[Days])", "AVERAGE(Deliveries[Days])", "STDEV.P(Deliveries[Days])"], "answer": [1], "pick": 1, "tip": "Outliers? Use the median — the middle value.", "why": ["Wrong — MAX shows the single worst delivery, not the typical one.", "Correct — The median is the middle value, so a few extreme outliers barely affect it.", "Wrong — The average is pulled up by the few very long deliveries.", "Wrong — Standard deviation measures how spread out values are, not the typical value."], "concept": "DAX includes basic statistical functions: AVERAGE, MEDIAN, MIN, MAX, STDEV.S/STDEV.P, VAR.S/VAR.P and percentile functions, plus X versions (MEDIANX etc.). Median is a robust choice for a 'typical value' when data has outliers.", "learn": "Statistical functions (DAX)", "lesson": "", "cluster": "M3"}, {"id": "MD2-036", "domain": "Model the data", "topic": "SELECTEDVALUE and HASONEVALUE", "level": "easy", "question": "A card shows this measure as a dynamic title:\n```\nTitle = \"Sales for \" & SELECTEDVALUE(Product[Category], \"All categories\")\n```\nA user selects both Bikes and Accessories in the Category slicer. What does the card show?", "options": ["Sales for Bikes, Accessories", "Sales for All categories", "An error, because more than one value is selected", "Sales for Bikes"], "answer": [1], "pick": 1, "tip": "SELECTEDVALUE: exactly one value → that value; otherwise → the alternate result.", "why": ["Wrong — SELECTEDVALUE doesn't concatenate values; CONCATENATEX would be needed for that.", "Correct — With more than one category in the filter context, SELECTEDVALUE returns the alternate result.", "Wrong — No error occurs; the alternate result (or BLANK if none is given) is returned.", "Wrong — SELECTEDVALUE doesn't pick the first of several values."], "concept": "SELECTEDVALUE(column, alternateResult) returns the column's value when the filter context contains exactly one distinct value, and the alternate result otherwise. It is commonly used for dynamic titles and for reading a slicer selection.", "learn": "SELECTEDVALUE function (DAX)", "lesson": "", "cluster": "M4"}, {"id": "MD2-037", "domain": "Model the data", "topic": "SELECTEDVALUE and HASONEVALUE", "level": "medium", "question": "This measure is shown in a matrix with Date[Year] on rows (2024 and 2025) and a Total row:\n```\nSingle Year Sales =\nIF(HASONEVALUE('Date'[Year]), [Total Sales])\n```\nWhat does the Total row show?", "options": ["An error, because IF has no third argument", "The sum of 2024 and 2025 sales", "Blank", "The 2025 sales only"], "answer": [2], "pick": 1, "tip": "Total rows usually see MANY values — HASONEVALUE returns FALSE there.", "why": ["Wrong — The third argument of IF is optional; when omitted, it returns BLANK.", "Wrong — At the total, two years are in context, so the condition is FALSE and [Total Sales] isn't returned.", "Correct — HASONEVALUE is FALSE at the total (two years), and IF without a third argument returns BLANK.", "Wrong — HASONEVALUE doesn't choose a year; it only tests whether there is exactly one."], "concept": "HASONEVALUE(column) returns TRUE when the filter context contains exactly one distinct value of the column. It is used to show a value only at a detail level, or to hide confusing totals.", "learn": "HASONEVALUE function (DAX)", "lesson": "", "cluster": "M4"}, {"id": "MD2-038", "domain": "Model the data", "topic": "Quick measures", "level": "easy", "question": "A beginner wants to create a running total measure without typing DAX. They use a quick measure. What is true about quick measures?", "options": ["They are calculated at refresh time and do not respond to slicers.", "They generate a normal DAX measure that you can view and edit in the formula bar afterwards.", "They can only be used in the visual where they were created.", "They are built in Power Query and stored as new columns."], "answer": [1], "pick": 1, "tip": "Quick measure = DAX written for you — read it to learn.", "why": ["Wrong — Like any measure, it is evaluated at query time and responds to filters.", "Correct — The quick measure dialog writes the DAX for you; the result is a regular measure you can inspect, rename and modify.", "Wrong — A quick measure is added to the model and can be used in any visual like other measures.", "Wrong — Quick measures create DAX measures in the model, not Power Query columns."], "concept": "Quick measures offer templates (running total, YoY change, weighted average, etc.). You pick fields in a dialog and Power BI writes the DAX. Reading the generated code is a good way to learn DAX patterns.", "learn": "Use quick measures for common calculations", "lesson": "", "cluster": "M3"}, {"id": "MD2-039", "domain": "Model the data", "topic": "Calculation groups", "level": "medium", "question": "Contoso has 20 base measures and wants YTD, PY and YoY % versions of each. Instead of writing 60 extra measures, a developer proposes a calculation group. Which TWO statements about calculation groups are true?\n\nSelect TWO.", "options": ["They store the precomputed results as new columns in the fact table.", "They let you apply the same logic (such as YTD or PY) to many existing measures without writing a separate measure for each.", "Each calculation item uses SELECTEDMEASURE() to refer to whichever measure is being evaluated.", "They remove the need for a Date table in time intelligence."], "answer": [1, 2], "pick": 2, "tip": "Calculation group = one formula pattern × many measures.", "why": ["Wrong — Calculation items are evaluated at query time; nothing is precomputed or stored per row.", "Correct — One calculation item (e.g. YTD) can be applied to any measure, which greatly reduces the number of measures.", "Correct — SELECTEDMEASURE() is a placeholder for the measure currently in the visual, e.g. CALCULATE(SELECTEDMEASURE(), DATESYTD('Date'[Date])).", "Wrong — Time intelligence calculation items still rely on a proper Date table."], "concept": "A calculation group is a special table whose items (e.g. Current, YTD, PY) modify how a measure is calculated. Users pick an item in a slicer or matrix, and it is applied to the measures in the visual. When you create one, Power BI turns on 'discourage implicit measures', so use explicit measures.", "learn": "Create calculation groups in Power BI", "lesson": "", "cluster": "M4"}, {"id": "MD2-040", "domain": "Model the data", "topic": "DAX query view", "level": "easy", "question": "You want to test a new measure by running a DAX query in DAX query view in Power BI Desktop (you can also ask Copilot there to draft a query). Which keyword must a DAX query use to return a table of results?", "options": ["EVALUATE", "RETURN", "SELECT", "DEFINE"], "answer": [0], "pick": 1, "tip": "DAX queries start their output with EVALUATE.", "why": ["Correct — EVALUATE followed by a table expression (e.g. SUMMARIZECOLUMNS) returns the query result.", "Wrong — RETURN ends a VAR block inside an expression; it doesn't produce a query result.", "Wrong — SELECT is SQL, not DAX.", "Wrong — DEFINE is optional and declares query-scoped measures or variables; an EVALUATE statement is still required."], "concept": "DAX query view lets you write and run DAX queries against your model to inspect data and test measures. A query needs at least one EVALUATE statement; DEFINE can add temporary measures. Copilot can draft queries and measures there, but always check the results against known totals.", "learn": "DAX query view in Power BI Desktop", "lesson": "", "cluster": "M6"}, {"id": "VA1-001", "domain": "Visualize and analyze the data", "topic": "Choose an appropriate visual", "level": "easy", "question": "Contoso's sales manager wants to see how monthly revenue has changed over the last 24 months and spot any seasonal ups and downs.\nWhich visual is the best choice?", "options": ["Card", "Pie chart", "Treemap", "Line chart"], "answer": [3], "pick": 1, "tip": "Time on the x-axis + 'trend' in the question = line chart.", "why": ["Wrong — A card shows a single number, such as the total, not how it changes month by month.", "Wrong — A pie chart shows parts of a whole at one point in time; 24 slices would be unreadable and show no trend.", "Wrong — A treemap shows part-to-whole proportions with rectangles; it has no time axis.", "Correct — A line chart puts dates on a continuous axis and makes rises, falls and seasonality easy to see."], "concept": "Pick a visual by the question it must answer. Trends over time are best shown with a line chart (or an area chart), because the eye follows the slope of the line. Use column/bar charts for comparing categories and pies/treemaps only for simple part-to-whole views.", "learn": "Visualization types in Power BI", "lesson": "", "cluster": "V1"}, {"id": "VA1-002", "domain": "Visualize and analyze the data", "topic": "Choose an appropriate visual", "level": "medium", "question": "Fabrikam's pricing team wants to know whether products with a higher discount % also have a lower profit margin %. There are about 300 products, and each product should appear as one point.\nWhich visual should you use?", "options": ["Funnel chart", "Scatter chart", "Ribbon chart", "Clustered column chart"], "answer": [1], "pick": 1, "tip": "Two numeric measures against each other = scatter (look for 'relationship' or 'correlation').", "why": ["Wrong — A funnel chart shows values dropping through sequential stages, such as a sales pipeline.", "Correct — A scatter chart plots one measure on the X axis and another on the Y axis, with one point per product (in the Values/Details well), so a correlation pattern becomes visible.", "Wrong — A ribbon chart shows how category rankings change over time, not how two measures relate.", "Wrong — A clustered column chart compares a measure across categories; 300 products side by side would not reveal a relationship between two measures."], "concept": "A scatter chart places each item (for example each product) at the intersection of two numeric values. Clusters, outliers and upward/downward patterns show whether the two measures are related. Adding a third measure as Size turns it into a bubble chart.", "learn": "Scatter, bubble, and dot plot charts in Power BI", "lesson": "", "cluster": "V1"}, {"id": "VA1-003", "domain": "Visualize and analyze the data", "topic": "Choose an appropriate visual", "level": "medium", "question": "The Adventure Works CFO wants one visual that starts with Gross Revenue, then shows how Cost of Goods Sold, Marketing, Salaries and Other Costs each reduce it, ending at Net Profit. Increases and decreases should be easy to tell apart.\nWhich visual best meets this requirement?", "options": ["Donut chart", "Stacked column chart", "Waterfall chart", "Gauge"], "answer": [2], "pick": 1, "tip": "Start value + ups and downs = end value? Think waterfall.", "why": ["Wrong — A donut chart shows shares of a whole and cannot show negative steps or a running total.", "Wrong — A stacked column chart shows the composition of a total, but not a running total moving from a start value to an end value.", "Correct — A waterfall chart shows a running total as values are added or subtracted, colouring increases and decreases differently and showing the final total.", "Wrong — A gauge shows one value against a target range; it cannot show several contributing steps."], "concept": "A waterfall chart explains how you get from one number to another, such as from revenue to profit or from last year's sales to this year's. Each bar floats at the running total and is coloured as an increase, decrease or total.", "learn": "Waterfall charts in Power BI", "lesson": "", "cluster": "V1"}, {"id": "VA1-004", "domain": "Visualize and analyze the data", "topic": "Choose an appropriate visual", "level": "easy", "question": "You are matching visuals to report requirements at Northwind.\nWhich TWO pairings of visual and requirement are appropriate? (Select TWO.)", "options": ["Ribbon chart — show whether two numeric measures are correlated", "Gauge — show this quarter's sales against a quarterly target within a minimum and maximum range", "Waterfall chart — show each region's share of total sales on a single date", "Funnel chart — show how many opportunities remain at each stage from Lead to Qualified to Proposal to Won"], "answer": [1, 3], "pick": 2, "tip": "Funnel = shrinking stages; Gauge = one number vs a target on a dial.", "why": ["Wrong — Correlation between two measures is shown with a scatter chart; a ribbon chart shows rank changes over time.", "Correct — A gauge shows a single value on a circular arc with optional minimum, maximum and target values.", "Wrong — Share of a total at one point in time is a pie, donut or treemap job; a waterfall shows a running total with increases and decreases.", "Correct — A funnel chart is designed for sequential stages where the value usually shrinks from one stage to the next."], "concept": "Some visuals are built for one specific story. Funnels show a process with stages (pipeline, conversion). Gauges show progress of one value toward a goal. Knowing each visual's 'job' makes choosing quick on the exam.", "learn": "Visualization types in Power BI", "lesson": "", "cluster": "V1"}, {"id": "VA1-005", "domain": "Visualize and analyze the data", "topic": "Choose an appropriate visual", "level": "medium", "question": "Contoso sells five product categories. The marketing team wants to see, month by month, which category was ranked number 1 in sales and how the rankings swapped over the year. The top-ranked category should always appear at the top for each month.\nWhich visual should you use?", "options": ["Waterfall chart", "Ribbon chart", "Line chart", "Treemap"], "answer": [1], "pick": 1, "tip": "Ribbon = Ranking over time (both start with R).", "why": ["Wrong — A waterfall chart shows a running total with increases and decreases, not category rankings.", "Correct — A ribbon chart orders categories by value within each period, with the highest on top, and the ribbons show when categories swap ranks.", "Wrong — A line chart shows each category's trend, but it does not reorder by rank in each period, so rank swaps are harder to read.", "Wrong — A treemap shows part-to-whole at one point in time and has no time axis."], "concept": "A ribbon chart is a stacked chart that re-sorts the categories in every period so the largest is on top. The ribbons connecting periods make it easy to see when a category moves up or down in rank.", "learn": "Ribbon charts in Power BI", "lesson": "", "cluster": "V1"}, {"id": "VA1-006", "domain": "Visualize and analyze the data", "topic": "Choose an appropriate visual", "level": "medium", "question": "An Adventure Works executive wants a compact visual that shows current month sales, turns red or green depending on whether a sales goal is met, and shows the sales trend over recent months in the background.\nWhich visual should you use?", "options": ["Card", "KPI", "Gauge", "Slicer"], "answer": [1], "pick": 1, "tip": "KPI visual = Value + Target + Trend axis in one tile.", "why": ["Wrong — A card shows a number, but it has no built-in trend axis to show the trend over recent months.", "Correct — The KPI visual uses a Value, a Target and a Trend axis, shows the status with colour, and draws the trend behind the number.", "Wrong — A gauge compares one value with a target on a dial but does not show a trend over time.", "Wrong — A slicer lets users filter the report; it does not display a measure against a goal."], "concept": "The KPI visual is built for status-at-a-glance: it needs a measure (Value), a goal (Target) and a time field (Trend axis). It shows whether you are above or below target and how the value has been moving.", "learn": "Key performance indicator (KPI) visuals", "lesson": "", "cluster": "V1"}, {"id": "VA1-007", "domain": "Visualize and analyze the data", "topic": "Choose an appropriate visual", "level": "easy", "question": "Northwind's finance team wants a grid that shows sales with Product Category on rows (expandable to Subcategory), Year across the columns, and subtotals and grand totals for both rows and columns.\nWhich visual should you use?", "options": ["Matrix", "Multi-row card", "Table", "Stacked bar chart"], "answer": [0], "pick": 1, "tip": "Need fields on BOTH rows and columns (like an Excel PivotTable)? Use a matrix.", "why": ["Correct — A matrix works like a PivotTable: it supports row and column groups, expand/collapse of hierarchies, and row and column subtotals.", "Wrong — A multi-row card shows a few values as text blocks, not a grid with totals.", "Wrong — A table shows a flat list of columns; it cannot put Year across the columns or provide expandable row groups.", "Wrong — A stacked bar chart shows totals graphically but not a grid of exact numbers with subtotals."], "concept": "A table is a flat list (one row per combination of fields). A matrix adds column groups and row/column hierarchies with subtotals, much like an Excel PivotTable, and supports drill down on rows and columns.", "learn": "Create a matrix visual in Power BI", "lesson": "", "cluster": "V1"}, {"id": "VA1-008", "domain": "Visualize and analyze the data", "topic": "Choose an appropriate visual", "level": "easy", "question": "Contoso has a Stores table with Latitude and Longitude columns and a Sales measure. The operations manager wants to see where each store is located, with a bigger bubble for stores with higher sales.\nWhich type of visual should you use?", "options": ["Line chart", "Funnel chart", "A map visual (for example, Azure Maps)", "Treemap"], "answer": [2], "pick": 1, "tip": "Location data + 'where' question = a map visual.", "why": ["Wrong — A line chart shows trends along an axis, not locations.", "Wrong — A funnel chart shows sequential stages, not geography.", "Correct — A map visual plots each store at its latitude/longitude on a map background and can size the bubbles by the Sales measure.", "Wrong — A treemap sizes rectangles by value but has no geographic positioning."], "concept": "When the question is 'where?', use a map visual. Set the data category of location columns (such as City or Latitude/Longitude) so Power BI geocodes them correctly. Bubble size can then represent a measure such as sales.", "learn": "Tips and tricks for map visuals in Power BI", "lesson": "", "cluster": "V1"}, {"id": "VA1-009", "domain": "Visualize and analyze the data", "topic": "Choose an appropriate visual", "level": "easy", "question": "Fabrikam has 40 product subcategories grouped into 6 categories. The report page has limited space, and users want to see at a glance which categories and subcategories make up the largest share of total sales.\nWhich visual is the best fit?", "options": ["Line chart", "Scatter chart", "Treemap", "Gauge"], "answer": [2], "pick": 1, "tip": "Many parts of a whole + hierarchy + little space = treemap.", "why": ["Wrong — A line chart shows trends over time, not part-to-whole proportions.", "Wrong — A scatter chart shows the relationship between two measures, not shares of a total.", "Correct — A treemap shows hierarchical part-to-whole data as nested rectangles sized by value, and it fits many items into a small area.", "Wrong — A gauge shows a single value against a target."], "concept": "Treemaps display parts of a whole as rectangles whose area matches the value. They handle many categories better than a pie chart and can show a hierarchy (category, then subcategory) by nesting.", "learn": "Treemaps in Power BI", "lesson": "", "cluster": "V1"}, {"id": "VA1-010", "domain": "Visualize and analyze the data", "topic": "Conditional formatting", "level": "medium", "question": "A matrix on Contoso's profitability page shows Margin % for each product. Without writing any DAX, you must make the cell background red when Margin % is below 0%, yellow from 0% up to 10%, and green when it is 10% or above.\nWhat should you configure?", "options": ["A custom report theme (JSON file) with red, yellow and green as the first three data colors", "Conditional formatting > Background color with Format style set to Gradient", "Conditional formatting > Background color with Format style set to Rules", "Conditional formatting > Data bars"], "answer": [2], "pick": 1, "tip": "Fixed thresholds with exact colors = Rules; smooth color scale = Gradient.", "why": ["Wrong — A theme sets default colours for the whole report; it does not colour cells based on their values.", "Wrong — Gradient creates a smooth colour scale between minimum and maximum (and optionally a centre), not three fixed colour bands with exact cut-offs.", "Correct — Rules let you define ranges (for example < 0, >= 0 and < 0.1, >= 0.1) and assign an exact colour to each range, with no DAX needed.", "Wrong — Data bars draw a bar inside each cell proportional to the value; they do not colour the background by thresholds."], "concept": "Conditional formatting changes a visual's colours based on data. Gradient gives a colour scale, Rules apply exact colours to value ranges, and Field value uses a measure that returns a colour. Data bars and icons are other options for tables and matrices.", "learn": "Apply conditional table formatting in Power BI", "lesson": "", "cluster": "V1"}, {"id": "VA1-011", "domain": "Visualize and analyze the data", "topic": "Conditional formatting", "level": "hard", "question": "You want the font colour of the Margin % column in a Fabrikam table to be controlled by a DAX measure, using Conditional formatting > Font color > Format style = Field value.\nWhich measure can you select as the field to base the colour on?", "options": ["```\nMargin Color = IF ( [Margin %] < 0, 1, 0 )\n```", "```\nMargin Color = SUMMARIZE ( Sales, Product[Category], \"M\", [Margin %] )\n```", "```\nMargin Color = [Margin %] < 0\n```", "```\nMargin Color = IF ( [Margin %] < 0, \"#D64550\", \"#2E8B57\" )\n```"], "answer": [3], "pick": 1, "tip": "Field value formatting = the measure must RETURN the colour itself (hex code or colour name) as text.", "why": ["Wrong — Returning 1 or 0 gives numbers, not colours; you would need Rules or Gradient to map numbers to colours.", "Wrong —
