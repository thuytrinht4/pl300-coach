ng.", "Wrong — emailing files creates many disconnected copies and no single source of truth."], "concept": "My workspace is a personal area for your own work and experiments. Team content belongs in a shared workspace, where you add people with roles (Admin, Member, Contributor, Viewer). Content in My workspace is tied to that one user, so it is at risk if the user leaves.", "learn": "Workspaces in Power BI", "lesson": "Lesson 4 ⏱ 01:17:25", "cluster": "S1"}, {"id": "MS-002", "domain": "Manage and secure Power BI", "topic": "Workspace roles", "level": "easy", "question": "Contoso's sales reps should open reports in a workspace, use slicers and drill down, but must not create, edit or delete anything.\nWhich workspace role should they get?", "options": ["Admin", "Contributor", "Member", "Viewer"], "answer": [3], "pick": 1, "tip": "Viewer = look and click, never change.", "why": ["Wrong — Admin has full control, including deleting the workspace.", "Wrong — Contributor can create, edit and delete content.", "Wrong — Member can edit content, add people and publish the app.", "Correct — Viewer can view and interact with content (filter, drill, slice) but cannot change it."], "concept": "The four workspace roles from least to most powerful are Viewer, Contributor, Member and Admin. Viewers can only view and interact with content. Following least privilege, give people the lowest role that lets them do their job.", "learn": "Roles in workspaces in Power BI", "lesson": "Lesson 5 ⏱ 00:30:01", "cluster": "S1"}, {"id": "MS-003", "domain": "Manage and secure Power BI", "topic": "Workspace roles", "level": "medium", "question": "Ana must publish reports from Power BI Desktop to the Finance workspace and edit or delete reports and semantic models there. She must NOT be able to add or remove people from the workspace.\nWhich role gives her the least privilege that meets the need?", "options": ["Contributor", "Viewer", "Admin", "Member"], "answer": [0], "pick": 1, "tip": "Contributor = creates content, doesn't manage people.", "why": ["Correct — Contributors can publish, edit and delete content but cannot manage workspace access.", "Wrong — Viewers can't publish or edit content.", "Wrong — Admin has full control, including managing all users; far more than needed.", "Wrong — Members can also add people to the workspace, which is more than she should have."], "concept": "Contributor is the 'content creator' role: publish, edit and delete items in the workspace. Managing who has access starts at Member. Choosing the lowest role that works is the least-privilege principle.", "learn": "Roles in workspaces in Power BI", "lesson": "Lesson 5 ⏱ 00:30:01", "cluster": "S1"}, {"id": "MS-004", "domain": "Manage and secure Power BI", "topic": "Workspace roles", "level": "medium", "question": "Kim is a Member of the Operations workspace. She tries several actions.\nWhich action requires the Admin role, so Kim CANNOT do it?", "options": ["Add a colleague to the workspace with the Member role", "Add a colleague to the workspace with the Admin role", "Edit a report in the workspace", "Publish or update the workspace app"], "answer": [1], "pick": 1, "tip": "Members can add people up to Member — only Admins make Admins.", "why": ["Wrong — Members can add users as Member, Contributor or Viewer.", "Correct — only an Admin can add or remove Admins (and delete or update the workspace itself).", "Wrong — Members can edit content.", "Wrong — Members can publish and update the app."], "concept": "Member is just below Admin: it can edit content, share items, add people with Member/Contributor/Viewer roles and publish/update the app. Admin-only tasks include adding or removing Admins and deleting the workspace. Keep the number of Admins small.", "learn": "Roles in workspaces in Power BI", "lesson": "Lesson 5 ⏱ 00:30:01", "cluster": "S1"}, {"id": "MS-005", "domain": "Manage and secure Power BI", "topic": "Workspace roles", "level": "medium", "question": "Duc has the Contributor role in a workspace. The workspace Admin has NOT changed any app settings.\nWhich TWO actions can Duc perform? (Select TWO.)", "options": ["Add a new colleague to the workspace as a Viewer", "Delete the workspace", "Publish or update the workspace app", "Edit and delete reports and dashboards in the workspace", "Publish a report from Power BI Desktop to the workspace"], "answer": [3, 4], "pick": 2, "tip": "Contributor: content yes, people no, app only if the Admin allows.", "why": ["Wrong — managing workspace access requires Member or Admin.", "Wrong — deleting the workspace is Admin-only.", "Wrong — by default Contributors can't publish or update the app; an Admin must turn on a workspace setting to allow it.", "Correct — Contributors can create, edit and delete content in the workspace.", "Correct — Contributors can publish content to the workspace."], "concept": "Contributors work on content but don't control access. Publishing or updating the app is a Member/Admin task by default; Admins can optionally allow Contributors to update the app in workspace settings.", "learn": "Roles in workspaces in Power BI", "lesson": "Lesson 5 ⏱ 00:30:01", "cluster": "S1"}, {"id": "MS-006", "domain": "Manage and secure Power BI", "topic": "Apps", "level": "medium", "question": "A Contributor fixes a wrong title in a report inside the Sales workspace. Workspace users see the fix immediately, but people who use the Sales app still see the old title the next day.\nWhat is the reason?", "options": ["The Contributor must share the report again with each app user", "App users must clear their browser cache", "The semantic model's scheduled refresh hasn't run yet", "The app must be updated by someone with permission (for example a Member or Admin) before changes reach app users"], "answer": [3], "pick": 1, "tip": "Workspace = kitchen, app = served plate: re-plate (update app) to serve changes.", "why": ["Wrong — app users get content through the app; resharing the report doesn't update the app.", "Wrong — caching isn't the cause; the app itself still holds the old version of the content.", "Wrong — refresh updates data, not report design such as a title.", "Correct — changes in the workspace are only pushed to the app when someone with permission updates the app."], "concept": "An app is a packaged, read-only copy of selected workspace content for consumers. Editing in the workspace doesn't change the app until it is updated (republished). This lets creators work without disturbing consumers.", "learn": "Publish an app in Power BI", "lesson": "Lesson 5 ⏱ 00:30:01", "cluster": "S1"}, {"id": "MS-007", "domain": "Manage and secure Power BI", "topic": "Apps", "level": "hard", "question": "Fabrikam's Reporting workspace contains six reports. The Sales team should see three of them and the Finance team should see four (two reports are shared by both teams). Both teams must use a single app, and neither team should get workspace access.\nWhat should you do?", "options": ["Add both teams as Viewers in the workspace and hide reports with row-level security", "Share each report individually with the right team instead of using an app", "Publish one app and create two audiences, each showing only the reports for that team", "Publish two separate apps from the same workspace, one per team"], "answer": [2], "pick": 1, "tip": "One workspace → one app → many audiences.", "why": ["Wrong — Viewer gives workspace access to all items, and RLS filters data rows, not which reports are visible.", "Wrong — direct sharing works, but it doesn't meet the requirement of using a single app and is harder to manage.", "Correct — app audiences let you choose which content each group sees inside one app.", "Wrong — a workspace can publish only one app."], "concept": "Each workspace can have one app. Inside the app you can create audiences: groups of users who see a chosen subset of the app's reports and dashboards. This avoids creating extra workspaces just to show different content to different teams.", "learn": "Publish an app in Power BI (audiences)", "lesson": "", "cluster": "S1"}, {"id": "MS-008", "domain": "Manage and secure Power BI", "topic": "Apps", "level": "easy", "question": "Adventure Works wants to give 500 employees a single, polished place to consume a set of reports and dashboards. The employees only read content and should never see work in progress.\nWhat is the best way to distribute the content?", "options": ["Publish a Power BI app from the workspace", "Add all 500 employees as Members of the workspace", "Email the .pbix file to everyone", "Use Publish to web"], "answer": [0], "pick": 1, "tip": "Many readers + finished content = app.", "why": ["Correct — an app packages finished reports and dashboards for large groups of consumers.", "Wrong — Members can edit content and manage access; far too much permission, and they'd see work in progress.", "Wrong — everyone would need Power BI Desktop, and copies get out of date.", "Wrong — Publish to web makes content public on the internet with no security."], "concept": "Reports are built in Desktop, dashboards collect pinned tiles, and an app bundles finished content for consumers. Apps are the recommended way to distribute content to many people in an organization.", "learn": "Publish an app in Power BI", "lesson": "Lesson 4 ⏱ 00:52:12", "cluster": "S1"}, {"id": "MS-009", "domain": "Manage and secure Power BI", "topic": "Build permission", "level": "hard", "question": "Northwind keeps a certified 'Sales Model' semantic model in a central Data workspace. Minh, an analyst who works in the Marketing workspace, wants to create his own report in Power BI Desktop connected live to Sales Model. He must not be able to change the model or see other items in the Data workspace.\nWhat should you grant Minh?", "options": ["The Contributor role in the Data workspace", "The Viewer role in the Data workspace", "Build permission on the Sales Model semantic model", "A copy of the Sales Model .pbix file"], "answer": [2], "pick": 1, "tip": "Build = build ON the model, not IN the model.", "why": ["Wrong — Contributor can edit and delete the model and sees all workspace items.", "Wrong — Viewer exposes all workspace items and does not include Build permission by default.", "Correct — Build lets a user create new reports on top of a semantic model without editing it or getting workspace access.", "Wrong — a copy breaks the single source of truth and lets him change his copy of the model."], "concept": "Build permission on a semantic model lets people create their own reports, use Analyze in Excel, and connect live from Desktop, while the model stays owned and controlled by its creator. It supports the pattern 'one shared model, many reports'.", "learn": "Build permission for shared semantic models", "lesson": "Lesson 5 ⏱ 00:51:26", "cluster": "S1"}, {"id": "MS-010", "domain": "Manage and secure Power BI", "topic": "Build permission", "level": "medium", "question": "A finance user can view a report. She now wants to use Analyze in Excel to build a PivotTable that stays connected to the report's semantic model and can be refreshed.\nWhat is the minimum semantic model permission she needs?", "options": ["Write", "Build", "Read", "Reshare"], "answer": [1], "pick": 1, "tip": "Excel live connection = building new content = Build.", "why": ["Wrong — Write allows editing the model itself; more than she needs.", "Correct — Analyze in Excel creates new content on the model, which requires Build.", "Wrong — Read lets her view reports that use the model, but not create new content such as a connected PivotTable.", "Wrong — Reshare only lets her share the model with others."], "concept": "Semantic model permissions include Read, Build, Reshare and Write. Anything that creates new content from a model (new reports, Analyze in Excel, live connection from Desktop) needs Build. Grant it only when there's a real need.", "learn": "Semantic model permissions", "lesson": "Lesson 5 ⏱ 00:53:32", "cluster": "S1"}, {"id": "MS-011", "domain": "Manage and secure Power BI", "topic": "Endorsement", "level": "easy", "question": "Your company wants users to trust a semantic model marked as the official, quality-checked source.\nWho can apply the Certified endorsement to it?", "options": ["Only reviewers who have been authorized by the Power BI / Fabric administrator", "Any user who has the model open in Power BI Desktop", "Any Member of the workspace that contains the model", "Any user with Build permission on the model"], "answer": [0], "pick": 1, "tip": "Promote = 'I think it's good'; Certify = 'the org says it's good'.", "why": ["Correct — certification is limited to people the admin authorizes, so it carries organization-level trust.", "Wrong — endorsement is set in the Service, and opening a model in Desktop gives no such right.", "Wrong — workspace Members can promote content, but they can certify only if they are also authorized reviewers.", "Wrong — Build lets users create content on the model, not endorse it."], "concept": "Endorsement helps people find trustworthy content. Promoted can be applied by content owners/editors to say 'this is ready to use'. Certified can only be applied by reviewers authorized by the admin, after the content meets organizational standards.", "learn": "Endorse your content (promotion and certification)", "lesson": "", "cluster": "S1"}, {"id": "MS-012", "domain": "Manage and secure Power BI", "topic": "Endorsement", "level": "easy", "question": "Hoa owns a well-tested semantic model and wants colleagues to notice it and reuse it. Her company has not set up any certification process.\nWhat should she do?", "options": ["Use Publish to web for the semantic model's report", "Certify the semantic model", "Apply a sensitivity label to the semantic model", "Promote the semantic model"], "answer": [3], "pick": 1, "tip": "No certification process? Promote.", "why": ["Wrong — Publish to web makes a report public; it has nothing to do with endorsement.", "Wrong — certifying requires authorization from the admin, which Hoa doesn't have.", "Wrong — sensitivity labels classify how confidential data is; they don't signal quality or recommend reuse.", "Correct — any owner/editor of the content can promote it to signal that it's ready for reuse."], "concept": "Promotion is the lightweight endorsement any content creator can use to highlight valuable items. Endorsed items stand out in search and in the OneLake catalog, which encourages reuse instead of duplicate models.", "learn": "Endorse your content (promotion and certification)", "lesson": "", "cluster": "S1"}, {"id": "MS-013", "domain": "Manage and secure Power BI", "topic": "Deployment pipelines", "level": "easy", "question": "Your team wants to build and test new report features without disturbing the live report that managers use every day.\nWhich Power BI feature is designed for this?", "options": ["Lineage view", "Deployment pipelines", "Row-level security", "Data alerts"], "answer": [1], "pick": 1, "tip": "Pipelines = Dev → Test → Prod lanes.", "why": ["Wrong — lineage view shows dependencies between items; it doesn't manage releases.", "Correct — deployment pipelines give separate development, test and production stages so changes are tested before reaching users.", "Wrong — RLS restricts which rows a user can see.", "Wrong — alerts notify you when a dashboard tile crosses a threshold."], "concept": "Deployment pipelines link workspaces as stages (by default Development, Test, Production). You build in Development, validate in Test and then deploy to Production, so consumers are never interrupted by unfinished work.", "learn": "Overview of deployment pipelines", "lesson": "Lesson 5 ⏱ 00:35:39", "cluster": "S2"}, {"id": "MS-014", "domain": "Manage and secure Power BI", "topic": "Deployment pipelines", "level": "hard", "question": "In a deployment pipeline, the semantic model in the Development stage connects to the SQL database 'SalesDev'. After each deployment to Production, someone manually edits the model to point it to 'SalesProd'. You want to stop this manual step.\nWhat should you configure?", "options": ["A separate .pbix file for Production that you publish manually", "A deployment rule (data source or parameter rule) on the semantic model in the Production stage", "Row-level security that filters to production rows", "A personal-mode gateway for the Production workspace"], "answer": [1], "pick": 1, "tip": "Different stage, different source → deployment rule.", "why": ["Wrong — maintaining a separate file defeats the purpose of the pipeline and brings back manual work.", "Correct — deployment rules change the data source or parameter values for a stage automatically on each deployment.", "Wrong — RLS filters rows per user; it doesn't switch databases.", "Wrong — a gateway provides connectivity to on-premises sources; it doesn't choose which database the model uses."], "concept": "Deployment rules let each stage keep its own settings, such as a data source or parameter value, so Dev can use test data and Production can use live data. Rules are set on the target stage and applied every time you deploy.", "learn": "Create deployment rules", "lesson": "Lesson 5 ⏱ 01:34:47", "cluster": "S2"}, {"id": "MS-015", "domain": "Manage and secure Power BI", "topic": "Deployment pipelines", "level": "medium", "question": "Your workspace uses a three-stage deployment pipeline, and the Production workspace publishes the app that users open. You have finished a new report page.\nWhich order of steps is correct?", "options": ["Edit in Production → deploy back to Test → deploy back to Development", "Build in Test → deploy to Development → update the app", "Build in Development → deploy directly to Production → test in Test afterwards", "Build in Development → deploy to Test and validate → deploy to Production → update the app"], "answer": [3], "pick": 1, "tip": "Build, check, ship — then refresh the shop window (the app).", "why": ["Wrong — editing directly in Production risks breaking what users see.", "Wrong — Development is where you build; content flows forward, not from Test back to Development.", "Wrong — skipping Test means problems reach users before anyone checks them.", "Correct — changes flow Development → Test → Production, and the app must be updated for app users to see them."], "concept": "Content moves forward through the pipeline: Development (build), Test (validate with test users/data), Production (live). If consumers use an app from the Production workspace, update the app after deploying so they see the new content.", "learn": "Overview of deployment pipelines", "lesson": "Lesson 5 ⏱ 00:35:39", "cluster": "S2"}, {"id": "MS-016", "domain": "Manage and secure Power BI", "topic": "Licences", "level": "hard", "question": "A workspace is on shared capacity (not Premium or Fabric capacity). Forty users with Free licences must be able to view its reports.\nWhich TWO actions would each make this possible? (Select TWO.)", "options": ["Grant the 40 users Build permission on the semantic model", "Apply a Public sensitivity label to the reports", "Move the workspace to a Fabric F64 (or larger) or Power BI Premium capacity", "Give the 40 users the Viewer role in the workspace", "Assign Power BI Pro licences to the 40 users"], "answer": [2, 4], "pick": 2, "tip": "Free can view only when the content lives in big capacity (F64+/Premium).", "why": ["Wrong — Build is a permission, not a licence; it doesn't remove the licence requirement.", "Wrong — sensitivity labels classify data; they don't affect licensing.", "Correct — content in Premium or F64+ capacity can be viewed by Free users who have been given access.", "Wrong — a role grants permission, but Free users still can't view shared content on shared capacity.", "Correct — with Pro licences, users can view content shared in a shared-capacity workspace."], "concept": "To view content that others share, a user needs a Pro (or PPU) licence, unless the content is hosted in Premium capacity or a Fabric capacity of F64 or larger, where Free users can view it. Permissions (roles, sharing) and licences are separate checks; both must be satisfied.", "learn": "Power BI licensing for users", "lesson": "Lesson 5 ⏱ 01:13:56", "cluster": "S1"}, {"id": "MS-017", "domain": "Manage and secure Power BI", "topic": "Licences", "level": "hard", "question": "Mai has a Free licence. Her company's Reporting workspace runs on a Fabric F64 capacity, and she has been added to it as a Contributor. She tries to publish a report from Power BI Desktop to that workspace.\nWhat does she need?", "options": ["The Admin role in the workspace", "Nothing extra — F64 capacity lets Free users publish Power BI reports", "A Power BI Pro (or PPU) licence", "An on-premises data gateway"], "answer": [2], "pick": 1, "tip": "Big capacity frees the viewers, not the creators.", "why": ["Wrong — Contributor already allows publishing; the missing piece is the licence, not the role.", "Wrong — F64+ lets Free users VIEW content; creating and publishing Power BI content to a shared workspace still needs Pro or PPU.", "Correct — content creators who publish Power BI items to shared workspaces need a Pro or PPU licence.", "Wrong — a gateway is for refreshing on-premises data, not for publishing."], "concept": "Licences and roles are separate. On Premium/F64+ capacity, Free users can consume content, but authors who create and publish Power BI content to shared workspaces still need Pro or PPU.", "learn": "Power BI licensing for users", "lesson": "", "cluster": "S1"}, {"id": "MS-018", "domain": "Manage and secure Power BI", "topic": "Licences", "level": "hard", "question": "A workspace's licence mode is set to Premium Per User (PPU). Several managers with Pro licences report that they can't open its reports, even though they were added as Viewers.\nWhat is the cause?", "options": ["The managers need Build permission on the semantic model", "Viewers can't open reports; they need the Contributor role", "The semantic model hasn't been refreshed today", "Content in a PPU workspace can only be accessed by users with a PPU licence"], "answer": [3], "pick": 1, "tip": "PPU content → PPU readers.", "why": ["Wrong — Build is only needed to create new content, not to view reports.", "Wrong — Viewers can open reports; the role is not the problem.", "Wrong — a missing refresh shows old data; it doesn't block access.", "Correct — PPU workspace content requires every user, including viewers, to have a PPU licence (or the content must move to a capacity)."], "concept": "Premium Per User gives Premium features to individual licensed users. Unlike Premium/Fabric capacity, it does not let lower-licensed users view the content: everyone who accesses PPU content needs a PPU licence.", "learn": "Power BI Premium Per User", "lesson": "", "cluster": "S1"}, {"id": "MS-019", "domain": "Manage and secure Power BI", "topic": "Scheduled refresh", "level": "easy", "question": "Your semantic model is in a Pro (shared capacity) workspace.\nWhat is the maximum number of scheduled refreshes you can set per day?", "options": ["4", "8", "48", "24"], "answer": [1], "pick": 1, "tip": "Pro 8, Premium 48.", "why": ["Wrong — Pro allows more than 4.", "Correct — on shared capacity with Pro, you can schedule up to 8 refreshes per day.", "Wrong — 48 per day is the limit for Premium / PPU / Fabric capacity.", "Wrong — 24 isn't a Power BI limit."], "concept": "Scheduled refresh keeps imported data up to date. Pro allows 8 scheduled refreshes per day; Premium, PPU and Fabric capacity allow 48 (every 30 minutes). Refresh is never truly real-time.", "learn": "Configure scheduled refresh", "lesson": "Lesson 4 ⏱ 00:58:22", "cluster": "S2"}, {"id": "MS-020", "domain": "Manage and secure Power BI", "topic": "Scheduled refresh", "level": "medium", "question": "The operations director wants an imported semantic model refreshed every 30 minutes from 8:00 to 18:00 (about 20 refreshes a day). The workspace is currently on Pro shared capacity.\nWhat is required?", "options": ["Turn on incremental refresh in Pro", "Nothing — schedule the 20 refreshes on Pro", "Install an on-premises data gateway in personal mode", "Move the workspace to Premium Per User or Premium/Fabric capacity"], "answer": [3], "pick": 1, "tip": "More than 8 a day? You've outgrown Pro.", "why": ["Wrong — incremental refresh makes each refresh faster but doesn't raise the daily limit.", "Wrong — Pro allows only 8 scheduled refreshes per day.", "Wrong — a gateway provides connectivity, not more refresh slots.", "Correct — PPU and Premium/Fabric capacity allow up to 48 scheduled refreshes per day."], "concept": "The number of scheduled refreshes per day depends on the licence/capacity, not on the data source. If you need more than 8 per day, use PPU or capacity (48/day). For truly live data, consider DirectQuery instead of import.", "learn": "Configure scheduled refresh", "lesson": "Lesson 5 ⏱ 00:03:35", "cluster": "S2"}, {"id": "MS-021", "domain": "Manage and secure Power BI", "topic": "Incremental refresh", "level": "hard", "question": "You configure incremental refresh on the Orders table using the RangeStart and RangeEnd parameters.\nWhich Power Query filter step is correct?", "options": ["```\nTable.SelectRows(Source, each [OrderDate] >= RangeStart and [OrderDate] < RangeEnd)\n```", "```\nTable.SelectRows(Source, each [OrderDate] >= Date.AddDays(DateTime.LocalNow(), -30))\n```", "```\nTable.SelectRows(Source, each [OrderDate] > RangeStart and [OrderDate] < RangeEnd)\n```", "```\nTable.SelectRows(Source, each [OrderDate] >= RangeStart and [OrderDate] <= RangeEnd)\n```"], "answer": [0], "pick": 1, "tip": "Start inclusive, end exclusive: >= start, < end.", "why": ["Correct — one side inclusive and the other exclusive means each row lands in exactly one partition.", "Wrong — this ignores RangeStart/RangeEnd, so Power BI can't create and refresh partitions.", "Wrong — using > on the start means a row exactly on a boundary is in no partition and is lost.", "Wrong — using <= on the end means a row exactly on a boundary falls in two partitions and is loaded twice."], "concept": "Incremental refresh splits a table into date-based partitions. Power BI substitutes values into RangeStart and RangeEnd for each partition, so the filter must use them with exactly one '=' (>= start and < end) to avoid duplicate or missing rows.", "learn": "Configure incremental refresh", "lesson": "Lesson 5 ⏱ 00:14:28", "cluster": "S2"}, {"id": "MS-022", "domain": "Manage and secure Power BI", "topic": "Incremental refresh", "level": "medium", "question": "You plan to set up incremental refresh for a large Sales table.\nWhich TWO statements are true? (Select TWO.)", "options": ["You must create two Date/Time parameters named exactly RangeStart and RangeEnd", "Incremental refresh requires Premium capacity; it is not available with Pro", "Incremental refresh only works for tables in DirectQuery mode", "You define the incremental refresh policy in Power BI Desktop; partitions are created in the Service after publishing and refreshing"], "answer": [0, 3], "pick": 2, "tip": "RangeStart + RangeEnd + policy in Desktop.", "why": ["Correct — incremental refresh relies on these exact parameter names with the Date/Time type.", "Wrong — incremental refresh is available with Pro as well as Premium.", "Wrong — it is used for imported tables (DirectQuery tables don't store data to refresh).", "Correct — you set the policy on the table in Desktop; the first refresh in the Service builds the partitions."], "concept": "Incremental refresh reloads only recent data instead of the whole table, making refreshes faster and lighter. You filter the table with RangeStart/RangeEnd, define how much history to keep and how much to refresh, and publish; the Service manages the partitions.", "learn": "Configure incremental refresh", "lesson": "Lesson 5 ⏱ 00:14:28", "cluster": "S2"}, {"id": "MS-023", "domain": "Manage and secure Power BI", "topic": "On-premises data gateway", "level": "easy", "question": "A report imports data from a SQL Server database running on a server in Contoso's own office. Scheduled refresh in the Service fails, saying the data source can't be reached.\nWhat should be installed?", "options": ["A Fabric capacity", "Power BI Report Server", "Power BI Desktop on the server", "An on-premises data gateway"], "answer": [3], "pick": 1, "tip": "Data behind your firewall → gateway is the bridge.", "why": ["Wrong — capacity adds compute power and features but doesn't reach on-premises networks.", "Wrong — Report Server hosts reports on-premises; it doesn't let the cloud Service refresh data.", "Wrong — Desktop doesn't provide a connection for the Service's scheduled refresh.", "Correct — the gateway securely connects the cloud Service to data sources inside the company network."], "concept": "The Power BI Service runs in the cloud and can't see servers inside a company network. An on-premises data gateway installed inside that network acts as a secure bridge so scheduled refresh (and DirectQuery) can reach on-premises sources.", "learn": "What is an on-premises data gateway?", "lesson": "Lesson 4 ⏱ 02:02:13", "cluster": "S2"}, {"id": "MS-024", "domain": "Manage and secure Power BI", "topic": "On-premises data gateway", "level": "medium", "question": "A semantic model combines several data sources and must refresh on a schedule in the Service.\nWhich TWO sources require an on-premises data gateway? (Select TWO.)", "options": ["An Oracle database in the company's own data center", "An Azure SQL Database", "A Salesforce (cloud) object", "An Excel workbook stored in SharePoint Online", "A CSV file in a shared folder on the company network (\\\\fileserver\\finance)"], "answer": [0, 4], "pick": 2, "tip": "Inside the building → gateway; in the cloud → no gateway.", "why": ["Correct — a database in the company's own data center is on-premises.", "Wrong — Azure SQL Database is a cloud service and doesn't need a gateway for refresh.", "Wrong — Salesforce is a cloud service reached directly over the internet.", "Wrong — SharePoint Online is a cloud source the Service can reach directly.", "Correct — a network file share is inside the company network, so the Service needs a gateway to reach it."], "concept": "Ask 'where does the data live?'. Sources inside your network (on-premises databases, local or network file paths) need a gateway for refresh. Cloud sources such as SharePoint Online, OneDrive for work or school, Azure SQL Database and SaaS apps generally don't.", "learn": "What is an on-premises data gateway?", "lesson": "Lesson 4 ⏱ 02:02:13", "cluster": "S2"}, {"id": "MS-025", "domain": "Manage and secure Power BI", "topic": "On-premises data gateway", "level": "medium", "question": "Long installed an on-premises data gateway in personal mode on his laptop. Now his team wants to use the same gateway for several analysts' semantic models, including a DirectQuery model.\nWhich TWO statements explain why personal mode is not suitable? (Select TWO.)", "options": ["A personal-mode gateway can be used only by the person who installed it", "Personal mode only works with Premium capacity", "Personal mode can't refresh Excel or CSV files", "Personal mode doesn't support DirectQuery or live connections"], "answer": [0, 3], "pick": 2, "tip": "Personal = one person, import only. Standard = team, DirectQuery too.", "why": ["Correct — personal mode serves one user and can't be shared with others.", "Wrong — personal mode doesn't require Premium.", "Wrong — personal mode can refresh file sources such as Excel and CSV.", "Correct — personal mode supports scheduled refresh of imported data only; DirectQuery needs standard mode."], "concept": "The gateway has two modes. Personal mode is for one user refreshing their own import models. Standard mode is installed (ideally on an always-on server) for many users and supports DirectQuery and live connections, with data sources managed centrally.", "learn": "On-premises data gateway (personal mode)", "lesson": "Lesson 8 ⏱ 00:23:02", "cluster": "S2"}, {"id": "MS-026", "domain": "Manage and secure Power BI", "topic": "Sharing", "level": "medium", "question": "A regional manager needs to view ONE report from the Sales workspace. The workspace also contains draft reports she must not see, and she doesn't need an app.\nWhat should you do?", "options": ["Add her to the workspace with the Contributor role", "Grant her only Build permission on the semantic model", "Share that report directly with her", "Add her to the workspace with the Viewer role"], "answer": [2], "pick": 1, "tip": "One item for one person → Share; whole workspace → role.", "why": ["Wrong — Contributor can see and edit everything in the workspace.", "Wrong — Build is for creating new content on the model; it isn't the way to give someone a specific report to view.", "Correct — direct sharing gives access to that specific report without opening the rest of the workspace.", "Wrong — a workspace role gives access to every item in the workspace, including the drafts."], "concept": "There are three main ways to give access: workspace roles (everything in the workspace, for collaborators), apps (packaged content for consumers) and direct sharing (a single report or dashboard for specific people). Pick the narrowest one that fits.", "learn": "Share Power BI reports and dashboards", "lesson": "Lesson 5 ⏱ 00:49:43", "cluster": "S1"}, {"id": "MS-027", "domain": "Manage and secure Power BI", "topic": "Data alerts", "level": "medium", "question": "A manager pins several visuals from a report to a dashboard and wants an email when values cross a threshold.\nOn which THREE types of dashboard tiles can she set a data alert? (Select THREE.)", "options": ["Clustered column chart", "Line chart", "Table", "Card", "Gauge", "KPI"], "answer": [3, 4, 5], "pick": 3, "tip": "Alerts need one number: Card, KPI, Gauge.", "why": ["Wrong — column chart tiles don't support data alerts.", "Wrong — line chart tiles don't support data alerts.", "Wrong — table tiles don't support data alerts.", "Correct — a card shows a single number, so it supports alerts.", "Correct — gauge tiles support alerts.", "Correct — KPI tiles support alerts."], "concept": "Data alerts are set in the Power BI Service on dashboard tiles (not on report visuals) that show a single value: cards, KPIs and gauges. When the data refreshes and the value crosses your threshold, you get a notification and optionally an email.", "learn": "Set data alerts in the Power BI service", "lesson": "", "cluster": "S2"}, {"id": "MS-028", "domain": "Manage and secure Power BI", "topic": "Subscriptions", "level": "easy", "question": "The vice president wants to receive an email with a snapshot of the Sales dashboard every Monday at 8:00, no matter what the numbers are.\nWhat should you set up?", "options": ["A data alert on a card tile", "A deployment pipeline", "Publish to web", "A subscription"], "answer": [3], "pick": 1, "tip": "Subscription = on a schedule; alert = on a threshold.", "why": ["Wrong — alerts fire only when a value crosses a threshold, not on a fixed schedule.", "Wrong — pipelines move content between development, test and production.", "Wrong — Publish to web creates a public link; it doesn't send emails.", "Correct — subscriptions email a snapshot (with a link) of a report page or dashboard on a schedule."], "concept": "Subscriptions deliver content by email on a schedule (for example daily or weekly). Data alerts deliver a notification only when a tile's value crosses a threshold. Use subscriptions for routine updates and alerts for exceptions.", "learn": "Email subscriptions for reports and dashboards", "lesson": "", "cluster": "S2"}, {"id": "MS-029", "domain": "Manage and secure Power BI", "topic": "Lineage view", "level": "medium", "question": "A dashboard in a busy workspace shows an error. You suspect the problem started further upstream in a dataflow or data source, but the workspace list has dozens of items.\nWhich feature helps you trace the chain from source to dashboard?", "options": ["Lineage view", "Row-level security", "Usage metrics report", "Deployment pipelines"], "answer": [0], "pick": 1, "tip": "Lineage = the family tree of your data.", "why": ["Correct — lineage view shows how data sources, dataflows, semantic models, reports and dashboards connect, so you can follow the chain upstream.", "Wrong — RLS controls which rows users see.", "Wrong — usage metrics show how often content is viewed, not dependencies.", "Wrong — pipelines move content between stages; they don't diagnose dependencies."], "concept": "Lineage view displays workspace items as a connected flow: data source → dataflow → semantic model → report → dashboard. It helps you troubleshoot errors and understand what depends on what.", "learn": "Use lineage view in Power BI", "lesson": "Lesson 4 ⏱ 01:49:37", "cluster": "S2"}, {"id": "MS-030", "domain": "Manage and secure Power BI", "topic": "Impact analysis", "level": "medium", "question": "You plan to rename several columns in a semantic model that many teams reuse in other workspaces. Before making the change, you want to see which reports and workspaces depend on the model and notify their contacts.\nWhat should you use?", "options": ["A subscription to the semantic model", "The Test as role option", "Impact analysis for the semantic model", "A data alert"], "answer": [2], "pick": 1, "tip": "Before you change it, check who it breaks: impact analysis.", "why": ["Wrong — subscriptions email report snapshots; they don't analyze dependencies.", "Wrong — Test as role checks RLS results for a role.", "Correct — impact analysis lists downstream items and workspaces that use the model and lets you notify their contacts.", "Wrong — alerts watch tile values; they don't show dependencies."], "co ate roles and DAX filters in Desktop → test with View as → publish → assign users/groups to roles in the Service → test with Test as role", "Create roles in Desktop → assign users to the roles in Desktop → publish", "Publish → create roles in the report's Filters pane → assign users in Desktop", "Assign members in the Service → create roles in Desktop → publish → test with View as"], "answer": [0], "pick": 1, "tip": "Define in Desktop, assign in the Service, test in both.", "why": ["Correct — roles are defined in Desktop, published with the model, then members are assigned in the Service and validated.", "Wrong — Desktop has no place to add users to roles; that happens in the Service.", "Wrong — the Filters pane doesn't create security roles, and members aren't assigned in Desktop.", "Wrong — you can't assign members to roles that don't exist yet in the published model."], "concept": "RLS roles and their DAX filters are created in Power BI Desktop (Manage roles) and checked with View as. After publishing, you add users or security groups to each role in the Service from the semantic model's Security settings, and can check with Test as role.", "learn": "Row-level security (RLS) with Power BI", "lesson": "Lesson 5 ⏱ 00:58:24", "cluster": "S3"}, {"id": "MS-036", "domain": "Manage and secure Power BI", "topic": "Row-level security", "level": "hard", "question": "You published a model with an RLS role 'East' and added Tom to it. Tom still sees all regions. Tom has the Member role in the workspace that contains the model.\nWhat should you do so that RLS applies to Tom?", "options": ["Add Tom to a second RLS role", "Republish the model from Desktop", "Apply a Confidential sensitivity label to the report", "Change Tom's workspace role to Viewer (or remove his workspace role and give him access through an app or sharing)"], "answer": [3], "pick": 1, "tip": "RLS only binds Viewers; editors see everything.", "why": ["Wrong — more roles would combine permissions; it won't restrict a Member.", "Wrong — republishing doesn't change the fact that Members aren't restricted by RLS.", "Wrong — sensitivity labels don't filter data.", "Correct — RLS applies only to users with Viewer role or read access (app/sharing); Admins, Members and Contributors see all data."], "concept": "RLS filters data only for people who consume the model with read permissions, such as workspace Viewers or app/shared users. Admins, Members and Contributors can edit the model, so RLS doesn't apply to them. That's why test users should be Viewers.", "learn": "Row-level security (RLS) with Power BI", "lesson": "Lesson 5 ⏱ 00:58:24", "cluster": "S3"}, {"id": "MS-037", "domain": "Manage and secure Power BI", "topic": "Row-level security", "level": "easy", "question": "You created an RLS role named 'Europe' in Power BI Desktop and want to check what a user in that role would see before publishing.\nWhat should you use?", "options": ["The Performance analyzer", "Publish to web", "Modeling > View as, then select the Europe role", "Lineage view"], "answer": [2], "pick": 1, "tip": "Try it on before you ship it: View as.", "why": ["Wrong — Performance analyzer measures visual speed, not security.", "Wrong — Publish to web makes a public link; it doesn't test roles.", "Correct — View as lets you preview the report as a member of one or more roles in Desktop.", "Wrong — lineage view is a Service feature showing dependencies."], "concept": "Always test RLS before rolling it out. In Desktop, View as shows the report filtered by the chosen role(s). In the Service, the semantic model's Security page has Test as role, which can also test as a specific user.", "learn": "Validate row-level security roles", "lesson": "", "cluster": "S3"}, {"id": "MS-038", "domain": "Manage and secure Power BI", "topic": "Row-level security", "level": "medium", "question": "You are managing RLS for a published Sales model.\nWhich TWO statements are true? (Select TWO.)", "options": ["If a user belongs to two curity restricts access to entire tables or columns for specific roles. For users without access, the object behaves as if it doesn't exist. Like RLS, it is defined in roles and applies to users with read permissions (Viewers).", "learn": "Object-level security (OLS)", "lesson": "Lesson 5 ⏱ 01:04:38", "cluster": "S3"}, {"id": "MS-040", "domain": "Manage and secure Power BI", "topic": "Publish to web", "level": "easy", "question": "A colleague wants to use Publish to web to show the internal profit-margin report to the sales team quickly.\nWhat is the main risk?", "options": ["Only users with a Pro licence can open the link", "The report will be read-only", "Anyone on the internet who has the link can view the report and its data, with no sign-in", "The report can no longer be refreshed"], "answer": [2], "pick": 1, "tip": "Publish to web = public internet. Never for internal data.", "why": ["Wrong — no licence or sign-in is needed at all, which is exactly the risk.", "Wrong — being read-only isn't a security risk.", "Correct — Publish to web creates a public link; anyone who has it, inside or outside the company, can see the data.", "Wrong — published-to-web reports still show refreshed data."], "concept": "Publish to web is only for public, non-sensitive data. For internal content, use workspace access, apps, direct sharing or secure embedding (which require sign-in). Admins can disable or restrict Publish to web in the tenant settings.", "learn": "Publish to web from Power BI", "lesson": "Lesson 4 ⏱ 00:23:48", "cluster": "S3"}];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return dstr(d); };

function rng(seed){ let h = 2166136261; for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1e6) / 1e6; }; }
function shuffle(a, r = Math.random){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function md(text){
  return String(text).split(/```[a-zA-Z]*\n?/).map((p, i) => i % 2
    ? `<pre><code>${esc(p.replace(/\n$/, ""))}</code></pre>`
    : p.split(/\n+/).filter(x => x.trim()).map(l => `<p>${esc(l).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")}</p>`).join("")).join("");
}
const inline = t => /```/.test(t) ? md(t) : esc(t).replace(/`([^`]+)`/g, "<code>$1</code>");

function lsAll(){ const out = {}; try { const p = LSK(); for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k.startsWith(p)) out[k.slice(p.length)] = JSON.parse(localStorage.getItem(k)); } } catch(e){} return out; }

const queues = {};
function persist(id){            // one write at a time per doc; coalesce bursts into the latest state
  const e = queues[id] ||= {busy:false, dirty:false};
  if (e.busy){ e.dirty = true; return; }
  (async () => {
    e.busy = true;
    do {
      e.dirty = false;
      const data = JSON.parse(JSON.stringify(S.docs[id]));
      lsSet(id, data);
      if (S.cloud){
        setSync("saving");
        try { await S.col.doc(id).set(data); setSync("cloud"); }
        catch(err){
          if (err?.code === "unavailable"){ await new Promise(r => setTimeout(r, 800 + Math.random()*800)); try { await S.col.doc(id).set(data); setSync("cloud"); } catch(e2){ setSync("error", e2); } }
          else setSync("error", err);
        }
      }
    } while (e.dirty);
    e.busy = false;
  })();
}
async function removeDoc(id){ delete S.docs[id]; lsDel(id); if (S.cloud){ try { await S.col.doc(id).delete(); } catch(e){} } }
function setSync(state, err){
  const el = $("sync");
  if (state === "cloud"){ el.textContent = "Synced"; el.className = "sync cloud"; el.title = "Saved to your account"; }
  else if (state === "saving"){ el.textContent = "Saving…"; el.className = "sync"; }
  else if (state === "error"){
    el.textContent = "Not synced"; el.className = "sync"; el.title = "";
    if (err?.code === "quota_exceeded") note("Your account storage for this page is full. Older day logs can be cleared from Progress → Reset.");
    else if (err?.code === "invalid_argument" || err?.code === "revoked") { S.cloud = false; note("Your progress can't be saved to your account in this view, so it's kept in this browser only."); }
  } else { el.textContent = "This browser"; el.className = "sync"; el.title = "Progress is saved in this browser only"; }
}

const dayDoc = d => S.docs["day-" + d] ||= {date:d, sessions:[], answers:[]};
const dayDocs = () => Object.entries(S.docs).filter(([k]) => k.startsWith("day-")).map(([,v]) => v).sort((a,b) => a.date < b.date ? -1 : 1);
const examDocs = () => Object.entries(S.docs).filter(([k]) => k.startsWith("exam-")).map(([,v]) => v).sort((a,b) => a.start < b.start ? 1 : -1);

/* ================= session log ================= */
function startSession(){
  const now = new Date().toISOString();
  S.session = {id: Date.now().toString(36), start: now, end: now, n: 0, modes: []};
  const d = today(); dayDoc(d).sessions.push(S.session); persist("day-" + d);
  const p = S.docs.profile ||= {createdAt: now, sessions: 0};
  p.lastSeen = now; p.sessions = (p.sessions || 0) + 1; persist("profile");
}
function touchSession(mode){
  const d = today(), day = dayDoc(d);
  let s = day.sessions.find(x => x.id === S.session.id);
  if (!s){ s = {...S.session, n:0, modes:[]}; day.sessions.push(s); S.session = s; }   // crossed midnight
  s.end = new Date().toISOString(); s.n++; if (!s.modes.includes(mode)) s.modes.push(mode);
}

/* ================= spaced repetition (SM-2 style) ================= */
// grade q: 5 easy, 4 correct, 3 correct but guessed, 1 wrong
function schedule(prev, q){
  const c = prev ? {...prev} : {reps:0, ease:2.5, ivl:0, lapses:0, seen:0, right:0};
  c.seen++; c.last = today(); c.lastOk = q >= 3;
  if (q >= 3) c.right++;
  if (q < 3){ c.reps = 0; c.ivl = 1; c.lapses++; }
  else { c.reps++; c.ivl = c.reps === 1 ? 1 : c.reps === 2 ? 3 : Math.round(c.ivl * c.ease); if (q === 3) c.ivl = Math.max(1, Math.round(c.ivl * .6)); }
  c.ease = Math.max(1.3, +(c.ease + ({1:-0.2, 3:-0.15, 4:0, 5:0.15}[q] ?? 0)).toFixed(2));   // Anki-style ease steps
  c.ivl = Math.min(c.ivl, 120);
  c.due = addDays(today(), c.ivl);
  return c;
}
function record(qid, sel, ok, ms, mode, guessed){
  const cards = srs(), before = cards[qid] ? {...cards[qid]} : null;
  cards[qid] = schedule(before, ok ? (guessed ? 3 : 4) : 1);
  const d = today(), day = dayDoc(d);
  if (day.answers.length < 3000) day.answers.push({q:qid, sel, ok, ms: Math.round(ms), t: Date.now(), mode, ...(guessed ? {guessed:true} : {})});
  touchSession(mode);
  persist("srs"); persist("day-" + d);
  return before;
}
function regradeGuessed(qid, before){
  srs()[qid] = schedule(before, 3);
  const day = dayDoc(today()); const a = [...day.answers].reverse().find(x => x.q === qid); if (a) a.guessed = true;
  persist("srs"); persist("day-" + today());
}

/* ================= analytics ================= */
function clusterStats(code){
  const qs = POOL().filter(q => q.cluster === code), cards = srs(), t = today();
  let seen = 0, mastered = 0, due = 0, right = 0, tries = 0;
  for (const q of qs){ const c = cards[q.id]; if (!c) continue; seen++; tries += c.seen; right += c.right; if (c.reps >= 2 && c.lastOk) mastered++; if (c.due <= t) due++; }
  return {total: qs.length, seen, mastered, due, acc: tries ? right / tries : null, tries};
}
function weakness(code){ const s = clusterStats(code); const cover = 1 - s.seen / (s.total || 1); return s.tries >= 3 ? (1 - s.acc) * 1.6 + cover * .6 : .55 + cover * .6; }
function weakest(n = 3){ return CLUSTERS.map(c => ({c, w: weakness(c.code), s: clusterStats(c.code)})).filter(x => x.s.tries >= 3).sort((a,b) => b.w - a.w).slice(0, n); }
function streak(){
  const days = new Set(dayDocs().filter(d => d.answers.length).map(d => d.date));
  let n = 0, d = today(); if (!days.has(d)) d = addDays(d, -1);
  while (days.has(d)){ n++; d = addDays(d, -1); }
  return n;
}

/* ================= Today: build the personalised set ================= */
function buildToday(){
  const cards = srs(), t = today(), goal = S.prefs.goal;
  const due = POOL().filter(q => cards[q.id] && cards[q.id].due <= t)
    .sort((a,b) => (cards[a.id].due < cards[b.id].due ? -1 : cards[a.id].due > cards[b.id].due ? 1 : cards[a.id].ease - cards[b.id].ease));
  const dueIds = due.slice(0, Math.max(goal, 40)).map(q => q.id);
  const newN = Math.max(0, goal - dueIds.length);
  const r = rng(t + (S.uid || "local") + Object.keys(cards).length);
  const pools = {}; for (const q of POOL()) if (!cards[q.id]) (pools[q.cluster] ||= []).push(q);
  const lvl = {easy:0, medium:1, hard:2};
  for (const k in pools) pools[k].sort((a,b) => lvl[a.level] - lvl[b.level] || (r() - .5));
  const newIds = [];
  while (newIds.length < newN){
    const live = Object.keys(pools).filter(k => pools[k].length);
    if (!live.length) break;
    const ws = live.map(k => .3 + weakness(k)); let x = r() * ws.reduce((a,b) => a+b, 0), k = live[0];
    for (let i = 0; i < live.length; i++){ x -= ws[i]; if (x <= 0){ k = live[i]; break; } }
    newIds.push(pools[k].shift().id);
  }
  // interleave reviews and new so topics mix (helps recall)
  const out = []; const a = dueIds.slice(), b = newIds.slice();
  while (a.length || b.length){ if (a.length) out.push(a.shift()); if (a.length) out.push(a.shift()); if (b.length) out.push(b.shift()); }
  return {ids: out, due: dueIds.length, totalDue: due.length, fresh: newIds.length};
}

/* ================= practice runner (Today + Topics) ================= */
function startRun(mode, title, ids){
  S.run = {mode, title, ids: ids.slice(), i: 0, pending: [], shown: !(mode === "today" && S.prefs.recall), answered: null, t0: performance.now(), right: 0, done: 0, relearn: new Set()};
  render();
}
function runAnswer(sel){
  const R = S.run, q = BYID[R.ids[R.i]];
  const s = normSel(q, sel), ok = isRight(q, s);
  const before = record(q.id, s, ok, performance.now() - R.t0, R.mode);
  R.answered = {sel: s, ok, before, guessed:false}; R.done++; if (ok) R.right++;
  if (!ok && !R.relearn.has(q.id)){ R.relearn.add(q.id); R.ids.splice(Math.min(R.i + 4, R.ids.length), 0, q.id); }   // see it again later this session
  render();
}
function runNext(){
  const R = S.run; R.i++; R.pending = []; R.answered = null; R.shown = !(R.mode === "today" && S.prefs.recall); R.t0 = performance.now();
  render(); window.scrollTo({top:0});
}

function questionHTML(q, o){
  // o: {sel, answered, shown, multiCheck, counter, progress, actions}
  const multi = !q.parts && q.pick > 1, a = o.answered;
  const opts = q.parts ? partsHTML(q, o.sel, a) : q.options.map((t, k) => {
    let cls = "opt", mark = "";
    if (a){ if (q.answer.includes(k)){ cls += " right"; mark = "✓"; } else if (a.sel.includes(k)){ cls += " wrong"; mark = "✗"; } }
    else if (o.sel.includes(k)) cls += " sel";
    return `<button class="${cls}" type="button" data-opt="${k}" ${a ? "disabled" : ""} aria-pressed="${o.sel.includes(k)}"><span class="L">${L(k)}.</span><span class="T">${inline(t)}</span><span class="mark">${mark}</span></button>`;
  }).join("");
  const cl = CL[q.cluster];
  const imgs = (q.images || []).length ? `<div class="qimgs">${q.images.map((src, i) => { const u = IMAGES[src] || src;
    return `<a href="${esc(u)}" target="_blank" rel="noopener" title="Open full size"><img src="${esc(u)}" alt="Exhibit ${i + 1} for ${esc(q.id)}" loading="lazy"></a>`; }).join("")}</div>` : "";
  return `
    ${o.progress != null ? `<div class="progress-line"><i style="width:${o.progress}%"></i></div>` : ""}
    <div class="qmeta"><span class="qid">${esc(o.counter || q.id)}</span><span class="chip">${esc(cl ? cl.name : q.topic)}</span><span class="chip lv-${esc(q.level)}">${esc(q.level)}</span>${q.src === "exam" ? `<span class="chip src">Exam bank #${q.ref}</span>` : ""}${o.extraMeta || ""}</div>
    <div class="q">${md(q.question)}</div>
    ${imgs}
    ${multi ? `<div class="pick">Select ${q.pick}.</div>` : q.parts ? `<div class="pick">Choose an answer for each of the ${q.parts.length} part${q.parts.length === 1 ? "" : "s"}.</div>` : ""}
    ${o.shown || a ? `<div class="${q.parts ? "parts" : "opts"}">${opts}</div>` :
      `<div class="recall"><p><b>Active recall:</b> answer it in your head first, then reveal the options and pick.</p><button class="btn primary" type="button" data-act="reveal">Show options</button></div>`}
    ${o.actions || ""}
    ${a && o.feedback !== false ? feedbackHTML(q, a) : ""}`;
}
function partsHTML(q, sel, a){
  return q.parts.map((p, i) => {
    const s = sel[i] ?? null;
    if (a){ const ok = s === p.answer;
      return `<div class="part ${ok ? "right" : "wrong"}"><span class="pl">${i + 1}. ${inline(p.label)}</span>
        <span class="pr">${ok ? `✓ <b>${inline(p.options[p.answer])}</b>` : `✗ ${s == null ? "Not answered" : `You chose <b>${inline(p.options[s])}</b>`} · correct: <b>${inline(p.options[p.answer])}</b>`}</span></div>`; }
    return `<label class="part"><span class="pl">${i + 1}. ${inline(p.label)}</span>
      <select data-part="${i}"><option value="">Choose…</option>${p.options.map((t, k) => `<option value="${k}" ${s === k ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label>`;
  }).join("");
}
function partsFeedbackHTML(q, a){
  const ok = isRight(q, a.sel);
  const head = ok
    ? `<div class="panel result ok"><h3>✓ Correct</h3><p>All ${q.parts.length} parts right${a.before === undefined ? "" : a.guessed ? " · marked as a guess, it'll come back sooner" : ` · <button class="linkbtn" type="button" data-act="guessed">I guessed</button>`}</p></div>`
    : `<div class="panel result bad"><h3>✗ Not quite</h3><p>${q.parts.filter((p, i) => a.sel[i] === p.answer).length} of ${q.parts.length} parts right. All parts must be right to score.</p></div>`;
  const why = q.parts.map((p, i) => { const y = a.sel[i] === p.answer;
    return `<li><span class="s ${y ? "y" : "n"}">${y ? "✓" : "✗"}</span><div><span class="o">${i + 1}. ${inline(p.label)} → ${inline(p.options[p.answer])}</span><br>${inline(p.why)}</div></li>`; }).join("");
  return `${head}${extrasHTML(q, `<div class="panel"><h3>Why each answer is right</h3><ul class="why">${why}</ul></div>`)}`;
}
function extrasHTML(q, whyPanel){
  return `
    <div class="panel tipbox"><h3>${q.src === "exam" ? "Exam trick" : "Tip"}</h3><p>${inline(q.tip)}</p></div>
    ${whyPanel}
    <div class="panel"><h3>The concept</h3><p>${inline(q.concept)}</p></div>
    ${q.note || (q.confidence && q.confidence !== "high") ? `<div class="panel notebox"><h3>Note${q.confidence && q.confidence !== "high" ? ` · answer confidence: ${esc(q.confidence)}` : ""}</h3><p>${inline(q.note || "This answer is debated; check the Microsoft Learn article.")}</p></div>` : ""}
    <div class="refs"><span>Microsoft Learn: <b>${esc(q.learn)}</b></span>${q.lesson ? `<span>Thầy Nhân's class: <b>${esc(q.lesson)}</b></span>` : ""}</div>`;
}
function feedbackHTML(q, a){
  if (q.parts) return partsFeedbackHTML(q, a);
  const right = q.answer.map(L).join(", ");
  const head = a.ok
    ? `<div class="panel result ok"><h3>✓ Correct</h3><p>Answer: <b>${right}</b>${a.before === undefined ? "" : a.guessed ? " · marked as a guess, it'll come back sooner" : ` · <button class="linkbtn" type="button" data-act="guessed">I guessed</button>`}</p></div>`
    : `<div class="panel result bad"><h3>✗ Not quite</h3><p>Correct answer: <b>${right}</b>${a.sel.length ? ` · You chose: <b>${a.sel.map(L).join(", ")}</b>` : " · Not answered"}</p></div>`;
  const why = q.why.map((w, k) => { const y = q.answer.includes(k);
    return `<li><span class="s ${y ? "y" : "n"}">${y ? "✓" : "✗"}</span><div><span class="o">${L(k)}. ${inline(q.options[k])}</span><br>${inline(w.replace(/^(Correct|Wrong)\s*[—-]\s*/, ""))}</div></li>`; }).join("");
  return `${head}${extrasHTML(q, `<div class="panel"><h3>Why each option is right or wrong</h3><ul class="why">${why}</ul></div>`)}`;
}

function renderRun(){
  const R = S.run;
  if (R.i >= R.ids.length) return renderRunDone();
  const q = BYID[R.ids[R.i]], a = R.answered;
  const relearn = R.relearn.has(q.id) && R.ids.indexOf(q.id) < R.i;
  const ready = q.parts ? q.parts.every((p, i) => R.pending[i] != null) : R.pending.length === q.pick;
  const checkBtn = !a && (q.pick > 1 || q.parts) && R.shown ? `<button class="btn primary" type="button" data-act="check" ${ready ? "" : "disabled"}>Check answer</button>` : "";
  return `<div class="col">
    <div class="row" style="justify-content:space-between"><div><div class="eyebrow">${esc(R.title)}</div></div><button class="btn ghost" type="button" data-act="endrun">End session</button></div>
    ${questionHTML(q, {sel: R.pending, answered: a, shown: R.shown, counter: `${R.i + 1} / ${R.ids.length}`, progress: pct(R.i, R.ids.length),
      extraMeta: relearn ? `<span class="chip due">Again: you missed this earlier</span>` : (srs()[q.id] && !a ? `<span class="chip">Review</span>` : (!a ? `<span class="chip">New</span>` : "")),
      actions: `<div class="nav">${checkBtn}<span class="sp"></span>${a ? `<button class="btn primary" type="button" data-act="next">Next →</button>` : ""}</div>`})}
    <div class="keys"><kbd>A</kbd>–<kbd>F</kbd> choose · <kbd>Enter</kbd> check / next${R.shown ? "" : " · <kbd>Space</kbd> show options"}</div>
  </div>`;
}
function renderRunDone(){
  const R = S.run, b = buildToday();
  return `<div class="col">
    <div class="eyebrow">${esc(R.title)} · finished</div>
    <div class="lead">${R.done ? `${R.right} of ${R.done} correct (${pct(R.right, R.done)}%)` : "Nothing answered"}</div>
    <p class="sub">Every answer has been logged and scheduled. Questions you missed come back tomorrow; ones you got right come back after a growing gap (1 → 3 → 8 days…).</p>
    <div class="panel"><h3>What's next</h3><p>${b.totalDue ? `${b.totalDue} question${b.totalDue === 1 ? "" : "s"} still due today.` : "Nothing else is due today."} ${forecastLine()}</p></div>
    <div class="row"><button class="btn primary" type="button" data-go="today">Back to Today</button><button class="btn" type="button" data-go="topics">Pick a topic</button><button class="btn" type="button" data-go="progress">See progress</button></div>
  </div>`;
}
function forecastLine(){
  const cards = Object.values(srs()), t = today();
  const tom = cards.filter(c => c.due === addDays(t, 1)).length, wk = cards.filter(c => c.due > t && c.due <= addDays(t, 7)).length;
  return cards.length ? `Tomorrow: ${tom} due · next 7 days: ${wk}.` : "";
}

function startTopic(code){
  const cards = srs(), lvl = {easy:0, medium:1, hard:2};
  const qs = POOL().filter(q => q.cluster === code);
  const rank = q => { const c = cards[q.id]; return !c ? 0 : !c.lastOk ? 1 : c.due <= today() ? 2 : 3; };
  const ids = qs.sort((a,b) => rank(a) - rank(b) || lvl[a.level] - lvl[b.level]).map(q => q.id);
  S.view = "topics"; startRun("topic", `${code} · ${CL[code].name}`, ids);
}

/* ---------- exam ---------- */
const EXAMKEY = () => `pl300coach:${S.ns}:active-exam`;
function saveActiveExam(){ try { localStorage.setItem(EXAMKEY(), JSON.stringify(S.exam)); } catch(e){} }
function loadActiveExam(){ try { const e = JSON.parse(localStorage.getItem(EXAMKEY())); if (e && !e.done) S.exam = e; } catch(e){} }
function clearActiveExam(){ try { localStorage.removeItem(EXAMKEY()); } catch(e){} }
function newExam(size, minutes){
  const used = {}; for (const e of examDocs()) for (const id of e.qids || []) used[id] = (used[id] || 0) + 1;
  const counts = size === 50 ? [14,13,14,9] : [7,7,7,4];
  let ids = [];
  DOMAINS.forEach((d, i) => {
    const pool = shuffle(POOL().filter(q => q.domain === d.key)).sort((a,b) => (used[a.id] || 0) - (used[b.id] || 0));
    ids = ids.concat(pool.slice(0, counts[i]).map(q => q.id));
  });
  const now = Date.now();
  S.exam = {id: now.toString(36), size, minutes, qids: shuffle(ids), ans:{}, flags:{}, i:0, start: new Date(now).toISOString(), deadline: now + minutes * 60000, pending: [], confirm:false};
  saveActiveExam(); render();
}
