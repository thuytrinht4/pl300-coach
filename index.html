<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"></head><body>
<title>PL-300 Study Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a study desk — slim top bar with four modes (Today · Topics · Exam · Progress); one calm reading column. */
:root{
  --paper:#f5f6f3; --card:#ffffff; --ink:#1c2430; --muted:#5d6675; --line:#dde2df; --soft:#eef1ee;
  --accent:#0f7c74; --accent-ink:#ffffff; --accent-soft:#e0f0ed;
  --ok:#1f8a4c; --ok-soft:#e5f5eb; --ok-line:#83c9a0;
  --bad:#c23b3b; --bad-soft:#fbeaea; --bad-line:#e9a3a3;
  --tip:#9a6a0b; --tip-soft:#fdf5e3; --flag:#d98a00;
  --heat0:#e7ebe8; --heat1:#b9dcd5; --heat2:#77bdb2; --heat3:#2f9488; --heat4:#0f6b64;
  --font-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10151c; --card:#171e28; --ink:#e6eaf0; --muted:#9aa4b3; --line:#29323f; --soft:#1d2531;
  --accent:#3fb8ac; --accent-ink:#0b1a18; --accent-soft:#163a37;
  --ok:#4cc27e; --ok-soft:#143222; --ok-line:#2f7a50;
  --bad:#ef7676; --bad-soft:#3a1a1c; --bad-line:#8a3c3e;
  --tip:#e3b14f; --tip-soft:#33290f; --flag:#f0a92b;
  --heat0:#1f2833; --heat1:#1d4a45; --heat2:#23716a; --heat3:#2f9e92; --heat4:#58d0c3; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10151c; --card:#171e28; --ink:#e6eaf0; --muted:#9aa4b3; --line:#29323f; --soft:#1d2531;
  --accent:#3fb8ac; --accent-ink:#0b1a18; --accent-soft:#163a37;
  --ok:#4cc27e; --ok-soft:#143222; --ok-line:#2f7a50;
  --bad:#ef7676; --bad-soft:#3a1a1c; --bad-line:#8a3c3e;
  --tip:#e3b14f; --tip-soft:#33290f; --flag:#f0a92b;
  --heat0:#1f2833; --heat1:#1d4a45; --heat2:#23716a; --heat3:#2f9e92; --heat4:#58d0c3; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:14px;min-height:56px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.01em;font-size:16px;white-space:nowrap}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto}
.tab{background:none;border:0;border-radius:8px;padding:8px 12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.who img{width:26px;height:26px;border-radius:50%}
.sync{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.sync.cloud{color:var(--ok);border-color:var(--ok-line)}

/* ---------- page ---------- */
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:24px 56px}
.col{max-width:780px;margin:0 auto;display:grid;gap:18px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lead{font-size:26px;font-weight:800;letter-spacing:-.015em}
.sub{color:var(--muted);margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 16px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted);background:var(--card)}
.chip b{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stats.six{grid-template-columns:repeat(3,1fr)}
@media (max-width:520px){.stats.six{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .l{font-size:12.5px;color:var(--muted)}
.meter{height:7px;border-radius:4px;background:var(--soft);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.m-ok{background:var(--ok)} .m-seen{background:var(--heat2)} .m-bad{background:var(--bad)}
.note{max-width:1080px;margin:12px auto 0;padding-inline:16px}
.note div{background:var(--tip-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13.5px}

/* ---------- topics ---------- */
.dom-h{display:flex;align-items:baseline;gap:10px;margin:8px 0 10px}
.dom-h h2{font-size:17px}
.dom-h span{font-size:12.5px;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:22px}
.tcard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start}
.tcard:hover{border-color:var(--accent)}
.tcard .code{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.tcard .name{font-weight:700;font-size:15px;line-height:1.3}
.tcard .cov{font-size:12.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard .foot{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.due{color:var(--flag);font-weight:700}

/* ---------- question ---------- */
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.qmeta .qid{font-family:var(--font-mono);font-weight:600;color:var(--ink)}
.lv-easy{color:var(--ok)} .lv-medium{color:var(--tip)} .lv-hard{color:var(--bad)}
.progress-line{height:4px;border-radius:2px;background:var(--soft);overflow:hidden}
.progress-line i{display:block;height:100%;background:var(--accent)}
.q{font-size:17px;line-height:1.6}
.q p{margin:0 0 .7em}
pre{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;font-family:var(--font-mono);font-size:13px;line-height:1.5;margin:.4em 0 .8em}
code{font-family:var(--font-mono);font-size:.9em;background:var(--accent-soft);padding:1px 5px;border-radius:4px}
pre code{background:none;padding:0}
.pick{font-size:13px;font-weight:700;color:var(--accent)}
.recall{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;display:grid;gap:10px;justify-items:center}
.recall p{margin:0;color:var(--muted);max-width:52ch}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr) 22px;align-items:start;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .L{font-weight:700;color:var(--muted)}
.opt .T{min-width:0}
.opt .T pre{margin:.3em 0 0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.opt .mark{font-weight:700;text-align:right}
.opt.right .mark{color:var(--ok)} .opt.wrong .mark{color:var(--bad)}
.opt[disabled]{cursor:default}
.result.ok{background:var(--ok-soft);border-color:var(--ok-line)} .result.ok h3{color:var(--ok)}
.result.bad{background:var(--bad-soft);border-color:var(--bad-line)} .result.bad h3{color:var(--bad)}
.panel h3{font-size:14px;margin-bottom:6px;letter-spacing:.01em}
.panel p{margin:0}
.tipbox{background:var(--tip-soft);border-color:transparent} .tipbox h3{color:var(--tip)} .tipbox p{font-style:italic}
.why{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.why li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:14px}
.why .s{font-weight:700} .why .y{color:var(--ok)} .why .n{color:var(--bad)}
.why .o{font-weight:600}
.refs{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.refs b{color:var(--ink);font-weight:600}
.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nav .sp{flex:1}
.keys{font-size:12px;color:var(--muted)}
.keys kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--card)}
.small{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.qimgs{display:grid;gap:10px}
.qimgs a{display:block}
.qimgs img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.parts{display:grid;gap:10px}
.col>*,.parts>*{min-width:0}
.part select{width:100%;min-width:0;text-overflow:ellipsis}
.part{display:grid;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
.part .pl{font-weight:600;font-size:14.5px}
.part select{font:inherit;font-size:14.5px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.part.right{border-color:var(--ok-line);background:var(--ok-soft)}
.part.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.part .pr{font-size:14px} .part .pr b{font-weight:600}
.notebox{background:var(--soft)}
.chip.src{border-color:var(--accent);color:var(--accent)}

/* ---------- exam ---------- */
.examgrid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:start}
.examside{position:sticky;top:calc(72px + env(safe-area-inset-top,0px));display:grid;gap:12px}
.timer{font-family:var(--font-mono);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer.low{color:var(--bad)}
.qgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.qc{position:relative;aspect-ratio:1;border:0;border-radius:5px;background:var(--soft);color:var(--muted);font-family:var(--font-mono);font-size:10.5px;padding:0}
.qc.done{background:var(--heat2);color:#fff}
.qc.cur{outline:2px solid var(--accent);outline-offset:1px}
.qc.flag::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--flag)}
.flagbtn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.flagbtn[aria-pressed="true"]{border-color:var(--flag);color:var(--flag)}
.score{font-size:44px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.confirm{background:var(--bad-soft);border:1px solid var(--bad-line);border-radius:10px;padding:12px 14px;display:grid;gap:10px;font-size:14px}

/* ---------- progress ---------- */
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;width:max-content}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--heat0);display:block}
.heat i.h1{background:var(--heat1)} .heat i.h2{background:var(--heat2)} .heat i.h3{background:var(--heat3)} .heat i.h4{background:var(--heat4)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

@media (max-width:820px){
  .examgrid{grid-template-columns:1fr}
  .examside{position:static;order:-1}
  .two{grid-template-columns:1fr}
  .who .nm{display:none}
  .keys{display:none}
  .lead{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){.opt,.tcard{transition:border-color .12s,background .12s}}
</style>

<header class="bar">
  <div class="bar-in">
    <div class="brand">PL-300 <span>Coach</span></div>
    <nav class="tabs" id="tabs">
      <button class="tab" type="button" data-go="today">Today</button>
      <button class="tab" type="button" data-go="topics">Topics</button>
      <button class="tab" type="button" data-go="exam">Exam</button>
      <button class="tab" type="button" data-go="progress">Progress</button>
    </nav>
    <div class="who"><img id="avatar" alt="" hidden><span class="nm" id="who-name"></span><span class="sync" id="sync">This browser</span></div>
  </div>
</header>
<div class="note" id="note" hidden><div id="note-text"></div></div>
<div class="wrap"><div id="view"></div></div>

<script>
const BANK = [{"id": "PD1-001", "domain": "Prepare the data", "topic": "Identify and connect to a data source", "level": "easy", "question": "You connect Power BI Desktop to the Excel workbook Sales.xlsx. The sheet 'Data' contains a formatted Excel table named tblSales, plus a few notes typed in cells below it. In the Navigator you see both 'Data' and 'tblSales'.\nWhich item should you select to get only the clean sales rows?", "options": ["Both items, then append them", "The sheet 'Data'", "Neither — Excel tables can't be read; save the file as CSV first", "The table 'tblSales'"], "answer": [3], "pick": 1, "tip": "Table icon = only the table range; sheet icon = everything typed on the sheet.", "why": ["Wrong — appending would duplicate the sales rows (they are in both items) and still add the notes.", "Wrong — a sheet brings in every used cell, including the notes and any blank rows, so you would need extra cleaning.", "Wrong — the Excel connector reads both sheets and tables directly; no conversion is needed.", "Correct — an Excel table has a defined range and header row, so Power BI gets exactly the sales rows and nothing else."], "concept": "In the Navigator, Excel files show sheets and named tables as separate items. A table has a fixed range with one header row, so it is the most reliable choice. A sheet returns every used cell on that sheet, which can include titles, notes or several tables side by side.", "learn": "Get data from Excel workbook files (Power Query Excel connector)", "lesson": "Lesson 6 ⏱ 00:29:33", "cluster": "P1"}, {"id": "PD1-002", "domain": "Prepare the data", "topic": "Identify and connect to a data source", "level": "medium", "question": "Each month the Fabrikam finance system drops a new CSV file (same columns every time) into a network folder. You want a single Sales table that automatically includes new monthly files when the model is refreshed, without editing the query.\nWhat should you do?", "options": ["Use Get data > Web and paste the folder path", "Use Get data > Text/CSV for each file and append the queries", "Use Get data > Folder, then Combine & Transform the files", "Open each CSV in Excel, copy all rows into one workbook, and connect to that workbook"], "answer": [2], "pick": 1, "tip": "Same-shaped files arriving over time? Folder + Combine.", "why": ["Wrong — the Web connector is for URLs, not network folder paths.", "Wrong — a separate query per file means every new month needs a new query and a new append step.", "Correct — the Folder connector lists every file in the folder and Combine applies the same steps to all of them, so new files are picked up on refresh.", "Wrong — manual copy-paste must be repeated every month and is error-prone; it isn't automated."], "concept": "The Folder connector returns a list of files plus their metadata (name, date modified, etc.). Choosing Combine creates a sample-file transformation that is applied to every file and the results are appended. Any file added later with the same structure is included automatically at the next refresh.", "learn": "Combine files overview (Power Query)", "lesson": "Lesson 8 ⏱ 01:27:16", "cluster": "P1"}, {"id": "PD1-003", "domain": "Prepare the data", "topic": "Identify and connect to a data source", "level": "easy", "question": "Your DBA tells you: 'The sales data is in the SalesDW database on the server SQLPROD01, in the table FactSales.'\nIn Power BI Desktop you choose Get data > SQL Server database. What do you type in the Server box?", "options": ["SalesDW", "FactSales", "C:\\SQLPROD01\\SalesDW.mdf", "SQLPROD01"], "answer": [3], "pick": 1, "tip": "Server > database > table > rows — the Server box takes the top level.", "why": ["Wrong — SalesDW is the database name; it goes in the optional Database box.", "Wrong — tables are chosen later in the Navigator, not typed in the Server box.", "Wrong — you connect to SQL Server through its server name, not by pointing at a database file on disk.", "Correct — the Server box takes the server (or server\\instance) name."], "concept": "A relational database is organized as server → databases → tables → rows. The SQL Server connector asks for the server name (required) and optionally a database name; you then pick tables or views in the Navigator.", "learn": "Power Query SQL Server connector", "lesson": "Lesson 5 ⏱ 00:08:53", "cluster": "P1"}, {"id": "PD1-004", "domain": "Prepare the data", "topic": "Identify and connect to a data source", "level": "medium", "question": "Mai's Excel file is stored in her company OneDrive for Business and synced to her laptop. She connected Power BI Desktop using the local path C:\\Users\\Mai\\OneDrive - Contoso\\Budget.xlsx and published the report. Scheduled refresh in the Power BI service fails, and IT says they don't want a gateway for this.\nWhat should she do?", "options": ["Move the file to her Desktop folder and reconnect", "Install a personal gateway on her laptop anyway", "Increase the refresh frequency to 8 times per day", "Reconnect using the file's online (https) OneDrive/SharePoint URL instead of the local path"], "answer": [3], "pick": 1, "tip": "Cloud file? Connect with its https link, not the C:\\ path.", "why": ["Wrong — the Desktop folder is still a local path, so the service still can't reach it without a gateway.", "Wrong — a gateway would work but IT doesn't want one, and it's unnecessary for a file that already lives in the cloud.", "Wrong — refresh frequency doesn't matter if the service can't reach the file at all.", "Correct — with the online URL the service reads the file directly from OneDrive/SharePoint, so no gateway is needed."], "concept": "The Power BI service runs in the cloud and cannot see paths on your computer. A local path, even inside a synced OneDrive folder, is treated as an on-premises file and needs a gateway. Connecting with the file's web URL lets the service refresh it directly as a cloud source.", "learn": "Use OneDrive for work or school links in Power BI Desktop", "lesson": "Lesson 4 ⏱ 02:15:21", "cluster": "P1"}, {"id": "PD1-005", "domain": "Prepare the data", "topic": "Identify and connect to a data source", "level": "medium", "question": "Adventure Works stores monthly Excel reports in a SharePoint Online document library at:\nhttps://adventureworks.sharepoint.com/sites/Finance/Shared Documents/Reports\nYou use Get data > SharePoint folder. What should you enter in the Site URL box?", "options": ["\\\\adventureworks\\Finance\\Reports", "https://adventureworks.sharepoint.com/sites/Finance/Shared Documents/Reports", "https://adventureworks.sharepoint.com/sites/Finance", "https://adventureworks-admin.sharepoint.com"], "answer": [2], "pick": 1, "tip": "SharePoint folder wants the SITE address — then filter down to your folder.", "why": ["Wrong — a UNC network path is for the Folder connector on a file share, not SharePoint Online.", "Wrong — pasting the full library/folder path into the Site URL box is a common mistake and fails; the connector needs the site address only.", "Correct — the SharePoint folder connector expects the site URL; you then filter the file list (e.g. by Folder Path) to the Reports folder.", "Wrong — the admin centre URL is for tenant administration, not for reading documents."], "concept": "The SharePoint folder connector lists every file on a SharePoint site. You give it the site URL, then filter the resulting file list by folder path or file name. After that you can combine the files just like the Folder connector.", "learn": "SharePoint folder connector (Power Query)", "lesson": "", "cluster": "P1"}, {"id": "PD1-006", "domain": "Prepare the data", "topic": "Identify and connect to a data source", "level": "easy", "question": "Contoso's field-service team uses a Power Apps app. The app stores its records (work orders, technicians, visits) in Microsoft Dataverse tables. You need these tables in a Power BI report.\nWhich connector should you use?", "options": ["Excel workbook", "Dataverse", "Web", "SharePoint Online list"], "answer": [1], "pick": 1, "tip": "Power Apps data lives in Dataverse — use the Dataverse connector.", "why": ["Wrong — exporting to Excel would create a manual copy that goes stale; connect to the source instead.", "Correct — the Dataverse connector reads Dataverse tables directly, using your organizational account and the environment.", "Wrong — the Web connector is for URLs/web pages and APIs, not the recommended way to read Dataverse tables.", "Wrong — the data isn't stored in SharePoint lists, it is in Dataverse tables."], "concept": "Microsoft Dataverse is the data platform behind Power Apps and Dynamics 365. It stores data in tables with defined columns and relationships. Power BI has a dedicated Dataverse connector that lets you pick an environment and its tables.", "learn": "Create a Power BI report using data from Dataverse", "lesson": "Lesson 4 ⏱ 00:55:01", "cluster": "P1"}, {"id": "PD1-007", "domain": "Prepare the data", "topic": "Identify and connect to a data source", "level": "easy", "question": "A public government web page shows a table of monthly fuel prices in plain HTML. You want that table in Power BI and refreshed as the page is updated.\nWhich connector should you use?", "options": ["Blank query with typed-in values", "Web", "SQL Server database", "Folder"], "answer": [1], "pick": 1, "tip": "A table on a web page → Web connector, then pick the HTML table in the Navigator.", "why": ["Wrong — typing the values in would be a static copy that never refreshes.", "Correct — the Web connector reads the page and the Navigator lists HTML tables it found, which you can load and refresh.", "Wrong — there is no database here; the data is on a web page.", "Wrong — the Folder connector reads files in a file-system folder, not web pages."], "concept": "The Web connector downloads a URL. For HTML pages, Power Query detects tables on the page and shows them in the Navigator (and can suggest tables). For APIs it can read JSON or XML responses.", "learn": "Get webpage data by providing examples / Web connector (Power Query)", "lesson": "", "cluster": "P1"}, {"id": "PD1-008", "domain": "Prepare the data", "topic": "Shared semantic models and live connection", "level": "medium", "question": "You open Power BI Desktop and connect live to a published semantic model 'Sales Model' owned by the BI team (Get data > Power BI semantic models). You haven't changed the connection type.\nWhich action CAN you do in this report?", "options": ["Edit the model's Power Query steps", "Create a report-level measure such as [Sales per Customer]", "Add a calculated column to the Customer table of the model", "Change the Sales table's storage mode to Import"], "answer": [1], "pick": 1, "tip": "Live connection = borrow the model: you can add report measures and visuals, not change the model.", "why": ["Wrong — with a live connection, Transform data / Power Query is not available; the model's queries belong to the owner.", "Correct — report-level measures are allowed; they are saved in your report, not in the shared model.", "Wrong — calculated columns change the model itself, which you cannot do over a live connection.", "Wrong — storage modes are part of the model's design and can't be changed from a live-connected report."], "concept": "A live connection reuses a semantic model that is already published. Your report only stores visuals and optional report-level measures; the tables, relationships and queries stay owned by the model's author. This keeps one 'single source of truth' for many reports.", "learn": "Connect to semantic models in the Power BI service from Power BI Desktop", "lesson": "Lesson 5 ⏱ 00:26:35", "cluster": "P1"}, {"id": "PD1-009", "domain": "Prepare the data", "topic": "Storage modes", "level": "easy", "question": "Northwind's warehouse dashboard must show stock levels from an on-premises SQL Server database. Stock changes every few minutes and managers need the latest values each time they open or interact with the report. The data must not be copied into Power BI.\nWhich storage mode should you use for the Stock table?", "options": ["DirectQuery", "Import", "Dual", "Import with a daily scheduled refresh"], "answer": [0], "pick": 1, "tip": "Need near-real-time and no copy? DirectQuery asks the source every time.", "why": ["Correct — DirectQuery sends a query to SQL Server when visuals load, so values are current and nothing is stored in the model.", "Wrong — Import copies the data and is only as fresh as the last refresh.", "Wrong — Dual can act like Import, so it still keeps a copy of the data; it's meant for shared dimension tables in composite models.", "Wrong — a daily refresh would show data up to a day old, and it still copies the data."], "concept": "Import copies data into the model: fastest queries and full feature support, but data is a snapshot. DirectQuery leaves data in the source and queries it at view time: fresher data, but every visual depends on source speed and network latency.", "learn": "Use DirectQuery in Power BI Desktop", "lesson": "Lesson 5 ⏱ 00:10:51", "cluster": "P1"}, {"id": "PD1-010", "domain": "Prepare the data", "topic": "Storage modes", "level": "hard", "question": "Your model has a huge FactSales table in DirectQuery mode (real-time) and a small FactBudget table in Import mode. Both relate to a DimDate table. Visuals that combine Sales and Date are slow, and you want DimDate to work efficiently with both fact tables.\nWhich storage mode should you set for DimDate?", "options": ["DirectQuery", "Live connection", "Dual", "Import"], "answer": [2], "pick": 1, "tip": "Dimension shared by Import and DirectQuery facts → Dual.", "why": ["Wrong — DirectQuery DimDate would make the Import FactBudget visuals query the source unnecessarily and slow them down.", "Wrong — live connection is a connection type to a whole published semantic model, not a per-table storage mode.", "Correct — Dual lets DimDate behave as Import with FactBudget and as DirectQuery with FactSales, so each query uses the most efficient path.", "Wrong — an Import DimDate works fast with FactBudget, but queries joining it to the DirectQuery FactSales can't be pushed fully to the source."], "concept": "In a composite model, each table has a storage mode: Import, DirectQuery or Dual. A Dual table keeps a cached copy but can also be queried directly at the source. Power BI picks whichever fits the query, which is ideal for dimension tables related to both Import and DirectQuery fact tables.", "learn": "Manage storage mode in Power BI Desktop", "lesson": "Lesson 5 ⏱ 00:16:44", "cluster": "P1"}, {"id": "PD1-011", "domain": "Prepare the data", "topic": "Storage modes", "level": "hard", "question": "You are live-connected in Power BI Desktop to the company's published 'Sales Model'. You also need a small Excel file of regional sales targets in the same report so you can compare sales vs target. The tenant allows DirectQuery connections to Power BI semantic models and you have Build permission.\nWhat should you do?", "options": ["Change the live connection to Import mode for all tables, then add the Excel file", "Use Transform data to add the Excel file to the live connection's Power Query", "Select 'Make changes to this model' to switch to a DirectQuery connection to the semantic model, then add the Excel file in Import mode", "It's not possible; ask the owner to add the targets to the shared model"], "answer": [2], "pick": 1, "tip": "Live + your own data = composite model ('Make changes to this model').", "why": ["Wrong — you can't import the tables of a published Power BI semantic model by switching modes.", "Wrong — Power Query isn't available for a live-connected model, so you can't add a source there.", "Correct — this converts the report into a composite model: the shared model is used via DirectQuery and your Excel table is imported alongside it.", "Wrong — asking the owner is an option, but it is not required; composite models let you extend the model yourself."], "concept": "A composite model mixes sources or storage modes in one model. When live-connected to a Power BI semantic model, 'Make changes to this model' turns the connection into DirectQuery for Power BI semantic models, so you can add local tables, relationships and measures without changing the original model.", "learn": "Use composite models in Power BI Desktop", "lesson": "", "cluster": "P1"}, {"id": "PD1-012", "domain": "Prepare the data", "topic": "Query folding", "level": "medium", "question": "A table connected to SQL Server in DirectQuery mode works fine until you add a Power Query step that can't be translated to SQL. Power BI then shows: 'This step results in a query that is not supported in DirectQuery mode.'\nWhy does this happen?", "options": ["DirectQuery only supports text columns", "The SQL Server credentials expired", "DirectQuery tables can't have any Power Query steps", "In DirectQuery, all Power Query steps must fold into a single native query sent to the source"], "answer": [3], "pick": 1, "tip": "DirectQuery = every step must fold to SQL.", "why": ["Wrong — DirectQuery supports numbers, dates and other types.", "Wrong — an expired credential gives an authentication error, not this message.", "Wrong — simple steps like filtering, removing columns or renaming are allowed because they fold.", "Correct — DirectQuery runs your steps at the source every time, so a step that can't become SQL is not allowed (you could switch to Import or move the logic into a SQL view)."], "concept": "In Import mode, steps that don't fold can still run inside the Power Query engine during refresh. In DirectQuery mode there is no refresh copy: each visual sends a query to the source, so every transformation must be expressible in the source's language.", "learn": "Query folding guidance in Power BI Desktop", "lesson": "Lesson 7 ⏱ 01:45:58", "cluster": "P3"}, {"id": "PD1-013", "domain": "Prepare the data", "topic": "Parameters", "level": "medium", "question": "You build a report against the development SQL server DEV-SQL. After testing it must point to PROD-SQL. You don't want to edit M code each time you switch.\nWhat should you do?", "options": ["Create a Power Query parameter for the server name and use it in the Source step", "Duplicate every query and change the server name in the copies", "Rename the queries to include 'PROD'", "Create a DAX measure that returns the server name"], "answer": [0], "pick": 1, "tip": "Values that change between environments → Power Query parameter.", "why": ["Correct — the Source step reads the server from the parameter, so switching is a single value change (also editable in the service's semantic model settings or by deployment rules).", "Wrong — duplicated queries double the maintenance and the risk of mistakes.", "Wrong — renaming a query doesn't change its data source.", "Wrong — DAX runs after data is loaded; it can't change where Power Query gets data from."], "concept": "Power Query parameters are named values (text, number, date, etc.) you create with Manage Parameters and reference in your queries. They're commonly used for server/database names, file paths or date ranges so the same report can switch environments easily.", "learn": "Power Query parameters", "lesson": "Lesson 5 ⏱ 01:34:47", "cluster": "P1"}, {"id": "PD1-014", "domain": "Prepare the data", "topic": "Parameters", "level": "medium", "question": "You created a text parameter named ServerName in Manage Parameters. Which Source step correctly uses the parameter?", "options": ["Source = Sql.Database([ServerName], \"SalesDB\")", "Source = Sql.Database(ServerName, \"SalesDB\")", "Source = Sql.Database(\"ServerName\", \"SalesDB\")", "Source = Sql.Database(@ServerName, \"SalesDB\")"], "answer": [1], "pick": 1, "tip": "Parameters are referenced by name, without quotes.", "why": ["Wrong — square brackets access a field of the current row/record, which doesn't exist in a Source step.", "Correct — a parameter is a query, so you reference it by its name like any other value.", "Wrong — in quotes it becomes the literal text \"ServerName\", so Power Query would look for a server literally called ServerName.", "Wrong — @ is SQL variable syntax (and an M recursion marker), not how parameters are referenced."], "concept": "In M, each step and each query (including parameters) is a named value. You use it by writing its name. Text in double quotes is a literal string. In the Advanced Editor, hard-coded values like file paths are good candidates to replace with parameters.", "learn": "Power Query parameters / Power Query M formula language", "lesson": "Lesson 6 ⏱ 02:00:13", "cluster": "P1"}, {"id": "PD1-015", "domain": "Prepare the data", "topic": "Data source settings", "level": "easy", "question": "The IT team moved the file Products.xlsx from \\\\fs01\\data to \\\\fs02\\data. Every query that used the file now fails.\nWhat is the quickest correct fix in Power BI Desktop?", "options": ["Clear the data source permissions", "Open Data source settings, select the old path and use Change Source to point to the new path", "Delete the queries and rebuild all the cleaning steps", "Change the privacy level of the file to Public"], "answer": [1], "pick": 1, "tip": "Same data, new location → Data source settings > Change Source.", "why": ["Wrong — clearing permissions removes saved credentials; it doesn't change the path.", "Correct — Change Source updates the path for every query that uses it and keeps all transformation steps.", "Wrong — rebuilding throws away all your applied steps for no reason.", "Wrong — privacy levels control how sources may be combined, not where the file lives."], "concept": "Data source settings (Transform data > Data source settings, or File > Options and settings) lists every source in the file. From there you can change the source location, edit credentials, or set privacy levels without touching individual steps.", "learn": "Data source settings in Power BI Desktop", "lesson": "", "cluster": "P1"}, {"id": "PD1-016", "domain": "Prepare the data", "topic": "Data source settings", "level": "medium", "question": "A published report's semantic model refreshes from an Azure SQL Database. The database account's password was changed, and now scheduled refresh fails with a credentials error.\nWhere should you fix this?", "options": ["In the Power BI service: give the users the Contributor role", "In the report: add a new page and refresh it", "In the Power BI service: semantic model settings > Data source credentials > Edit credentials", "In Power BI Desktop: File > Options > Privacy, set 'Always ignore privacy levels'"], "answer": [2], "pick": 1, "tip": "Refresh in the cloud uses credentials stored in the cloud — update them there.", "why": ["Wrong — workspace roles control what users can do, not how the model logs in to the database.", "Wrong — adding pages has nothing to do with stored credentials.", "Correct — scheduled refresh uses the credentials saved in the semantic model's settings in the service, so you update them there.", "Wrong — privacy levels are about combining sources, not authentication; and Desktop settings don't change the service."], "concept": "Credentials are stored separately in Desktop (Data source settings) and in the Power BI service (semantic model settings, or the gateway connection for on-premises sources). When a password changes, update it where the refresh runs.", "learn": "Configure scheduled refresh / Data refresh in Power BI", "lesson": "", "cluster": "P1"}, {"id": "PD1-017", "domain": "Prepare the data", "topic": "Privacy levels", "level": "medium", "question": "A query combines an HR SQL database (salary data) with a public web page of national holidays. You must set privacy levels correctly.\nWhich TWO statements about Power Query privacy levels are true? (Select TWO.)", "options": ["Setting a source to Public encrypts the data in transit", "Privacy levels decide which report viewers can see which rows", "Privacy levels only apply after the report is published", "Organizational sources can be combined with other Organizational sources but are isolated from Public sources", "Private is the most restrictive level and suits sensitive data like salaries"], "answer": [3, 4], "pick": 2, "tip": "Privacy levels = what can mix with what during a query (Private > Organizational > Public).", "why": ["Wrong — Public just means anyone could see it; it doesn't add encryption.", "Wrong — controlling which rows viewers see is row-level security (RLS), not privacy levels.", "Wrong — privacy levels take effect in Power Query in Desktop too, whenever sources are combined.", "Correct — Organizational data is visible to other Organizational sources (a trusted group) but not sent to Public sources.", "Correct — Private data is isolated from all other sources, which protects sensitive data like salaries."], "concept": "Privacy levels (Private, Organizational, Public) stop Power Query from accidentally sending data from one source to another, for example by folding a filter value from a private database into a web request. Sources at incompatible levels are processed in isolation, which can also cause Formula.Firewall errors when queries are structured badly.", "learn": "Power BI Desktop privacy levels", "lesson": "", "cluster": "P1"}, {"id": "PD1-018", "domain": "Prepare the data", "topic": "Gateways", "level": "easy", "question": "Your report imports data from a SQL Server database running on a server in Contoso's own data center. After publishing, you want daily scheduled refresh in the Power BI service.\nWhat do you need?", "options": ["To switch the table to DirectQuery", "Nothing — the service can reach any database", "A Premium licence for every viewer", "An on-premises data gateway"], "answer": [3], "pick": 1, "tip": "On-premises source + cloud refresh = gateway.", "why": ["Wrong — DirectQuery to an on-premises source also needs a gateway.", "Wrong — the cloud service can't reach servers inside a private company network on its own.", "Wrong — licences affect sharing and limits; they don't create network access to an on-premises server.", "Correct — the on-premises data gateway securely connects the Power BI service to data sources inside your network."], "concept": "The on-premises data gateway is a bridge installed on a machine in your network. The Power BI service sends refresh or DirectQuery requests to it, and it talks to the local source. Cloud sources (Azure SQL Database, SharePoint Online, OneDrive) usually don't need one.", "learn": "What is an on-premises data gateway?", "lesson": "Lesson 4 ⏱ 01:59:32", "cluster": "P1"}, {"id": "PD1-019", "domain": "Prepare the data", "topic": "Gateways", "level": "medium", "question": "You publish several reports. Which TWO data sources can be refreshed in the Power BI service WITHOUT a gateway? (Select TWO.)", "options": ["A CSV file on your laptop's C:\\ drive", "A SQL Server database on a server in the office", "An Access database on a network file share", "An Azure SQL Database", "An Excel file stored in SharePoint Online and connected by its URL"], "answer": [3, 4], "pick": 2, "tip": "Already in the cloud? No gateway. Inside your network or PC? Gateway.", "why": ["Wrong — a file on your laptop is a local file and needs a gateway (and your laptop to be on).", "Wrong — an on-premises SQL Server needs a gateway.", "Wrong — a network file share is on-premises, so it needs a gateway.", "Correct — Azure SQL Database is a cloud source the service can reach directly.", "Correct — SharePoint Online is a cloud service, so no gateway is needed when you connect via its URL."], "concept": "The Power BI service lives in the cloud. It can reach other cloud services directly, but any source inside your private network or on a local PC needs the on-premises data gateway as a bridge.", "learn": "What is an on-premises data gateway?", "lesson": "Lesson 4 ⏱ 01:59:32", "cluster": "P1"}, {"id": "PD1-020", "domain": "Prepare the data", "topic": "Gateways", "level": "hard", "question": "Fabrikam is choosing between the on-premises data gateway (standard mode) and personal mode.\nWhich TWO requirements mean they need STANDARD mode? (Select TWO.)", "options": ["Several report authors need to share the same gateway and its connections", "A report reads only from SharePoint Online", "One analyst wants scheduled Import refresh of an Excel file on her own PC, used only by her", "A DirectQuery report on an on-premises SQL Server must be used by many people"], "answer": [0, 3], "pick": 2, "tip": "Personal = one person, Import only. Standard = shared, supports DirectQuery.", "why": ["Correct — a personal gateway serves only the person who installed it; standard mode can be shared and managed centrally.", "Wrong — SharePoint Online is a cloud source, so no gateway is needed at all.", "Wrong — this single-user Import scenario is exactly what personal mode is for.", "Correct — personal mode doesn't support DirectQuery; standard mode does."], "concept": "The standard gateway is for organizations: multiple users, central admin, and support for scheduled refresh and DirectQuery/live connections. Personal mode is for one user, works only with Power BI, and supports scheduled refresh of Import data only.", "learn": "On-premises data gateway (personal mode)", "lesson": "Lesson 8 ⏱ 00:23:02", "cluster": "P1"}, {"id": "PD1-021", "domain": "Prepare the data", "topic": "Query folding", "level": "easy", "question": "Your query connects to a SQL Server table, filters to the year 2025 and removes 10 unused columns. What does 'query folding' mean here?", "options": ["Power Query translates the steps into a SQL query so the database does the filtering and column removal", "Power Query groups queries into folders in the Queries pane", "Power Query compresses the data after loading", "Power Query hides steps you don't need in Applied Steps"], "answer": [0], "pick": 1, "tip": "Folding = pushing your steps back to the source as its own language (SQL).", "why": ["Correct — folded steps run at the source, so less data travels to Power BI and refresh is faster.", "Wrong — grouping queries into folders is just organization, not folding.", "Wrong — compression happens in the VertiPaq engine after loading; it isn't folding.", "Wrong — folding doesn't hide steps; they still appear in Applied Steps."], "concept": "Query folding is Power Query's ability to turn your steps into one native query (e.g. SQL) that the source runs. Filters, column removal, renames and joins usually fold on relational sources. When a step can't fold, it and later steps run in the Power Query engine instead.", "learn": "Overview of query evaluation and query folding in Power Query", "lesson": "Lesson 7 ⏱ 01:45:58", "cluster": "P3"}, {"id": "PD1-022", "domain": "Prepare the data", "topic": "Query folding", "level": "hard", "question": "You connect to a large SQL Server table in Import mode and need three steps: (A) Add an Index column, (B) Remove unused columns, (C) Filter rows to the current year. Adding an Index column does not fold to SQL Server.\nWhich order keeps the most work folded to the database?", "options": ["C → A → B", "A → B → C", "B → C → A", "A → C → B"], "answer": [2], "pick": 1, "tip": "Foldable steps first, non-foldable steps last.", "why": ["Wrong — the filter folds, but the column removal after the Index step runs locally, so unused columns are still downloaded.", "Wrong — starting with the non-foldable Index step means the whole table is downloaded before filtering.", "Correct — removing columns and filtering fold to SQL, so only the needed rows and columns are downloaded; the Index is added last locally.", "Wrong — the Index step first breaks folding, so the filter and column removal run locally on the full table."], "concept": "Once a step can't fold, the steps after it are usually processed by Power Query instead of the source. Put filters and column removal early so the source does the heavy lifting, and put non-foldable steps (like an Index column) as late as possible.", "learn": "Query folding guidance in Power BI Desktop", "lesson": "Lesson 7 ⏱ 01:45:58", "cluster": "P3"}, {"id": "PD1-023", "domain": "Prepare the data", "topic": "Data profiling", "level": "medium", "question": "In Power Query, Column quality shows 0% Empty for the Email column of a 50,000-row Customers table. After loading, you find hundreds of blank emails.\nWhat is the most likely reason?", "options": ["Column quality ignores text columns", "Profiling was based on the top 1,000 rows only, by default", "Blank emails are counted as Errors, not Empty", "Column quality only works in DirectQuery mode"], "answer": [1], "pick": 1, "tip": "Profiling starts on the top 1,000 rows — switch to 'entire data set' to see everything.", "why": ["Wrong — column quality works on all data types.", "Correct — by default profiling uses the first 1,000 rows; change it in the status bar to 'Column profiling based on entire data set'.", "Wrong — blank/null values count as Empty, not Error.", "Wrong — data profiling works in Power Query regardless of storage mode."], "concept": "Power Query's data profiling tools (Column quality, Column distribution, Column profile) analyze the top 1,000 rows by default to stay fast. You can switch to the entire data set from the status bar at the bottom of the editor; it's slower but accurate.", "learn": "Using the data profiling tools (Power Query)", "lesson": "Lesson 6 ⏱ 00:38:31", "cluster": "P2"}, {"id": "PD1-024", "domain": "Prepare the data", "topic": "Data profiling", "level": "easy", "question": "You want Power Query to show, under each column header, the percentage of Valid, Error and Empty values.\nWhich option on the View tab should you turn on?", "options": ["Column quality", "Monospaced", "Column profile", "Column distribution"], "answer": [0], "pick": 1, "tip": "Quality = Valid / Error / Empty percentages.", "why": ["Correct — Column quality shows the % Valid, % Error and % Empty bar under each header.", "Wrong — Monospaced only changes the font of the preview.", "Wrong — Column profile shows detailed statistics for one selected column in a pane at the bottom.", "Wrong — Column distribution shows distinct and unique counts with a small histogram."], "concept": "The three data profiling views each answer a different question: Column quality — how clean is it (valid/error/empty)? Column distribution — how many different values? Column profile — detailed statistics and value distribution for one column.", "learn": "Using the data profiling tools (Power Query)", "lesson": "Lesson 6 ⏱ 00:38:31", "cluster": "P2"}, {"id": "PD1-025", "domain": "Prepare the data", "topic": "Data profiling", "level": "medium", "question": "You profile the entire data set of a Customers table with 5,000 rows. Column distribution for CustomerID shows 4,980 distinct and 4,960 unique.\nWhat does this tell you?", "options": ["There are 4,980 empty CustomerID values", "20 rows have an Error in CustomerID", "Every CustomerID appears exactly once", "20 CustomerID values appear more than once, so the column isn't yet a unique key"], "answer": [3], "pick": 1, "tip": "Distinct = how many different values; Unique = how many appear only once. Key column: distinct = unique = row count.", "why": ["Wrong — distinct is the number of different values, not empty values.", "Wrong — distinct/unique counts say nothing about errors; that is Column quality.", "Wrong — for that, distinct and unique would both equal the row count (5,000).", "Correct — 4,980 different values exist but only 4,960 of them appear once, so 20 values are repeated; fix duplicates before using it as the one-side of a relationship."], "concept": "Distinct counts how many different values exist. Unique counts values that occur exactly once. For an ID column of a dimension table, both should equal the number of rows; any gap means duplicates that will break a one-to-many relationship.", "learn": "Using the data profiling tools (Power Query)", "lesson": "Lesson 6 ⏱ 00:41:06", "cluster": "P2"}, {"id": "PD1-026", "domain": "Prepare the data", "topic": "Data profiling", "level": "easy", "question": "You want to see the minimum, maximum, average and standard deviation of the UnitPrice column, plus a chart of how often each value appears.\nWhich Power Query feature shows this?", "options": ["Column distribution", "Query dependencies", "Column profile", "Column quality"], "answer": [2], "pick": 1, "tip": "Profile = full statistics for the one column you select.", "why": ["Wrong — Column distribution shows distinct/unique counts, not min/max/average.", "Wrong — Query dependencies shows how queries depend on each other and on sources.", "Correct — Column profile shows column statistics (count, min, max, average, standard deviation, etc.) and a value distribution chart.", "Wrong — Column quality only shows Valid/Error/Empty percentages."], "concept": "Column profile opens a pane for the selected column with column statistics and a value distribution. For numeric columns it includes min, max, average and standard deviation; for text it includes things like empty strings and distinct counts.", "learn": "Using the data profiling tools (Power Query)", "lesson": "", "cluster": "P2"}, {"id": "PD1-027", "domain": "Prepare the data", "topic": "Resolve errors", "level": "medium", "question": "In a Finance query, the Discount column has errors in 40 rows because of bad source values. The finance manager says every invoice row must stay in the report so totals reconcile with the ledger.\nWhat should you do with the Discount column?", "options": ["Filter the table to keep only rows without errors", "Remove Errors", "Replace Errors with 0 (or null, as agreed with finance)", "Remove the Discount column"], "answer": [2], "pick": 1, "tip": "Remove Errors deletes whole rows; Replace Errors keeps the row.", "why": ["Wrong — filtering out rows has the same problem as Remove Errors: rows are lost.", "Wrong — Remove Errors deletes the entire row, so invoice amounts would disappear and totals wouldn't reconcile.", "Correct — Replace Errors swaps only the bad cell value and keeps every invoice row.", "Wrong — the column is needed; dropping it loses valid discount data too."], "concept": "Cell-level errors in Power Query can come from type conversions or bad formulas. Remove Errors removes the whole row that has an error in the selected column. Replace Errors keeps the row and puts a value of your choice in the bad cell. Choose based on whether rows can be lost.", "learn": "Dealing with errors in Power Query", "lesson": "Lesson 6 ⏱ 00:22:40", "cluster": "P2"}, {"id": "PD1-028", "domain": "Prepare the data", "topic": "Data types and locale", "level": "medium", "question": "A UK supplier sends a CSV with OrderDate values like 03/04/2025 meaning 3 April 2025 (day/month/year). Your Power BI Desktop uses English (United States) regional settings, so the dates are read as 4 March or cause errors.\nWhich M step converts the column correctly?", "options": ["Table.TransformColumnTypes(Source, {{\"OrderDate\", type text}}, \"en-US\")", "Table.RenameColumns(Source, {{\"OrderDate\", \"OrderDate (UK)\"}})", "Table.TransformColumnTypes(Source, {{\"OrderDate\", type date}}, \"en-GB\")", "Table.TransformColumnTypes(Source, {{\"OrderDate\", type date}})"], "answer": [2], "pick": 1, "tip": "Data from another country? Change Type > Using Locale.", "why": ["Wrong — converting to text keeps them as strings, so you can't use them as dates.", "Wrong — renaming a column doesn't change how its values are interpreted.", "Correct — the culture argument \"en-GB\" tells Power Query the text is day/month/year (the UI version is Change Type > Using Locale).", "Wrong — without a culture, Power Query uses your US settings and reads 03/04 as March 4."], "concept": "Text-to-date and text-to-number conversions depend on locale (culture): date order and decimal separators differ by country. Change Type > Using Locale (or the culture argument of Table.TransformColumnTypes) tells Power Query how the source text is formatted.", "learn": "Locale or region settings for data types (Power Query)", "lesson": "Lesson 8 ⏱ 01:05:36", "cluster": "P2"}, {"id": "PD1-029", "domain": "Prepare the data", "topic": "Data types and locale", "level": "medium", "question": "Your Payments table has an Amount column with money values. You want to avoid tiny floating-point rounding differences in totals, and 4 decimal places are more than enough.\nWhich data type should you use?", "options": ["Decimal number", "Text", "Fixed decimal number", "Whole number"], "answer": [2], "pick": 1, "tip": "Money → Fixed decimal number (the 'currency' type).", "why": ["Wrong — Decimal number is a floating-point type, which can cause tiny rounding differences.", "Wrong — text values can't be summed.", "Correct — Fixed decimal number stores exactly 4 digits after the decimal point, avoiding floating-point rounding errors.", "Wrong — Whole number would drop the cents."], "concept": "Power BI number types: Decimal number (floating point, most flexible), Fixed decimal number (4 fixed decimal places, also called Currency) and Whole number (integers). Choosing the right type affects accuracy, model size and which calculations are possible.", "learn": "Data types in Power BI Desktop", "lesson": "Lesson 6 ⏱ 01:51:04", "cluster": "P2"}, {"id": "PD1-030", "domain": "Prepare the data", "topic": "Data types and locale", "level": "easy", "question": "A Customers table has a PostalCode column with values like 02134 and 07030. After Power Query auto-detects types, these show as 2134 and 7030.\nWhat should you do?", "options": ["Keep the Whole number type and add a leading zero with a DAX measure", "Replace the values 2134 and 7030 by hand", "Change the data type to Decimal number", "Change the column's data type to Text (and remove the auto 'Changed Type' conversion for it)"], "answer": [3], "pick": 1, "tip": "Codes you never add up (postal codes, phone numbers) are Text.", "why": ["Wrong — measures don't change stored column values, and postal codes aren't numbers to calculate with.", "Wrong — manual fixes don't scale and are lost on the next refresh.", "Wrong — any number type drops leading zeros.", "Correct — as Text the leading zeros are kept exactly as in the source."], "concept": "Data types decide how values are stored and what you can do with them. Identifiers like postal codes, phone numbers or product codes may look numeric, but they are labels: keep them as Text so leading zeros and formatting are preserved.", "learn": "Data types in Power BI Desktop", "lesson": "Lesson 6 ⏱ 01:51:04", "cluster": "P2"}, {"id": "PD1-031", "domain": "Prepare the data", "topic": "Clean text", "level": "medium", "question": "In the City column you find values that look identical but don't group together: 'Seattle', 'Seattle ' (trailing space) and 'Seattle' followed by a hidden line-feed character copied from another system.\nWhich TWO Power Query transformations fix this? (Select TWO.)", "options": ["Format > Trim", "Format > UPPERCASE", "Format > Clean", "Split Column by delimiter", "Format > Add Suffix"], "answer": [0, 2], "pick": 2, "tip": "Trim = spaces at the ends; Clean = invisible non-printable characters.", "why": ["Correct — Trim removes leading and trailing whitespace like the trailing space.", "Wrong — changing case doesn't remove spaces or hidden characters.", "Correct — Clean removes non-printable characters such as line feeds.", "Wrong — splitting creates new columns and doesn't clean the city names.", "Wrong — Add Suffix adds text; it doesn't remove anything."], "concept": "Text that looks the same can differ by invisible characters. Trim removes whitespace at the start and end (not in the middle). Clean removes non-printable control characters. Both are under Transform (or Add Column) > Format.", "learn": "Text functions / Format text in Power Query", "lesson": "Lesson 6 ⏱ 01:45:10", "cluster": "P2"}, {"id": "PD1-032", "domain": "Prepare the data", "topic": "Resolve inconsistencies", "level": "medium", "question": "A Region column contains 'north', 'North' and 'NORTH'. When you use Group By in Power Query, you get three separate rows for the north region.\nWhat should you do before grouping?", "options": ["Use Remove Duplicates on the Region column", "Use Format > Capitalize Each Word so all values become 'North'", "Nothing — Power Query ignores case", "Change the column type to Whole number"], "answer": [1], "pick": 1, "tip": "Power Query compares text case-sensitively — standardize case first.", "why": ["Wrong — Remove Duplicates is also case-sensitive and would remove rows, not merge spellings.", "Correct — standardizing the case makes all variants identical, so they group into one 'North'.", "Wrong — Power Query text comparisons are case-sensitive, which is why there are three groups.", "Wrong — region names are text; a number type would just create errors."], "concept": "Inconsistent spellings and capitalization split what should be one category into many. Power Query treats 'North' and 'north' as different values. Standardize with Format (lowercase, UPPERCASE, Capitalize Each Word), Trim, or Replace Values before grouping or merging.", "learn": "Text functions / Format text in Power Query", "lesson": "Lesson 7 ⏱ 02:02:56", "cluster": "P2"}, {"id": "PD1-033", "domain": "Prepare the data", "topic": "Replace values", "level": "hard", "question": "A Size column (text) contains only the codes S, M, L and XL. You used Replace Values to change 'L' to 'Large'. The L rows became 'Large', but the XL rows became 'XLarge'.\nHow should you redo the Replace Values step so only cells that are exactly 'L' change?", "options": ["Replace 'L' with 'Large' and check 'Match entire cell contents' under Advanced options", "Use Replace Errors instead of Replace Values", "Change the column type to Whole number before replacing", "Apply Trim before Replace Values"], "answer": [0], "pick": 1, "tip": "Replace Values on text matches parts of text unless you tick 'Match entire cell contents'.", "why": ["Correct — with 'Match entire cell contents', only cells whose whole value is 'L' are replaced, so 'XL' is left alone.", "Wrong — Replace Errors only works on error values, not normal text.", "Wrong — size codes aren't numbers, so converting would just create errors.", "Wrong — Trim removes outer spaces; it doesn't stop 'L' matching inside 'XL'."], "concept": "For text columns, Replace Values replaces every occurrence of the search text anywhere inside a cell by default. Under Advanced options, 'Match entire cell contents' limits it to cells whose full value equals the search text. Always check a few rows after replacing.", "learn": "Replace values and errors (Power Query)", "lesson": "", "cluster": "P2"}, {"id": "PD1-034", "domain": "Prepare the data", "topic": "Resolve errors", "level": "hard", "question": "The Quantity column in a CSV contains numbers and the text 'N/A'. After the auto 'Changed Type' step converts Quantity to Whole number, Column quality shows 3% Error. You must keep all rows and be able to sum Quantity.\nWhich TWO approaches meet the goal? (Select TWO.)", "options": ["After the Changed Type step, use Remove Errors on Quantity", "Use Remove Blank Rows", "After the Changed Type step, Replace Errors in Quantity with null", "Change the Quantity type to Text", "Before the Changed Type step, Replace Values 'N/A' with null"], "answer": [2, 4], "pick": 2, "tip": "Fix the bad text before the type change, or replace the errors after — never drop rows you need.", "why": ["Wrong — Remove Errors deletes those rows entirely, breaking the 'keep all rows' requirement.", "Wrong — the rows aren't blank; they contain 'N/A', so nothing changes.", "Correct — replacing the conversion errors with null keeps every row and leaves a numeric column you can sum.", "Wrong — text can't be summed, so this doesn't meet the goal.", "Correct — once 'N/A' becomes null, the type conversion succeeds and the rows stay."], "concept": "Type conversion errors happen when a value can't be converted (e.g. 'N/A' to a number). You can fix the cause (replace bad text with null before converting) or handle the symptom (replace errors after converting). Null in a numeric column is ignored by SUM, unlike text.", "learn": "Dealing with errors in Power Query", "lesson": "Lesson 6 ⏱ 02:26:58", "cluster": "P2"}, {"id": "PD1-035", "domain": "Prepare the data", "topic": "Column properties", "level": "medium", "question": "In the model, the Year column (whole number) shows as a Sum (e.g. 'Sum of Year = 40,500') when dragged into a table, and the Country column isn't plotted correctly on a map.\nWhich TWO column property changes fix this? (Select TWO.)", "options": ["Set the Year column's Summarization to 'Don't summarize'", "Hide the Year column in report view", "Set the Country column's Sort by column to Year", "Set the Country column's Data category to 'Country/Region'", "Change the Year column's data type to Decimal number"], "answer": [0, 3], "pick": 2, "tip": "Summarization stops silly sums; Data category tells maps what a value is.", "why": ["Correct — 'Don't summarize' makes Year behave like a category instead of being added up.", "Wrong — hiding Year would stop people using it at all.", "Wrong — Sort by column changes ordering, not mapping; and sorting a country by year makes no sense.", "Correct — the Country/Region data category helps map visuals geocode the values correctly.", "Wrong — a decimal type would still be summed by default."], "concept": "Column properties in the model view control how a column behaves in reports: data type, format, default summarization, data category (geography, URL, image URL, etc.), sort by column, and visibility. Numeric fields that aren't measures (Year, ID) should usually be set to 'Don't summarize'.", "learn": "Data categorization in Power BI Desktop / Model view properties", "lesson": "", "cluster": "P2"}, {"id": "PD2-001", "domain": "Prepare the data", "topic": "Column data types", "level": "easy", "question": "Contoso's customer table has a PostalCode column with values such as 02134 and 00501. After Power Query detects the type as Whole Number, the values show as 2134 and 501.\nWhich data type should you set for PostalCode?", "options": ["Fixed Decimal Number", "Whole Number with a custom format", "Decimal Number", "Text"], "answer": [3], "pick": 1, "tip": "If you never do math with it (postal codes, phone numbers, IDs with leading zeros), make it Text.", "why": ["Wrong — Fixed Decimal Number is a numeric type for currency; it also removes leading zeros.", "Wrong — Power Query stores the value as a number; once the zero is gone, formatting in the report can't reliably bring back the original code.", "Wrong — Decimal Number is still a number, so leading zeros are dropped just like Whole Number.", "Correct — Text keeps every character exactly as it is, including leading zeros."], "concept": "Every column in Power Query has one data type (Text, Whole Number, Decimal Number, Fixed Decimal Number, Date, Date/Time, True/False, etc.). Choose the type by how the value is USED: codes that are labels, not quantities, belong in Text. Text \"1\" and number 1 are different values, which matters when you join tables.", "learn": "Data types in Power Query", "lesson": "Lesson 6 ⏱ 01:51:04", "cluster": "P2"}, {"id": "PD2-002", "domain": "Prepare the data", "topic": "Column data types", "level": "medium", "question": "Fabrikam stores invoice amounts with up to 2 decimal places. When finance sums millions of rows, totals sometimes differ from the accounting system by tiny fractions caused by floating-point rounding.\nWhich data type should you use for the Amount column?", "options": ["Decimal Number", "Fixed Decimal Number", "Text", "Whole Number"], "answer": [1], "pick": 1, "tip": "Money? Think 'Fixed Decimal' — the currency type with exactly 4 decimal places.", "why": ["Wrong — Decimal Number is a floating-point type, which is what can cause the tiny rounding differences.", "Correct — Fixed Decimal Number (the currency type) stores a fixed 4 digits after the decimal point, avoiding floating-point rounding errors.", "Wrong — Text cannot be summed in measures.", "Wrong — Whole Number would cut off the cents."], "concept": "Power BI has two non-integer number types. Decimal Number is a floating-point number (very large range, but tiny rounding errors are possible). Fixed Decimal Number always keeps 4 decimal places and is designed for currency, where exact totals matter.", "learn": "Data types in Power BI Desktop", "lesson": "", "cluster": "P2"}, {"id": "PD2-003", "domain": "Prepare the data", "topic": "Create and transform columns", "level": "easy", "question": "You want a new column SizeBand on the Orders query: \"Large\" when Amount >= 1000, \"Medium\" when Amount >= 100, otherwise \"Small\". You want to build it with a dialog box, without writing M code.\nWhich Power Query feature should you use?", "options": ["Transform > Replace Values", "Add Column > Index Column", "Add Column > Conditional Column", "Home > Group By"], "answer": [2], "pick": 1, "tip": "IF-this-THEN-that rules in a dialog = Conditional Column.", "why": ["Wrong — Replace Values swaps one exact value for another; it can't test ranges like >= 1000.", "Wrong — Index Column only adds a running number (0, 1, 2…).", "Correct — Conditional Column lets you define If / Else If / Else rules in a dialog, and Power Query writes the M for you.", "Wrong — Group By summarizes rows; it doesn't label each row."], "concept": "Conditional Column is the no-code way to create a column from if/then/else logic. Each clause compares a column to a value and returns an output; the Else value covers everything else. Behind the scenes it generates an M 'if … then … else' expression.", "learn": "Add a conditional column", "lesson": "", "cluster": "P3"}, {"id": "PD2-004", "domain": "Prepare the data", "topic": "Create and transform columns", "level": "easy", "question": "An Email column contains values like anna.nguyen@contoso.com. You need a new column with only the domain (contoso.com), but you don't know which transform to use. You'd like to type the desired result for a couple of rows and let Power Query work out the logic.\nWhich feature should you use?", "options": ["Add Column > Column From Examples", "Transform > Format > Trim", "Add Column > Custom Column", "Transform > Data Type > Text"], "answer": [0], "pick": 1, "tip": "Show, don't code: Column From Examples learns from the answers you type.", "why": ["Correct — Column From Examples lets you type sample outputs; Power Query infers the transformation and shows the formula it used.", "Wrong — Trim removes leading and trailing spaces; it doesn't extract part of the text.", "Wrong — Custom Column works, but you'd have to write the M formula yourself, which the scenario wants to avoid.", "Wrong — Changing the data type doesn't extract anything."], "concept": "Column From Examples (Add Column tab) creates a new column from examples you type in. Power Query guesses the transformation (for example Text.AfterDelimiter) and you can check the generated formula before clicking OK. It's great for beginners learning which transform does what.", "learn": "Add a column from examples", "lesson": "Lesson 8 ⏱ 01:19:04", "cluster": "P3"}, {"id": "PD2-005", "domain": "Prepare the data", "topic": "Create and transform columns", "level": "easy", "question": "A Products query has a column SKU with values like TSH-RED-L and JKT-BLUE-M (type-color-size). You need three separate columns: Type, Color and Size.\nWhat should you do?", "options": ["Split Column > By Delimiter using \"-\" at each occurrence", "Transform > Merge Columns", "Transform > Pivot Column", "Transform > Extract > First Characters (3)"], "answer": [0], "pick": 1, "tip": "One column into many = Split. Many columns into one = Merge.", "why": ["Correct — Splitting by the \"-\" delimiter at each occurrence produces one new column per part.", "Wrong — Merge Columns combines several columns into one, the opposite of what you need.", "Wrong — Pivot Column turns row values into column headers; it doesn't break text apart.", "Wrong — First Characters (3) returns only the type and fails for colors of different lengths."], "concept": "Split Column breaks one text column into several columns, by delimiter (comma, dash, space…), by number of characters, or by position. Choose 'each occurrence' to split at every delimiter, or 'left-most'/'right-most' to split only once. Rename the new columns afterwards.", "learn": "Split columns by delimiter", "lesson": "Lesson 6 ⏱ 02:24:28", "cluster": "P3"}, {"id": "PD2-006", "domain": "Prepare the data", "topic": "Create and transform columns", "level": "easy", "question": "A Region column contains values like \"EMEA-France\" and \"APAC-Japan\". You only want the country part (France, Japan) and you don't need the prefix.\nWhich is the simplest transform?", "options": ["Transform > Extract > Length", "Transform > Extract > Text After Delimiter \"-\"", "Transform > Format > Uppercase", "Home > Remove Rows > Remove Duplicates"], "answer": [1], "pick": 1, "tip": "Need the part after a marker? Extract > Text After Delimiter.", "why": ["Wrong — Length returns the number of characters, not the text.", "Correct — Text After Delimiter keeps only the text after \"-\", replacing the column values in one step.", "Wrong — Uppercase changes letter case only.", "Wrong — Remove Duplicates removes rows; it doesn't change text inside a column."], "concept": "The Extract menu (Transform or Add Column tab) pulls part of a text value: First/Last Characters, Range, Text Before/After/Between Delimiters. On the Transform tab it replaces the column; on the Add Column tab it keeps the original and adds a new one.", "learn": "Extract text in Power Query", "lesson": "Lesson 6 ⏱ 01:37:40", "cluster": "P3"}, {"id": "PD2-007", "domain": "Prepare the data", "topic": "Create and transform columns", "level": "medium", "question": "In the Employees query you need a FullName column (\"Anna Nguyen\") built from FirstName and LastName. Other steps later in the query still use FirstName and LastName separately, so those columns must stay.\nWhat should you do?", "options": ["Select both columns, then Transform > Merge Columns with a Space separator", "Use Home > Append Queries on the Employees query", "Select both columns, then Add Column > Merge Columns with a Space separator", "Use Home > Merge Queries on the Employees query"], "answer": [2], "pick": 1, "tip": "Add Column = keep the originals; Transform = replace them.", "why": ["Wrong — Merge Columns on the Transform tab replaces FirstName and LastName with the merged column, breaking later steps.", "Wrong — Append Queries stacks rows from tables; it doesn't combine columns.", "Correct — The Add Column version creates the new merged column and leaves the original columns in place.", "Wrong — Merge Queries joins two tables by a key; it doesn't concatenate text columns."], "concept": "Many Power Query commands exist on both the Transform tab and the Add Column tab. Transform changes the selected columns in place; Add Column leaves them untouched and adds a new column. Don't confuse Merge COLUMNS (combine text) with Merge QUERIES (join tables).", "learn": "Merge columns", "lesson": "Lesson 6 ⏱ 01:47:31", "cluster": "P3"}, {"id": "PD2-008", "domain": "Prepare the data", "topic": "Group and aggregate", "level": "medium", "question": "The Orders query has columns OrderID, Region and Amount (one row per order). You need a table with one row per Region showing TotalAmount and NumberOfOrders, built in a single Power Query step.\nWhat should you do?", "options": ["Remove duplicates on Region, then add a Sum column", "Merge Orders with itself on Region", "Group By Region (Advanced) with two aggregations: Sum of Amount and Count Rows", "Pivot the Region column using Amount as values"], "answer": [2], "pick": 1, "tip": "Group By = one row per group + aggregations (Sum, Count Rows, Average…).", "why": ["Wrong — Removing duplicates keeps one random order per region and throws away the other amounts.", "Wrong — A self-merge creates nested tables of matching rows; it doesn't summarize.", "Correct — Group By with the Advanced option lets you add several aggregations, such as Sum of Amount and Count Rows, in one step.", "Wrong — Pivot would turn each region into a separate column, not one row per region."], "concept": "Group By collapses rows into one row per unique value of the grouping column(s) and calculates aggregations such as Sum, Average, Min, Max, Count Rows and Count Distinct Rows. The result keeps ONLY the grouping columns and the new aggregated columns — the detail columns disappear.", "learn": "Grouping or summarizing rows", "lesson": "Lesson 7 ⏱ 00:36:15", "cluster": "P3"}, {"id": "PD2-009", "domain": "Prepare the data", "topic": "Pivot, unpivot, transpose", "level": "medium", "question": "A budget sheet has columns Product, Jan, Feb, Mar… and a new month column is added every month. You need the data as three columns: Product, Month, Budget, and the query must keep working when new month columns appear.\nWhat should you do?", "options": ["Select Product, then Pivot Column", "Select Jan through the last month, then Unpivot Only Selected Columns", "Select Product, then Unpivot Other Columns", "Transpose the table"], "answer": [2], "pick": 1, "tip": "Select what stays (the IDs), then Unpivot OTHER Columns — new months flow in automatically.", "why": ["Wrong — Pivot does the opposite: it turns row values into columns.", "Wrong — Unpivot Only Selected Columns hard-codes the selected column names, so next month's new column would be left out.", "Correct — Unpivot Other Columns keeps Product and turns every other column, including future months, into Attribute/Value rows.", "Wrong — Transpose swaps rows and columns; it doesn't produce a Product/Month/Value layout."], "concept": "Unpivot turns a wide table (one column per month) into a long table (one row per product per month), which is the shape Power BI models and DAX work best with. 'Unpivot Other Columns' is the safest choice because it is based on the columns you keep, not on the month names. Rename Attribute and Value afterwards (Month, Budget).", "learn": "Unpivot columns", "lesson": "Lesson 6 ⏱ 02:18:50", "cluster": "P3"}, {"id": "PD2-010", "domain": "Prepare the data", "topic": "Pivot, unpivot, transpose", "level": "medium", "question": "A query has columns OrderID, Attribute and Value. Attribute contains the text values \"Ship Mode\", \"Region\" and \"Segment\" (three rows per order). You need one row per order with separate Ship Mode, Region and Segment columns.\nWhat should you do?", "options": ["Select Attribute, Pivot Column with Value as the values column and the Count aggregation", "Select Attribute, Pivot Column with Value as the values column and Don't Aggregate", "Transpose the table, then Use First Row as Headers", "Select OrderID, then Unpivot Other Columns"], "answer": [1], "pick": 1, "tip": "Pivot = rows into columns. Text values? Choose 'Don't Aggregate'.", "why": ["Wrong — Count would return numbers (how many rows), not the text values like \"Standard\" or \"West\".", "Correct — Pivoting Attribute creates one column per attribute; Don't Aggregate places the original text values in the cells.", "Wrong — Transpose would make each original row a column, producing one column per row, not per attribute.", "Wrong — The data is already unpivoted; unpivoting again won't create the columns you need."], "concept": "Pivot Column is the reverse of Unpivot: the distinct values of one column become new column headers, and another column fills the cells. If the values are numbers you can aggregate (Sum, Count…); if they are text and there's one value per cell, use 'Don't Aggregate' in the advanced options.", "learn": "Pivot columns", "lesson": "Lesson 7 ⏱ 00:31:15", "cluster": "P3"}, {"id": "PD2-011", "domain": "Prepare the data", "topic": "Pivot, unpivot, transpose", "level": "medium", "question": "An HR spreadsheet lists field names down column A (Name, Department, Hire Date) and each employee is in a separate column (B, C, D…). You need one row per employee with Name, Department and Hire Date as column headers.\nWhich steps should you use?", "options": ["Unpivot Other Columns", "Fill Down, then Remove Duplicates", "Pivot Column on column A", "Transpose, then Use First Row as Headers"], "answer": [3], "pick": 1, "tip": "Whole table on its side? Transpose flips rows and columns.", "why": ["Wrong — Unpivot produces Attribute/Value pairs, not one row per employee with proper headers.", "Wrong — Fill Down fills empty cells; it doesn't change the table's orientation.", "Wrong — Pivot uses values of a column as headers but would still need a separate value column per employee; it's not designed for a sideways table.", "Correct — Transpose turns each employee column into a row, and the first row (the old column A) then becomes the headers."], "concept": "Transpose swaps rows and columns: row 1 becomes column 1, and so on. Use it when a whole table has been entered 'sideways'. After transposing, header names often end up in the first row, so follow with Use First Row as Headers.", "learn": "Transpose a table", "lesson": "Lesson 6 ⏱ 02:23:39", "cluster": "P3"}, {"id": "PD2-012", "domain": "Prepare the data", "topic": "Clean and shape tables", "level": "easy", "question": "In a sales sheet, the Category column shows \"Bikes\" only on the first row of each group; the rows below it are null until the next category starts.\nWhich transform fills each null with the category above it?", "options": ["Replace Errors", "Remove Blank Rows", "Fill Up", "Fill Down"], "answer": [3], "pick": 1, "tip":
