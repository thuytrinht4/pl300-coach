 SUMMARIZE returns a table, and a measure must return a single value; this cannot be used as a colour.", "Wrong — This returns TRUE/FALSE, which is not a colour value.", "Correct — Field value expects a text value that is a valid colour, such as a hex code like \"#D64550\"; this measure returns a colour for each row."], "concept": "With Format style = Field value, Power BI reads the colour directly from a field or measure. A common pattern is a measure built with IF or SWITCH that returns hex colour codes based on business logic, which keeps colour rules reusable and more flexible than the Rules dialog.", "learn": "Apply conditional table formatting in Power BI", "lesson": "", "cluster": "V1"}, {"id": "VA1-012", "domain": "Visualize and analyze the data", "topic": "Formatting and themes", "level": "easy", "question": "Northwind's marketing department supplies its brand colours, fonts and default visual settings. You must apply them consistently to all pages and visuals of several reports with the least effort.\nWhat should you do?", "options": ["Apply conditional formatting to every visual", "Import a custom report theme (JSON file) in each report", "Create a bookmark that stores the brand colours", "Format every visual manually and copy it with Format painter"], "answer": [1], "pick": 1, "tip": "Report-wide look and feel = theme JSON. Value-based colours = conditional formatting.", "why": ["Wrong — Conditional formatting colours values based on data; it is not a way to apply a brand palette everywhere.", "Correct — A report theme JSON file defines data colours, fonts and visual defaults once and can be imported into any report (View > Themes > Browse for themes).", "Wrong — Bookmarks capture report state such as filters and visibility, not formatting defaults.", "Wrong — Formatting each visual manually is slow, error-prone and has to be repeated for every new visual."], "concept": "A report theme applies a design to the whole report: colour palette, fonts, backgrounds and default formatting for visual types. Themes can be built-in, customized in Desktop, or imported from a JSON file so many reports share the same corporate style.", "learn": "Use report themes in Power BI Desktop", "lesson": "", "cluster": "V1"}, {"id": "VA1-013", "domain": "Visualize and analyze the data", "topic": "Slicers", "level": "medium", "question": "Contoso's operations page must always show data for the last 3 complete calendar months. The page should roll forward automatically each month without anyone editing a date range.\nWhich slicer setting should you use on the Date column?", "options": ["Dropdown list of month names", "Relative date, set to Last 3 Calendar months", "Before, with a fixed date", "Between, with a start date and end date"], "answer": [1], "pick": 1, "tip": "'Rolling' or 'last N days/months' = Relative date.", "why": ["Wrong — A dropdown list requires users to pick months manually; it does not move with the calendar.", "Correct — A relative date slicer (or relative date filter) is calculated from today's date, so 'Last 3 Calendar months' rolls forward automatically.", "Wrong — Before uses a fixed date, so it does not stay focused on the most recent three months.", "Wrong — A Between slicer uses fixed start/end values, so someone must change it every month."], "concept": "Date slicers can be shown as Between, Before, After, List, Dropdown or Relative date. Relative date options (Last/Next/This + a number + a unit) are evaluated against the current date, which makes them ideal for rolling windows.", "learn": "Create a relative date slicer and filter in Power BI", "lesson": "", "cluster": "V2"}, {"id": "VA1-014", "domain": "Visualize and analyze the data", "topic": "Slicers", "level": "hard", "question": "A Fabrikam report has three pages: Overview, Customers and Products. A Region slicer on Overview must also filter the Products page, but the slicer should NOT appear on Products, and it must NOT filter the Customers page.\nWhat should you do?", "options": ["Add a report-level filter on Region in the Filters pane", "Use Edit interactions on the Overview page so the slicer filters the Products page", "Add Region as a drillthrough field on the Products page", "In the Sync slicers pane, select Sync for Overview and Products, clear Sync for Customers, and clear Visible for Products"], "answer": [3], "pick": 1, "tip": "Sync slicers pane: Sync checkbox = filters that page; Visible checkbox = shows on that page.", "why": ["Wrong — A report-level filter would apply to all pages, including Customers, and is set in the Filters pane rather than driven by the Overview slicer.", "Wrong — Edit interactions controls how visuals affect each other on the same page, not on other pages.", "Wrong — Drillthrough passes filters only when a user drills through from a data point; it does not make a slicer filter another page continuously.", "Correct — In the Sync slicers pane, Sync controls which pages the slicer filters and Visible controls where it appears, so it can filter Products while staying hidden there."], "concept": "Sync slicers (View > Sync slicers) lets one slicer apply to several pages. For each page there is a Sync box (the selection filters that page) and a Visible box (the slicer is shown on that page). Syncing without making it visible is a common way to keep pages consistent without clutter.", "learn": "Sync and use slicers on other pages", "lesson": "", "cluster": "V2"}, {"id": "VA1-015", "domain": "Visualize and analyze the data", "topic": "Filters pane", "level": "easy", "question": "Northwind wants every page in its sales report to exclude internal test orders (Order Type = \"Test\"). New pages added later should also exclude them automatically.\nAt which level should you add this filter in the Filters pane?", "options": ["Drillthrough", "Report level", "Visual level", "Page level"], "answer": [1], "pick": 1, "tip": "Filter scope ladder: visual < page < report (all pages).", "why": ["Wrong — Drillthrough filters are passed to a target page when a user drills through; they are not a permanent exclusion.", "Correct — A report-level filter (Filters on all pages) applies to every page in the report, including pages added later.", "Wrong — A visual-level filter affects only one visual, so every other visual would still include test orders.", "Wrong — A page-level filter affects only one page; you would have to repeat it on every page, including new ones."], "concept": "The Filters pane has three main scopes: filters on this visual, filters on this page, and filters on all pages (report level). Choose the smallest scope that meets the requirement, and use report level for rules that must apply everywhere.", "learn": "Add a filter to a report in Power BI", "lesson": "", "cluster": "V2"}, {"id": "VA1-016", "domain": "Visualize and analyze the data", "topic": "Filters pane", "level": "medium", "question": "A bar chart on Contoso's product page shows sales for 800 products. The chart must show only the 5 products with the highest sales, and other visuals on the page must keep showing all products.\nWhat should you do?", "options": ["Add a visual-level filter on Product to the bar chart with Filter type set to Top N, show items Top 5, by value Sales", "Sort the bar chart by Sales descending and resize it so only five bars are visible", "Add a page-level filter on Product with Filter type set to Top N", "Add a Product slicer and select the five products manually"], "answer": [0], "pick": 1, "tip": "Top N lives in the visual-level filters: Filter type = Top N, By value = your measure.", "why": ["Correct — A visual-level Top N filter keeps only the top 5 products ranked by the Sales measure for that one visual, and recalculates as other filters change.", "Wrong — Sorting and resizing still loads all products (users can scroll), and it is not a real filter.", "Wrong — Top N is a visual-level filter type, and a page-level filter would also affect the other visuals on the page.", "Wrong — Picking products manually is static; the top 5 can change over time and with other filters, and the slicer would affect other visuals too."], "concept": "A Top N filter keeps the top (or bottom) N items of a field ranked by a measure. It is set in the visual's section of the Filters pane and is dynamic, so the list updates when the data or other filters change.", "learn": "Add a filter to a report in Power BI", "lesson": "", "cluster": "V2"}, {"id": "VA1-017", "domain": "Visualize and analyze the data", "topic": "Filters pane", "level": "medium", "question": "A report-level filter on Adventure Works' report keeps only Country = \"United States\". Report consumers must not be able to change this filter in reading view.\nWhich TWO actions each meet this requirement? (Select TWO.)", "options": ["Hide the filter in the Filters pane", "Set the filter to Require single selection", "Use Edit interactions to set the filter to None", "Lock the filter in the Filters pane"], "answer": [0, 3], "pick": 2, "tip": "Lock = they can see it but not change it; Hide = they don't see it at all.", "why": ["Correct — A hidden filter still applies, but consumers do not see it in the Filters pane, so they cannot change it.", "Wrong — Require single selection only limits how many values can be selected; consumers could still pick a different country.", "Wrong — Edit interactions controls how visuals cross-filter each other; it does not apply to Filters pane filters.", "Correct — A locked filter is visible to consumers but cannot be changed by them."], "concept": "Report authors can lock or hide each filter card in the Filters pane. Locking shows the filter but prevents changes; hiding removes it from the consumer's view while it still filters the data. Authors can also format or hide the entire Filters pane.", "learn": "Format filters in Power BI reports", "lesson": "", "cluster": "V2"}, {"id": "VA1-018", "domain": "Visualize and analyze the data", "topic": "Visual interactions", "level": "medium", "question": "On a Northwind report page, a card shows Total Company Sales. When users click a bar in the Sales by Region chart, the card currently changes to show only that region. The card must always show the company total, while the other visuals should still react to clicks.\nWhat should you do?", "options": ["Select the card, choose Format > Edit interactions, and set the bar chart's interaction to None", "Lock the card using the Selection pane", "Add a visual-level filter to the card", "Select the Sales by Region chart, choose Format > Edit interactions, and set the card's interaction to None"], "answer": [3], "pick": 1, "tip": "Edit interactions: select the visual doing the clicking (the source), then set icons on the visuals it affects.", "why": ["Wrong — Selecting the card sets how the card affects other visuals, not how the bar chart affects the card.", "Wrong — The Selection pane controls visibility, layering and tab order; it does not change interactions.", "Wrong — A visual-level filter adds a filter; it does not stop cross-filtering from another visual.", "Correct — Edit interactions is set from the source visual; choosing None on the card stops clicks in the bar chart from filtering the card, while other visuals keep their behaviour."], "concept": "By default, selecting a data point in one visual cross-filters or cross-highlights the other visuals on the page. With Edit interactions you select the source visual and then, on each other visual, choose Filter, Highlight or None.", "learn": "Change how visuals interact in a Power BI report", "lesson": "", "cluster": "V2"}, {"id": "VA1-019", "domain": "Visualize and analyze the data", "topic": "Visual interactions", "level": "medium", "question": "On a Contoso page, clicking a category in a donut chart currently dims part of each bar in a Sales by Month column chart, leaving the full bar faintly visible. The manager wants the column chart to show only the selected category's values, with the axis rescaled to those values.\nWhich interaction should you set on the column chart?", "options": ["None", "Highlight", "Drill down", "Filter"], "answer": [3], "pick": 1, "tip": "Highlight = dim the rest (keeps full total visible); Filter = remove the rest.", "why": ["Wrong — None would stop the column chart from reacting to the donut at all.", "Wrong — Highlight is the current behaviour: it shades the selected part and keeps the full bar visible in a lighter colour.", "Wrong — Drill down moves to a lower level of a hierarchy; it is not an interaction type between visuals.", "Correct — Filter removes the data that is not selected, so the column chart shows only the selected category and rescales its axis."], "concept": "There are three interaction types: Filter (show only the selected data), Highlight (show the selected portion against the full total) and None (ignore the selection). Many charts use Highlight by default; you change it with Edit interactions.", "learn": "Change how visuals interact in a Power BI report", "lesson": "", "cluster": "V2"}, {"id": "VA1-020", "domain": "Visualize and analyze the data", "topic": "Drill down", "level": "hard", "question": "A column chart in an Adventure Works report has a date hierarchy Year > Quarter > Month on the X axis and currently shows years 2024 and 2025. The analyst wants to see eight bars labelled 2024 Qtr 1, 2024 Qtr 2 … 2025 Qtr 4, so each quarter of each year is separate.\nWhich drill action should the analyst use?", "options": ["Right-click a column and choose Drill through", "Expand all down one level in the hierarchy", "Turn on drill down mode and click the 2024 column", "Go to the next level in the hierarchy"], "answer": [1], "pick": 1, "tip": "'Expand all' keeps the parent label (Year + Quarter); 'Go to next level' drops it (just Quarter).", "why": ["Wrong — Drill through opens another report page filtered to the selected item; it does not change the hierarchy level.", "Correct — Expand all down one level keeps the parent level, so each bar is a Year + Quarter combination, giving eight bars.", "Wrong — Drilling down on 2024 shows only the quarters of 2024 (four bars), not both years.", "Wrong — Go to the next level shows only Qtr 1–Qtr 4, combining the same quarter across both years."], "concept": "Visuals with a hierarchy on the axis have several drill options: drill down on one data point, go to the next level (all data, parent level removed) and expand all down one level (all data, parent level kept). Choosing the right one controls whether values from different parents are combined.", "learn": "Drill mode in a visual in Power BI", "lesson": "", "cluster": "V3"}, {"id": "VA1-021", "domain": "Visualize and analyze the data", "topic": "Drillthrough", "level": "medium", "question": "Fabrikam has a Product Details page with several visuals about a single product. Users on other pages should be able to right-click any product in a visual and jump to Product Details already filtered to that product.\nWhat should you do on the Product Details page?", "options": ["Add Product Name to the Drill through section of the page's Visualizations pane", "Create a bookmark for each product", "Set Page information > Allow use as tooltip to On", "Add a page-level filter on Product Name"], "answer": [0], "pick": 1, "tip": "Drillthrough is set up on the TARGET page: put the field in the Drill through well.", "why": ["Correct — Adding Product Name to the Drill through well makes the page a drillthrough target, so a right-click > Drill through on any visual containing Product Name opens it filtered to that product.", "Wrong — One bookmark per product would be unmanageable and does not respond to the clicked product.", "Wrong — Allow use as tooltip turns the page into a report page tooltip shown on hover, not a drillthrough target.", "Wrong — A page-level filter is static; it does not let users jump from another page with their selected product."], "concept": "Drillthrough lets users move from a summary to a focused detail page. You build the target page and add one or more fields to its Drill through well; Power BI adds a Back button automatically and passes the selected value (and optionally all filters) to the target page.", "learn": "Set up drillthrough in Power BI reports", "lesson": "", "cluster": "V3"}, {"id": "VA1-022", "domain": "Visualize and analyze the data", "topic": "Drillthrough", "level": "hard", "question": "Contoso has two reports: Sales Summary and Customer Detail. Both are published to Power BI and use tables with the same Customer[Customer ID] column. Users of Sales Summary must be able to right-click a customer and drill through to a page in Customer Detail.\nWhich THREE actions are required? (Select THREE.)", "options": ["On the target page in Customer Detail, add Customer ID to the Drill through well and turn on Cross-report", "Publish both reports to the same workspace", "In Sales Summary, enable the report setting that allows visuals to use drillthrough targets from other reports", "Create a bookmark in Sales Summary that points to Customer Detail", "Rebuild both reports on exactly the same semantic model"], "answer": [0, 1, 2], "pick": 3, "tip": "Cross-report drillthrough = setting ON in source + Cross-report ON on target page + same workspace (or same app).", "why": ["Correct — The target page needs the drillthrough field, and the Cross-report toggle must be on so other reports can target it.", "Correct — Cross-report drillthrough finds targets among reports in the same workspace (or the same app).", "Correct — The source report must allow its visuals to use drillthrough targets from other reports (a report setting in Desktop or the Service).", "Wrong — Bookmarks work only inside their own report and are not needed for drillthrough.", "Wrong — The reports do not need the same semantic model; Power BI matches drillthrough fields by table and column name."], "concept": "Cross-report drillthrough extends normal drillthrough across reports. The source report opts in through report settings, the target page enables Cross-report on its drillthrough fields, and Power BI matches the fields by table and column name among reports in the same workspace or app.", "learn": "Use cross-report drillthrough in Power BI", "lesson": "", "cluster": "V3"}, {"id": "VA1-023", "domain": "Visualize and analyze the data", "topic": "Tooltips", "level": "medium", "question": "Northwind wants users who hover over a bar in the Sales by Country chart to see a small pop-up containing a mini line chart and two cards for that country. You have already designed a small report page named TT Country with these visuals.\nWhich TWO actions should you take? (Select TWO.)", "options": ["On the Sales by Country chart, set Tooltips > Type to Report page and select TT Country", "Create a bookmark of TT Country and assign it to the chart's Action property", "Add Country to the Drill through well on the TT Country page", "On the TT Country page, turn on Page information > Allow use as tooltip"], "answer": [0, 3], "pick": 2, "tip": "Report page tooltip = page says 'I can be a tooltip' + visual says 'use that page'.", "why": ["Correct — Setting the visual's tooltip type to Report page and choosing TT Country makes hovering show that page filtered to the hovered country.", "Wrong — Bookmarks and actions run on click; they do not create hover tooltips.", "Wrong — The Drill through well creates a drillthrough target reached by right-click, not a hover pop-up.", "Correct — Allow use as tooltip registers the page as a report page tooltip (a Tooltip canvas size is usually set too)."], "concept": "Report page tooltips replace the default text tooltip with a small report page. Mark the page as a tooltip, size it (for example with the Tooltip canvas size), then point the visual's tooltip settings to that page. The tooltip page is automatically filtered to the data point being hovered.", "learn": "Create tooltips based on report pages in Power BI", "lesson": "", "cluster": "V3"}, {"id": "VA1-024", "domain": "Visualize and analyze the data", "topic": "Bookmarks and buttons", "level": "hard", "question": "On a Fabrikam page, users must click a 'Chart' button to see a column chart and a 'Table' button to see a table showing the same data, in the same spot on the page. Consider these steps:\n1. Add the chart and the table to the page and place them on top of each other.\n2. In the Selection pane, hide the table (chart visible).\n3. Add a bookmark named Chart View.\n4. In the Selection pane, show the table and hide the chart.\n5. Add a bookmark named Table View.\n6. Insert two buttons and set each button's Action type to Bookmark, choosing Chart View and Table View.\nIn which order should you perform the steps?", "options": ["6, 1, 2, 3, 4, 5", "1, 3, 2, 5, 4, 6", "1, 2, 3, 4, 5, 6", "2, 1, 3, 4, 5, 6"], "answer": [2], "pick": 1, "tip": "Set up the view FIRST, then capture it as a bookmark, then wire buttons to the bookmarks.", "why": ["Wrong — The buttons' Bookmark action must point to existing bookmarks, so the bookmarks have to be created first.", "Wrong — A bookmark captures the page as it is when you create it, so creating each bookmark before changing visibility saves the wrong view.", "Correct — Add the visuals, set visibility, capture each state as a bookmark, then link the buttons to the bookmarks.", "Wrong — You cannot hide the table in the Selection pane before it has been added to the page."], "concept": "Bookmarks save a snapshot of a page state, including which visuals are visible (controlled in the Selection pane). Buttons with a Bookmark action switch between those states, which is the classic way to build toggles, show/hide panels and guided stories.", "learn": "Create page and bookmark navigators", "lesson": "", "cluster": "V3"}, {"id": "VA1-025", "domain": "Visualize and analyze the data", "topic": "Bookmarks and buttons", "level": "hard", "question": "In an Adventure Works report, a 'Show details' bookmark makes a hidden table visible. Testers notice that clicking the button linked to this bookmark also resets the Region slicer to the value it had when the bookmark was created. The bookmark must only change visibility and must keep the user's current slicer selections.\nWhat should you change in the bookmark's options?", "options": ["Clear the Current page option", "Select the All visuals option", "Clear the Data option", "Clear the Display option"], "answer": [2], "pick": 1, "tip": "Bookmark options: Data = filters/slicers/sort; Display = visibility/spotlight; Current page = which page.", "why": ["Wrong — Current page controls whether the bookmark navigates to its page; it does not affect slicer values.", "Wrong — All visuals applies the bookmark to every visual on the page; it would still restore the saved slicer selection.", "Correct — Clearing Data stops the bookmark from applying its saved filters, slicer selections and sort, so only the visibility (Display) changes.", "Wrong — Display controls visibility; clearing it would stop the bookmark from showing the table, which is the part you want to keep."], "concept": "Each bookmark can capture Data (filters, slicers, sort order, drill state), Display (visibility, spotlight, focus mode) and Current page, for all visuals or only selected visuals. Turning off Data is a common fix when a bookmark should toggle visibility without undoing the user's filtering.", "learn": "Create bookmarks in Power BI to share insights and build stories", "lesson": "", "cluster": "V3"}, {"id": "VA1-026", "domain": "Visualize and analyze the data", "topic": "Bookmarks and buttons", "level": "easy", "question": "A Northwind report has eight pages. You want a row of navigation buttons at the top of the main page, one per page, that updates automatically when pages are added, renamed or hidden.\nWhat should you add?", "options": ["A bookmark for each page", "A Page navigator (Insert > Buttons > Navigator > Page navigator)", "Eight blank buttons, each with Action type Page navigation", "A slicer on a Page Name column"], "answer": [1], "pick": 1, "tip": "Page navigator = one object, auto-synced with your pages.", "why": ["Wrong — Bookmarks alone do not create navigation buttons and would need maintenance for every page change.", "Correct — The Page navigator creates a button for each page and stays in sync with page names, order and visibility.", "Wrong — Individual buttons work, but they must be created and maintained by hand and do not update when pages change.", "Wrong — A slicer filters data; it cannot switch report pages."], "concept": "Power BI has built-in navigators: the Page navigator creates buttons for report pages, and the Bookmark navigator creates buttons for a bookmark group. Both update automatically, which saves effort compared with configuring single buttons.", "learn": "Create page and bookmark navigators", "lesson": "", "cluster": "V3"}, {"id": "VA1-027", "domain": "Visualize and analyze the data", "topic": "Field parameters", "level": "medium", "question": "Contoso's sales manager wants one bar chart where she can choose whether the axis shows Product Category, Region or Sales Channel, using a slicer. You want the solution that needs the least maintenance.\nWhat should you use?", "options": ["Three overlapping charts and three bookmarks toggled by buttons", "A drillthrough page for each field", "A field parameter that includes Product Category, Region and Sales Channel", "A hierarchy of Product Category > Region > Sales Channel with drill down"], "answer": [2], "pick": 1, "tip": "Let users swap which FIELD or MEASURE a visual uses = field parameters.", "why": ["Wrong — Bookmarks can fake this, but three charts and bookmarks are much more work to build and maintain.", "Wrong — Drillthrough moves users to a detail page; it does not change the axis of the current chart.", "Correct — A field parameter (Modeling > New parameter > Fields) creates a slicer that lets users switch the dimension used on the chart's axis.", "Wrong — A hierarchy drills from one level into another (category into region), which is a different analysis from switching between independent fields."], "concept": "Field parameters let report users dynamically change the fields or measures used in a visual. Power BI creates a parameter table and a slicer; when a user picks a value, the visual swaps in that field, so one visual can answer several questions.", "learn": "Let report readers use field parameters to change visuals", "lesson": "", "cluster": "V3"}, {"id": "VA1-028", "domain": "Visualize and analyze the data", "topic": "Small multiples", "level": "easy", "question": "Fabrikam wants to compare the monthly sales trend of each of its six regions. The manager wants a grid of six small line charts, one per region, that share the same axes so they are easy to compare.\nWhat should you do?", "options": ["Add Region to the Legend of a single line chart", "Add Region to the Small multiples well of a line chart", "Use a matrix with Region on rows", "Create six line charts, each with a visual-level filter"], "answer": [1], "pick": 1, "tip": "Same chart repeated per category in a grid = small multiples.", "why": ["Wrong — Region in the Legend draws six lines on one chart, which can become cluttered; it is not a grid of separate charts.", "Correct — The Small multiples well splits the visual into a grid of mini charts, one per region, with shared axes.", "Wrong — A matrix shows numbers in a grid, not a set of line charts.", "Wrong — Six separate charts would work but take more effort, and their axes would not be synchronized automatically."], "concept": "Small multiples split one visual into several smaller versions of itself, one per value of a chosen field, laid out in a grid with shared axes. They make it easy to compare patterns between categories without overloading a single chart.", "learn": "Create small multiples in Power BI", "lesson": "", "cluster": "V1"}, {"id": "VA1-029", "domain": "Visualize and analyze the data", "topic": "Sorting", "level": "medium", "question": "In a Northwind report, a column chart shows sales by Month Name. When sorted by Month Name ascending, the columns appear as Apr, Aug, Dec, Feb… instead of Jan, Feb, Mar. The Date table also has a Month Number column (1–12).\nWhat should you do?", "options": ["Change the data type of Month Name to Date", "Sort the visual by Sales descending", "Select the Month Name column and set Sort by column to Month Number", "Add Month Number to the visual's tooltips"], "answer": [2], "pick": 1, "tip": "Text sorts alphabetically — use Sort by column to borrow a numeric order.", "why": ["Wrong — Month names such as \"Jan\" are not full dates and cannot be converted to the Date type correctly.", "Wrong — Sorting by Sales orders the months by value, not in calendar order.", "Correct — Sort by column tells Power BI to order Month Name by the Month Number column, so every visual shows Jan, Feb, Mar… in order.", "Wrong — Fields in the tooltips do not affect the sort order of the axis."], "concept": "Text columns sort alphabetically by default. The Sort by column feature (column tools in Data or Model view) lets one column be ordered by another, such as Month Name by Month Number or Weekday by Weekday Number, and it applies in every visual.", "learn": "Sort one column by another column in Power BI", "lesson": "", "cluster": "V1"}, {"id": "VA1-030", "domain": "Visualize and analyze the data", "topic": "Accessibility", "level": "medium", "question": "Adventure Works must make a report usable by people who use screen readers or keyboard navigation, and by people with colour-vision deficiency.\nWhich THREE actions should you take? (Select THREE.)", "options": ["Use only red and green to show good and bad performance", "Set a logical tab order for visuals in the Selection pane", "Show status with labels, icons or markers as well as colour", "Add alt text to each visual that describes its key message", "Remove visual titles to reduce clutter"], "answer": [1, 2, 3], "pick": 3, "tip": "Accessible report = Alt text + Tab order + not relying on Colour alone.", "why": ["Wrong — Red and green are hard to tell apart for many people with colour-vision deficiency, and colour-only meaning excludes them.", "Correct — Tab order in the Selection pane controls the sequence keyboard users move through visuals; a logical order matches the reading flow.", "Correct — Adding labels, icons or markers means the meaning does not depend on colour alone.", "Correct — Alt text is read by screen readers, so describing the visual's purpose or key insight helps users who cannot see it.", "Wrong — Titles help everyone, including screen reader users, understand what a visual shows."], "concept": "Accessible reports work for keyboard, screen reader and low-vision users. Key techniques are alt text, a logical tab order (and hiding decorative shapes from it), sufficient contrast, clear titles and labels, and never using colour as the only way to convey meaning.", "learn": "Design Power BI reports for accessibility", "lesson": "", "cluster": "V1"}, {"id": "VA1-031", "domain": "Visualize and analyze the data", "topic": "Mobile layout", "level": "easy", "question": "Contoso's field sales team views a Power BI report mostly on their phones. The report pages look too small on a phone screen. You want an optimized portrait version of a page without creating a separate report.\nWhat should you do in Power BI Desktop?", "options": ["Create a dashboard and pin the visuals", "Export the report to PDF", "Open View > Mobile layout and arrange the visuals on the phone canvas", "Change the page size to 9:16 and redesign the existing page"], "answer": [2], "pick": 1, "tip": "Phone-friendly report page = Mobile layout view in Desktop (same report, extra layout).", "why": ["Wrong — Dashboards have their own phone view, but the requirement is to optimize the report page itself.", "Wrong — A PDF is a static export, not an interactive phone-optimized layout.", "Correct — Mobile layout view lets you place existing visuals on a phone canvas; the Power BI mobile app uses this layout in portrait mode.", "Wrong — Changing the page size would change the layout for desktop users too; a mobile layout is a separate view of the same page."], "concept": "Each report page can have a mobile (portrait) layout. In Desktop, the Mobile layout view shows a phone canvas where you drag existing visuals and can adjust them for mobile; the visuals stay connected to the same data and interactions.", "learn": "Optimize a report for Power BI mobile apps", "lesson": "", "cluster": "V1"}, {"id": "VA1-032", "domain": "Visualize and analyze the data", "topic": "Paginated reports", "level": "medium", "question": "Fabrikam's accounting team needs a print-ready invoice document for every customer each month. Each invoice must fit an exact page layout with a header and footer, and long tables must continue across as many pages as needed, with all rows printed, when exported to PDF.\nWhat should you create?", "options": ["A dashboard with pinned tiles", "A Q&A visual", "A Power BI report with a table visual", "A paginated report built with Power BI Report Builder"], "answer": [3], "pick": 1, "tip": "Pixel-perfect, printable, many pages, 'all rows' = paginated report.", "why": ["Wrong — A dashboard is a single page of tiles for monitoring, not a printable multi-page document.", "Wrong — Q&A answers natural-language questions; it does not produce formatted documents.", "Wrong — A Power BI report table scrolls inside a fixed-size visual; when printed or exported, it does not continue across pages with all rows.", "Correct — Paginated reports (built with Power BI Report Builder) are designed for exact page layouts, headers/footers and tables that flow over many pages."], "concept": "Power BI reports are interactive and exploratory, while paginated reports are 'pixel-perfect' documents meant to be printed or exported, such as invoices, statements and operational lists. They render every row and page, and are authored in Power BI Report Builder.", "learn": "What are paginated reports in Power BI?", "lesson": "Lesson 4 ⏱ 00:29:23", "cluster": "V1"}, {"id": "VA1-033", "domain": "Visualize and analyze the data", "topic": "Dashboards", "level": "easy", "question": "Northwind's CEO wants one screen in the Power BI service with the most important visuals from the Sales, Finance and HR reports.\nWhich TWO statements about Power BI dashboards are true? (Select TWO.)", "options": ["A dashboard can have multiple pages, like a report", "Dashboards are created in the Power BI service, not in Power BI Desktop", "Dashboards support drillthrough pages in the same way as reports", "A dashboard can contain tiles pinned from several different reports"], "answer": [1, 3], "pick": 2, "tip": "Dashboard = ONE page of pinned tiles, built in the Service, from MANY reports.", "why": ["Wrong — A dashboard is a single canvas; multi-page navigation is a report feature.", "Correct — Dashboards are a Power BI service feature; Desktop is used to build reports.", "Wrong — Drillthrough pages are a report feature; selecting a dashboard tile usually opens the report the tile came from.", "Correct — You can pin visuals from many reports (and even different semantic models) to a single dashboard."], "concept": "A report is a multi-page, interactive analysis built on one semantic model. A dashboard is a single page in the Power BI service made of tiles pinned from one or more reports, used to monitor key numbers at a glance. Clicking a tile takes you to its source report.", "learn": "Introduction to dashboards for Power BI designers", "lesson": "Lesson 4 ⏱ 00:52:12", "cluster": "V1"}, {"id": "VA1-034", "domain": "Visualize and analyze the data", "topic": "Q&A", "level": "medium", "question": "Contoso added a Q&A visual so users can type questions in plain English. Users often type \"revenue by region\", but the model's measure is named Sales Amount, and Q&A does not recognize the word \"revenue\".\nWhat should you do so that Q&A understands \"revenue\" without changing the measure name?", "options": ["Turn on Personalize visuals for the report", "Add Sales Amount to the Q&A visual's tooltips", "Add \"revenue\" as a synonym for the Sales Amount measure", "Set the Data category of Sales Amount to Revenue"], "answer": [2], "pick": 1, "tip": "Users' words ≠ model names? Teach Q&A with synonyms.", "why": ["Wrong — Personalize visuals lets users change visuals in reading view; it does not affect Q&A language understanding.", "Wrong — Tooltips show extra information on hover; they do not affect how Q&A interprets questions.", "Correct — Synonyms (set in the field properties in Model view or in Q&A setup) map the words users type to model fields and measures.", "Wrong — Data category describes the kind of data, such as City or Web URL; there is no Revenue category, and it does not teach Q&A new words."], "concept": "The Q&A visual turns natural-language questions into visuals using the names of tables, columns and measures. Clear names and synonyms help it match the words users actually type. Note that Microsoft is moving natural-language features toward Copilot, but well-named fields and synonyms help both.", "learn": "Use Power BI Q&A to explore your data and create visuals", "lesson": "", "cluster": "V4"}, {"id": "VA1-035", "domain": "Visualize and analyze the data", "topic": "Personalize and export", "level": "medium", "question": "Adventure Works report consumers have only Viewer access. They want to change a chart from a column chart to a bar chart and swap the field on its axis for their own analysis, without asking the author and without changing the report for everyone else.\nWhat should the report author enable?", "options": ["Personalize visuals for the report", "Contributor role in the workspace for all consumers", "Edit interactions on the page", "Export data from visuals"], "answer": [0], "pick": 1, "tip": "Viewers changing a visual just for themselves = Personalize visuals.", "why": ["Correct — With Personalize visuals turned on, consumers in reading view can change the visual type and fields; their changes affect only their own view and can be saved as personal bookmarks.", "Wrong — Contributor gives full edit rights to the report for everyone, which is far more access than needed and changes the shared report.", "Wrong — Edit interactions is an author setting for how visuals filter each other, not a consumer feature.", "Wrong — Export data lets users download data from a visual; it does not let them change the visual."], "concept": "Personalize visuals lets report consumers explore by changing a visual's type, fields, sort and some settings directly in reading view without edit permissions. The author enables it in report settings. Users can reset to default or save their version with personal bookmarks.", "learn": "Let users personalize visuals in a report", "lesson": "", "cluster": "V3"}, {"id": "VA2-001", "domain": "Visualize and analyze the data", "topic": "Analyze feature (explain increase/decrease)", "level": "easy", "question": "A Fabrikam analyst has a line chart of monthly revenue. March revenue is much higher than February. Her manager wants Power BI to automatically find which product categories and regions contributed most to that jump, without the analyst building any new visuals.\n\nWhat should she do?", "options": ["Insert a decomposition tree visual and drill down by Month", "Right-click the March data point and select Analyze > Explain the increase", "Turn on Find anomalies in the Analytics pane", "Add a trend line from the Analytics pane"], "answer": [1], "pick": 1, "tip": "Right-click a point, Analyze, Explain the increase: Power BI compares it with the previous point for you.", "why": ["Wrong — A decomposition tree requires building a new visual and drilling manually; it does not automatically compare March with February.", "Correct — Explain the increase compares the selected point with the previous one and shows the fields and values that contributed most to the change.", "Wrong — Anomaly detection flags unexpected points against an expected range; it does not break down a known change between two consecutive months.", "Wrong — A trend line only shows the overall direction across all months; it does not explain what caused one specific change."], "concept": "The Analyze feature is available by right-clicking a data point in a visual. 'Explain the increase/decrease' compares that point with the previous one and uses machine learning to list the categories that drove the change, shown as small charts you can add to the report. It is the quickest way to answer 'why did this number change from last period?'.", "learn": "Apply insights to explain fluctuations in visuals", "lesson": "", "cluster": "V4"}, {"id": "VA2-002", "domain": "Visualize and analyze the data", "topic": "Analyze feature (distribution)", "level": "medium", "question": "Contoso has a column chart of product returns by country. Canada stands out. A manager wants to know which other fields (for example product category or shipping method) look different for Canada compared with the other countries.\n\nAfter right-clicking the Canada column and selecting Analyze, which option should she choose?", "options": ["Find where this distribution is different", "Drill through", "Explain the decrease", "Show as a table"], "answer": [0], "pick": 1, "tip": "Compare a point with the PREVIOUS point = Explain increase/decrease; compare one category with the REST = Find where the distribution is different.", "why": ["Correct — This option looks for fields where the distribution of values for the selected item (Canada) is noticeably different from the other items.", "Wrong — Drill through opens a detail page filtered to Canada, but it does not automatically search for fields whose distribution differs.", "Wrong — Explain the increase/decrease compares a data point with the previous point in the axis, which makes sense for time, not for comparing one country with all others.", "Wrong — Show as a table only displays the underlying numbers of the visual; it performs no analysis."], "concept": "The Analyze menu has two insight types. 'Explain the increase/decrease' is for changes between consecutive points, usually over time. 'Find where this distribution is different' takes one selected category and finds other fields where that category behaves differently from the rest, which helps explain why it stands out.", "learn": "Apply insights to find where distribution is different", "lesson": "", "cluster": "V4"}, {"id": "VA2-003", "domain": "Visualize and analyze the data", "topic": "Grouping and binning", "level": "easy", "question": "Northwind's Customer table has an Age column (whole number). The marketing team wants a column chart that counts customers in 10-year age bands (0–9, 10–19, 20–29, and so on).\n\nWhich sequence of steps should you use in Power BI Desktop?", "options": ["Add Age to a scatter chart > More options > Automatically find clusters > set the number of clusters to 10", "In the Data pane, right-click Age > New group > set Group type to Bin > set Bin size to 10 > OK, then use the new Age (bins) field on the axis", "In Power Query, select Age > Group By > count rows by Age", "Add Age to a column chart > Analytics pane > add a Percentile line at 10%"], "answer": [1], "pick": 1, "tip": "Equal-width ranges of a number or date = Bin (New group > Bin).", "why": ["Wrong — Clustering groups points by similarity with an algorithm; it does not create fixed, equal-width age bands.", "Correct — Binning a numeric column with a bin size of 10 creates a new field that places each age into a 10-year band, ready to use on an axis.", "Wrong — Group By in Power Query aggregates rows per distinct Age value; it does not create 10-year bands.", "Wrong — A percentile line is a reference line on the chart; it does not create categories for the axis."], "concept": "Binning (a type of group) splits a numeric or date column into equal-sized ranges called bins. You choose either a bin size (e.g. 10 years) or a number of bins. Power BI adds a new field such as 'Age (bins)' to the Data pane, which you can use on axes, legends or slicers like any other field. Bins are ideal for building histograms.", "learn": "Use grouping and binning in Power BI Desktop", "lesson": "", "cluster": "V4"}, {"id": "VA2-004", "domain": "Visualize and analyze the data", "topic": "Grouping and binning", "level": "medium", "question": "An Adventure Works analyst wants to group customers into spending bands (0–1,000, 1,000–2,000, …) based on each customer's total sales. She right-clicks the [Total Sales] measure in the Data pane, but there is no New group option.\n\nWhat is the best explanation and fix?", "options": ["Groups and bins are only supported in DirectQuery mode, so switch the table's storage mode", "New group is only available in the Power BI service, so publish the report and create the bins there", "Bins can only be created on date columns, so convert Total Sales to a date", "Groups and bins work on columns, not measures, so create a calculated column on the Customer table that holds each customer's total sales and bin that column"], "answer": [3], "pick": 1, "tip": "You can bin a COLUMN, not a MEASURE: turn the value into a column first.", "why": ["Wrong — Grouping and binning work in Import models; storage mode is not the reason the option is missing.", "Wrong — Groups and bins are created in Power BI Desktop (and in the Service report editor); publishing does not add the option to a measure.", "Wrong — Bins work on numeric and date columns; converting sales to a date makes no sense.", "Correct — Measures are calculated at query time and cannot be grouped; a calculated column stores a value per customer row, which can then be binned."], "concept": "Groups and bins are built on columns because they assign each row to a category. A measure has no row-level value stored in the model, so it cannot be binned directly. The common pattern is to create a calculated column (for example a customer's total sales using CALCULATE) and then bin that column to create segments.", "learn": "Use grouping and binning in Power BI Desktop", "lesson": "", "cluster": "V4"}, {"id": "VA2-005", "domain": "Visualize and analyze the data", "topic": "Grouping and binning", "level": "easy", "question": "A column chart shows sales by product subcategory. Three small subcategories (Gloves, Socks, Caps) should be shown together as one bar called \"Accessories\".\n\nWhat is the quickest way to do this in the report?", "options": ["Create a hierarchy with Subcategory and Category", "Create bins on the Subcategory column with a bin size of 3", "Add a constant line at the total of the three subcategories", "Ctrl+click the three bars, right-click one of them and select Group data"], "answer": [3], "pick": 1, "tip": "Hand-picked text values together = Group (list group); numeric ranges = Bin.", "why": ["Wrong — A hierarchy enables drill down between levels, but it does not merge three chosen subcategories into a new one.", "Wrong — Bins are for numeric or date columns; Subcategory is text.", "Wrong — A constant line only draws a reference line; it does not combine bars.", "Correct — Selecting several data points and choosing Group data creates a list group that combines them into one member you can rename to Accessories."], "concept": "A list group combines hand-picked values of a column (usually text) into new, named members. You can create one by multi-selecting data points in a visual and choosing Group data, or from the Data pane with New group. The result is a new group field you can reuse in other visuals.", "learn": "Use grouping and binning in Power BI Desktop", "lesson": "", "cluster": "V4"}, {"id": "VA2-006", "domain": "Visualize and analyze the data", "topic": "Grouping and binning", "level": "medium", "question": "You created a list group on the Country column named \"Country (groups)\" with groups such as Europe and North America. You also selected the option Include Other group.\n\nWhich TWO statements are true? (Select TWO.)", "options": ["Countries you did not assign to any group are combined into a single Other member", "The group appears as a new field in the Data pane and can be used in other visuals and slicers", "Power BI uses AI to reassign countries to groups each time the data refreshes", "The group changes the Country values in the underlying data source", "Groups can only be created in the Power BI mobile app"], "answer": [0, 1], "pick": 2, "tip": "A group is a new field in the model; 'Other' catches everything you didn't list.", "why": ["Correct — With Include Other group selected, all ungrouped values (including new ones that appear later) go into one Other member.", "Correct — Creating a group adds a new group field to the table, which you can use on axes, legends and slicers anywhere in the report.", "Wrong — List groups are fixed by your manual choices; no AI reassigns members on refresh.", "Wrong — Groups live only in the Power BI model; the source data is never changed.", "Wrong — Groups are created in Power BI Desktop (or the report editor); the mobile app is for viewing."], "concept": "Groups are model-level fields that map existing values to new categories. They never change the source. The Include Other group option is useful when you only care about a few categories and want everything else rolled into one bucket, including values that arrive in future refreshes.", "learn": "Use grouping and binning in Power BI Desktop", "lesson": "", "cluster": "V4"}, {"id": "VA2-007", "domain": "Visualize and analyze the data", "topic": "Clustering", "level": "medium", "question": "Adventure Works has a scatter chart where each point is a customer, with Annual Spend on the X axis and Number of Orders on the Y axis. Marketing wants Power BI to automatically split customers into groups of similar behavior, without defining the rules themselves.\n\nWhat should you use?", "options": ["In the scatter chart's More options (...), select Automatically find clusters", "Turn on Find anomalies in the Analytics pane", "Add a key influencers visual with Customer in Analyze", "Create bins on Annual Spend with a bin size of 1,000"], "answer": [0], "pick": 1, "tip": "'Let Power BI find similar groups' = clusters (scatter chart > ... > Automatically find clusters).", "why": ["Correct — Automatic clustering uses an algorithm to find groups of similar data points and creates a new cluster field you can reuse.", "Wrong — Anomaly detection works on time-series line charts to flag unexpected values; it does not segment customers.", "Wrong — Key influencers explains what drives a target outcome; it does not segment points by similarity, and Customer is not an outcome to analyze.", "Wrong — Bins use fixed ranges of one column that you define; they don't find natural groups across two measures."], "concept": "Clustering is an unsupervised technique that groups data points that are similar to each other. In Power BI you can run it on a scatter chart (and on tables) from the More options menu. It is useful for customer segmentation when you don't already know the segment rules.", "learn": "Use clustering in Power BI Desktop", "lesson": "", "cluster": "V4"}, {"id": "VA2-008", "domain": "Visualize and analyze the data", "topic": "Clustering", "level": "hard", "question": "You run Automatically find clusters on a scatter chart of stores (Details = Store Name, X = Sales, Y = Profit Margin). You want to color other visuals by the result and you want exactly 4 segments.\n\nWhich TWO statements are true? (Select TWO.)", "options": ["Clustering is only available if you add a Python script visual", "Clustering automatically removes outlier stores from the model", "Clustering creates a new field in the Data pane that you can use as a legend or slicer in other visuals", "You can enter the number of clusters (4) in the clusters dialog, or leave it blank to let Power BI choose", "Clustering can be run directly on a card visual"], "answer": [2, 3], "pick": 2, "tip": "Clusters = a reusable new field; you choose the count or leave it on auto.", "why": ["Wrong — Automatic clustering is a built-in feature; no Python or R script is required.", "Wrong — Clustering only labels points with a cluster; it never deletes data from the model.", "Correct — The result is saved as a new cluster field (a group) in the table of the Details field, so you can use it in other visuals like any category.", "Correct — The clusters dialog lets you set a specific number of clusters, or leave it empty so Power BI picks a suitable number.", "Wrong — A card shows a single value and has no individual data points to cluster."], "concept": "When Power BI creates clusters, it adds a new field that assigns each item (here, each store) to a cluster. Because it is a field, it can be reused across the report for coloring, filtering or slicing. You control the name, description and optionally the number of clusters in the dialog.", "learn": "Use clustering in Power BI Desktop", "lesson": "", "cluster": "V4"}, {"id": "VA2-009", "domain": "Visualize and analyze the data", "topic": "Analytics pane: reference lines", "level": "easy", "question": "A clustered column chart shows sales by store. Managers want a horizontal line showing the average sales across the stores currently displayed, and it must move when they change a slicer.\n\nWhat should you add from the Analytics pane?", "options": ["An average line", "Error bars", "A trend line", "A constant line set to 50,000"], "answer": [0], "pick": 1, "tip": "Average line = recalculates with filters; constant line = a fixed number you type.", "why": ["Correct — An average line is calculated from the data in the visual, so it updates when slicers or filters change.", "Wrong — Error bars show a range of uncertainty around each value, not one average line.", "Wrong — A trend line shows the direction of change along the axis, not the average level.", "Wrong — A constant line typed as a number stays at 50,000 no matter how the slicer changes."], "concept": "The Analytics pane adds dynamic reference lines to supported visuals: average, median, min, max, percentile, constant and trend lines (availability depends on the visual). Calculated lines like average and median respond to filters because they are computed from the values in the visual.", "learn": "Use the Analytics pane in Power BI Desktop", "lesson": "", "cluster": "V4"}, {"id": "VA2-010", "domain": "Visualize and analyze the data", "topic": "Analytics pane: reference lines", "level": "medium", "question": "A column chart shows order value by sales rep. A few reps closed some very large deals, which pulls the average line far above what a typical rep sells. The manager wants a reference line that represents the 'typical' rep and is not distorted by those few large values.\n\nWhich line should you add?", "options": ["Median line", "Trend line", "Average line", "Max line"], "answer": [0], "pick": 1, "tip": "Outliers drag the average; the median (middle value) stays put.", "why": ["Correct — The median is the middle value, so a few extreme values have little effect on it.", "Wrong — A trend line shows direction along the axis, not a typical level.", "Wrong — The average is sensitive to extreme values, which is the problem described.", "Wrong — A max line marks the highest value, which is exactly the outlier the manager wants to ignore."], "concept": "The average (mean) adds all values and divides by the count, so a few very large values pull it up. The median is the value in the middle when sorted, which makes it a better 'typical value' when data is skewed. Both are available as reference lines in the Analytics pane.", "learn": "Use the Analytics pane in Power BI Desktop", "lesson": "", "cluster": "V4"}, {"id": "VA2-011", "domain": "Visualize and analyze the data", "topic": "Analytics pane: reference lines", "level": "hard", "question": "Contoso shows monthly sales in a line chart. The sales target is stored in a measure named [Sales Target], and its value differs by year. When a user selects a different year in a slicer, the horizontal target line on the chart must change to that year's target. You want to keep the chart as a line chart.\n\nWhat should you do?", "options": ["Add a trend line and set its color to red", "Add a Y-axis constant line and type the current year's target value", "Add an average line and rename it to Target", "Add a Y-axis constant line and use the fx (conditional formatting) button on its Value to bind it to the [Sales Target] measure"], "answer": [3], "pick": 1, "tip": "Constant line + fx = a 'constant' line whose value comes from a measure.", "why": ["Wrong — A trend line is calculated from the sales values; renaming or recoloring it doesn't make it a target.", "Wrong — A typed constant value never changes when the slicer changes.", "Wrong — An average line shows the average of the sales values, not the target.", "Correct — Setting the constant line's value with fx to a measure makes the line move as the measure's result changes with filters."], "concept": "A constant line can be fixed (you type a number) or dynamic (you use the fx button to take its value from a field or measure). Dynamic constant lines are a simple way to show targets or thresholds that change with slicer selections, without changing the visual type.", "learn": "Use the Analytics pane in Power BI Desktop", "lesson": "", "cluster": "V4"}, {"id": "VA2-012", "domain": "Visualize and analyze the data", "topic": "Analytics pane: trend line", "level": "easy", "question": "A line chart shows monthly sales for the last three years, using a date field on a continuous X axis. The values go up and down a lot, and the CEO only wants to see whether sales are generally rising or falling.\n\nWhat should you add?", "options": ["Anomaly detection", "A percentile line", "A forecast", "A trend line"], "answer": [3], "pick": 1, "tip": "Trend line = 'which way are we heading overall?'", "why": ["Wrong — Anomaly detection highlights unusual points; it does not show the general direction.", "Wrong — A percentile line is a horizontal line at a chosen percentile, so it shows no direction.", "Wrong — A forecast predicts future values; it does not summarize the direction of the historical data.", "Correct — A trend line draws a straight line through the data that summarizes the overall upward or downward direction."], "concept": "A trend line is a straight line fitted through the data points, typically using linear regression. It removes the noise of individual ups and downs so you can see the long-term direction. It requires a continuous axis such as a date or a number, not a text category axis.", "learn": "Use the Analytics pane in Power BI Desktop", "lesson": "", "cluster": "V4"}, {"id": "VA2-013", "domain": "Visualize and analyze the data", "topic": "Forecasting", "level": "medium", "question": "Northwind has a line chart of monthly revenue for the last four years, with a continuous date axis and a single line. The finance team wants to see projected revenue for the next 6 months, with a shaded range showing uncertainty.\n\nWhat should you do?", "options": ["In the Analytics pane, turn on Forecast and set Forecast length to 6 months", "Add a trend line and extend the X axis by 6 months", "Add a key influencers visual with Revenue in Analyze", "Add a decomposition tree that splits revenue by Month"], "answer": [0], "pick": 1, "tip": "Future values + shaded confidence band = Forecast on a line chart.", "why": ["Correct — Forecast projects future points on a line chart with a continuous date axis and shows a confidence interval band.", "Wrong — A trend line has no confidence band and does not account for seasonal patterns the way the forecast does.", "Wrong — Key influencers explains what drives a value; it does not predict future values.", "Wrong — A decomposition tree breaks down existing values; it does not predict the future."], "concept": "Forecasting in the Analytics pane uses the history of a single line on a continuous time axis to predict future values, taking seasonality into account. You can set the forecast length, the confidence interval, the seasonality and how many of the last points to ignore. The shaded band shows the range the real values are likely to fall within.", "learn": "Use the Analytics pane in Power BI Desktop (forecasting)", "lesson": "", "cluster": "V4"}, {"id": "VA2-014", "domain": "Visualize and analyze the data", "topic": "Forecasting", "level": "hard", "question": "You added a forecast to a line chart of monthly sales. Two problems appear:\n1. The current month is only half finished, so its low value pulls the forecast down.\n2. Sales follow a clear yearly pattern, but the forecast doesn't reflect it well.\n\nWhich TWO forecast settings should you change? (Select TWO.)", "options": ["Raise the confidence interval to 99%", "Change the visual to a clustered column chart", "Add Region to the Legend so each region gets its own forecast", "Set Ignore the last to 1 point", "Set Seasonality to 12 points"], "answer": [3, 4], "pick": 2, "tip": "Incomplete last period? Ignore it. Yearly pattern in monthly data? Seasonality = 12.", "why": ["Wrong — A higher confidence interval only widens the shaded band; it does not fix the incomplete month or the seasonality.", "Wrong — The built-in forecast is a line chart feature, so changing to a column chart removes it.", "Wrong — The forecast needs a single line; adding a legend creates multiple series and the forecast is no longer available.", "Correct — Ignoring the last point leaves the incomplete month out of the data the forecast is built from.", "Correct — With monthly data, a yearly pattern repeats every 12 points, so setting seasonality to 12 helps the model capture it."], "concept": "Forecast settings include forecast length, ignore last N points, confidence interval and seasonality. 'Ignore last' is useful when the latest period is incomplete. Seasonality is measured in data points: with monthly data, a yearly cycle is 12 points. Power BI can detect seasonality automatically, but setting it explicitly helps when you know the cycle.", "learn": "Use the Analytics pane in Power BI Desktop (forecasting)", "lesson": "", "cluster": "V4"}, {"id": "VA2-015", "domain": "Visualize and analyze the data", "topic": "Anomaly detection", "level": "medium", "question": "Fabrikam's operations team watches a line chart of daily online orders. They want Power BI to automatically highlight days with unexpected spikes or dips, show the expected range, and suggest possible explanations when they click a flagged day.\n\nWhat should you use?", "options": ["Find anomalies in the Analytics pane", "Forecast in the Analytics pane", "Right-click each day and use Analyze > Explain the increase", "Automatically find clusters"], "answer": [0], "pick": 1, "tip": "'Flag the weird days' on a time-series line chart = Find anomalies.", "why": ["Correct — Anomaly detection marks unexpected points, shows the expected boundary range, and offers possible explanations for each anomaly.", "Wrong — Forecast predicts future values; it does not flag unusual past values.", "Wrong — Explain the increase works on one point you pick yourself; it does not automatically find the unusual days.", "Wrong — Clustering groups similar points on a scatter chart; it does not flag unexpected values in a time series."], "concept": "Anomaly detection is available in the Analytics pane for line charts with time-series data on the X axis. Power BI calculates an expected range and marks points outside it as anomalies. Selecting an anomaly opens a pane with possible explanations based on the fields you choose.", "learn": "Anomaly detection in Power BI", "lesson": "", "cluster": "V4"}, {"id": "VA2-016", "domain": "Visualize and analyze the data", "topic": "Anomaly detection", "level": "hard", "question": "You enabled Find anomalies on a line chart of daily sales. Users say:\n1. Too many ordinary days are being flagged as anomalies.\n2. When they click an anomaly, they want explanations based on Store, Product Category and Promotion.\n\nWhich TWO actions should you take? (Select TWO.)", "options": ["Add Store, Product Category and Promotion to the Explain by field well of the anomaly settings", "Raise the Sensitivity setting", "Change the X axis type to Categorical", "Turn on Forecast with a length of 30 days", "Lower the Sensitivity setting"], "answer": [0, 4], "pick": 2, "tip": "Higher sensitivity = more anomalies; Explain by = the fields used to suggest reasons.", "why": ["Correct — Fields in Explain by are analyzed to rank possible explanations when a user selects an anomaly.", "Wrong — Higher sensitivity makes even small deviations count as anomalies, which makes the problem worse.", "Wrong — Anomaly detection needs time-series data on the axis; changing to a categorical axis doesn't fix either problem.", "Wrong — A forecast predicts future values and does not change which past points are flagged or explained.", "Correct — Lower sensitivity widens the expected range, so only larger deviations are flagged."], "concept": "Anomaly detection has a Sensitivity setting: the higher it is, the narrower the expected range and the more points are flagged. The Explain by fields tell Power BI which attributes to examine when looking for possible reasons behind an anomaly. Tuning both makes the feature useful instead of noisy.", "learn": "Anomaly detection in Power BI", "lesson": "", "cluster": "V4"}, {"id": "VA2-017", "domain": "Visualize and analyze the data", "topic": "AI visuals: key influencers", "level": "easy", "question": "Contoso collects customer survey responses, each with a Rating (High or Low) and attributes such as Region, Product, Support Channel and Customer Tenure. Management asks: \"Which factors make a Low rating more likely?\"\n\nWhich visual best answers this question?", "options": ["Key influencers", "Q&A", "Treemap", "Decomposition tree"], "answer": [0], "pick": 1, "tip": "'What drives / influences X?' = Key influencers.", "why": ["Correct — Key influencers analyzes an outcome (Rating = Low) and ranks the factors that most increase its likelihood.", "Wrong — Q&A answers typed questions with visuals, but it does not perform driver analysis.", "Wrong — A treemap shows part-to-whole proportions; it does not explain causes.", "Wrong — A decomposition tree breaks a value down across dimensions, but it does not statistically rank what drives an outcome."], "concept": "The key influencers visual puts the outcome you care about in Analyze and the possible factors in Explain by. It then shows which factor values (for example Support Channel = Email) make the outcome more likely, and by how much. It works for categorical outcomes (like High/Low) and numeric ones (what makes a value increase).", "learn": "Create key influencers visualizations", "lesson": "", "cluster": "V4"}, {"id": "VA2-018", "domain": "Visualize and analyze the data", "topic": "AI visuals: key influencers", "level": "medium", "question": "A key influencers visual analyzes Churned = Yes for a subscription service. The Key influencers tab lists single factors such as \"Plan is Basic\" and \"Region is West\". The product manager now wants to see groups of customers defined by combinations of factors (for example Basic plan AND West region AND tenure under 6 months) that have a high churn rate.\n\nWhat should she use?", "options": ["The Top segments tab of the same key influencers visual", "A Q&A visual asking \"show churn by plan\"", "The AI split (High value) in a decomposition tree", "Analyze > Find where this distribution is different"], "answer": [0], "pick": 1, "tip": "Key influencers tab = single factors; Top segments tab = combinations of factors.", "why": ["Correct — Top segments finds groups of records that share a combination of factor values and shows each segment's outcome rate and size.", "Wrong — Q&A would return churn by plan only, a single dimension, and no segment analysis.", "Wrong — The decomposition tree's AI split picks the next dimension with the highest value, not a statistically identified combination with high churn rate.", "Wrong — This option compares one selected category with the rest; it does not build multi-factor segments."], "concept": "The key influencers visual has two tabs. Key influencers shows each factor's individual effect on the outcome. Top segments groups data points into segments based on combinations of factors, which helps find specific audiences (for example to target a retention campaign).", "learn": "Create key influencers visualizations", "lesson": "", "cluster": "V4"}, {"id": "VA2-019", "domain": "Visualize and analyze the data", "topic": "AI visuals: decomposition tree", "level": "medium", "question": "Adventure Works managers want to explore Total Cost interactively. Sometimes they want to break it down by Region then Product then Supplier; other times by Supplier first. They want to pick the next dimension themselves at each step and see every level side by side.\n\nWhich visual should you use?", "options": ["Matrix with a fixed Region > Product > Supplier hierarchy", "Ribbon chart", "Decomposition tree", "Key influencers"], "answer": [2], "pick": 1, "tip": "Ad hoc drill-down in ANY order, level by level = Decomposition tree.", "why": ["Wrong — A matrix hierarchy has a fixed order set by the author, so users can't freely choose the next dimension.", "Wrong — A ribbon chart shows ranking changes over time, not hierarchical breakdowns.", "Correct — A decomposition tree lets users expand a measure by any dimension in any order, showing each level as a branch.", "Wrong — Key influencers explains drivers of an outcome; it is not for breaking down a total level by level."], "concept": "The decomposition tree visualizes a measure across multiple dimensions. Users click + on a node and choose which dimension to drill into next, so the order is decided at view time. It also offers AI splits (High value / Low value) that automatically pick the dimension with the highest or lowest next value.", "learn": "Create and view decomposition tree visuals", "lesson": "", "cluster": "V4"}, {"id": "VA2-021", "domain": "Visualize and analyze the data", "topic": "AI visuals: narrative", "level": "easy", "question": "A Northwind sales report page has several charts. The regional director wants a text box that automatically summarizes the key points of the page in plain sentences (for example the biggest growth month and top product), and the text must update when report filters change.\n\nWhat should you add?", "options": ["A key influencers visual", "A text box with the summary typed manually", "A multi-row card", "A narrative visual (smart narrative)"], "answer": [3], "pick": 1, "tip": "Auto-written, filter-aware text summary = narrative visual.", "why": ["Wrong — Key influencers explains drivers of an outcome with charts, not a written page summary.", "Wrong — A manually typed text box does not change when filters change.", "Wrong — A multi-row card shows values, not sentences that describe trends and key points.", "Correct — The narrative visual generates a text summary of the visuals and data, and its values update as users filter the report."], "concept": "The narrative (smart narrative) visual writes a plain-language summary of the report or of selected visuals, highlighting trends and key values. The numbers in the text are dynamic, so the story changes as users slice and filter. Newer versions can use Copilot to generate the summary.", "learn": "Create smart narrative summaries", "lesson": "", "cluster": "V4"}, {"id": "VA2-022", "domain": "Visualize and analyze the data", "topic": "Outliers with scatter chart", "level": "medium", "question": "Contoso wants to find products that don't follow the usual relationship between Discount % and Profit Margin, for example products with small discounts but very low margins. There are about 300 products.\n\nWhich approach is best?", "options": ["A pie chart of Profit Margin by product", "A stacked column chart of Discount % by product category", "A scatter chart with Product in Values, Discount % on the X axis and Profit Margin on the Y axis, with X and Y average lines from the Analytics pane", "A card that shows the maximum Discount %"], "answer": [2], "pick": 1, "tip": "Two measures + 'who doesn't fit the pattern?' = scatter chart; outliers sit away from the crowd.", "why": ["Wrong — A pie chart with 300 slices is unreadable and shows only one measure.", "Wrong — A stacked column chart summarizes by category and hides individual products.", "Correct — A scatter chart plots each product by both measures, so products far from the main cloud stand out; average lines split the chart into quadrants to make outliers easier to see.", "Wrong — A card shows one number, not the relationship between two measures per product."], "concept": "A scatter chart plots each item by two numeric values, which makes relationships and outliers visible. Points far from the main group are candidates for investigation. Adding average (or constant) lines on both axes from the Analytics pane divides the chart into quadrants, such as 'low discount but low margin'.", "learn": "Scatter charts, bubble charts and dot plot charts in Power BI", "lesson": "", "cluster": "V4"}, {"id": "VA2-023", "domain": "Visualize and analyze the data", "topic": "Copilot in reports", "level": "medium", "question": "Report authors at Fabrikam don't see Copilot in their Power BI reports. Their workspace runs on shared capacity and each author has a Pro license.\n\nWhat is required so they can use Copilot?", "options": ["Install a Copilot custom visual from AppSource", "Assign the workspace to a paid Fabric (F SKU) or Power BI Premium (P SKU) capacity and make sure the admin has enabled Copilot in the tenant settings", "Switch the semantic model to DirectQuery", "Turn on Q&A for the semantic model"], "answer": [1], "pick": 1, "tip": "Copilot needs paid capacity + tenant switch on; a Pro license on shared capacity isn't enough.", "why": ["Wrong — Copilot is built into Power BI, not delivered as an AppSource visual.", "Correct — Copilot in Power BI runs on paid capacity and must be enabled by an admin in tenant settings.", "Wrong — Storage mode does not control whether Copilot is available.", "Wrong — Q&A is a separate feature; enabling it does not enable Copilot."], "concept": "Copilot in Power BI uses AI features that run on capacity, so the workspace must be on a paid Fabric or Premium capacity, and a Fabric/Power BI admin must allow Copilot in the tenant settings. Because AI uses capacity, organizations also monitor and control its cost.", "learn": "Overview of Copilot for Power BI", "lesson": "Lesson 5 ⏱ 01:38:42", "cluster": "V4"}, {"id": "VA2-024", "domain": "Visualize and analyze the data", "topic": "Copilot in reports", "level": "medium", "question": "Contoso uses Copilot in Power BI to answer questions and create report pages. Users complain that Copilot often picks the wrong fields, for example confusing [Amt1] with [Amt2].\n\nWhich TWO changes to the semantic model will most improve Copilot's results? (Select TWO.)", "options": ["Remove row-level security roles", "Increase the scheduled refresh to 8 times per day", "Rename tables, columns and measures with clear business-friendly names", "Add descriptions to important measures and tables explaining what they contain", "Change all tables to DirectQuery"], "answer": [2, 3], "pick": 2, "tip": "Copilot reads your metadata: good names + descriptions = better answers.", "why": ["Wrong — RLS controls which rows users can see; removing it is a security risk and doesn't help field selection.", "Wrong — Refresh frequency affects how fresh the data is, not how Copilot interprets the model.", "Correct — Copilot relies on model metadata; names like [Net Sales] are far easier to match to questions than [Amt1].", "Correct — Descriptions give Copilot extra context about what each field means and when to use it.", "Wrong — Storage mode affects query behavior and performance, not how Copilot understands field meanings."], "concept": "Copilot understands your data through the semantic model's metadata: table, column and measure names, descriptions, synonyms and relationships. Preparing a model for AI means using clear names, adding descriptions, hiding technical fields and defining synonyms. Users should still check Copilot's output before relying on it.", "learn": "Optimize your semantic model for Copilot", "lesson": "Lesson 5 ⏱ 01:43:04", "cluster": "V4"}, {"id": "VA2-025", "domain": "Visualize and analyze the data", "topic": "Choosing analysis features", "level": "hard", "question": "A Northwind manager has three questions:\n1. \"Why did sales drop from May to June?\"\n2. \"Which customer attributes make churn more likely?\"\n3. \"What will sales probably be over the next quarter?\"\n\nWhich pairing of question to Power BI feature is correct?", "options": ["1 = Anomaly detection, 2 = Decomposition tree, 3 = Trend line", "1 = Key influencers, 2 = Forecast, 3 = Trend line", "1 = Analyze > Explain the decrease, 2 = Key influencers, 3 = Forecast on a line chart", "1 = Analyze > Explain the decrease, 2 = Clustering, 3 = Anomaly detection"], "answer": [2], "pick": 1, "tip": "Why did it change? Explain. What drives it? Key influencers. What's next? Forecast.", "why": ["Wrong — Anomaly detection flags unusual points but doesn't break down a specific May-to-June change, and a decomposition tree doesn't rank churn drivers.", "Wrong — Key influencers doesn't compare two consecutive points, a forecast doesn't explain churn, and a trend line gives no projected range for the next quarter.", "Correct — Explain the decrease analyzes the change between two points, key influencers ranks the factors behind an outcome, and forecast projects future values.", "Wrong — Clustering groups similar customers but doesn't rank what drives churn, and anomaly detection flags past outliers rather than predicting the future."], "concept": "Each analysis feature answers a different type of question. Explain increase/decrease answers 'why did this change between two points?'; key influencers answers 'what drives this outcome?'; forecast answers 'what is likely next?'; anomaly detection answers 'which points are unusual?'; clustering answers 'which items are similar?'; and the decomposition tree answers 'how does this total break down?'.", "learn": "Perform analytics in Power BI", "lesson": "", "cluster": "V4"}, {"id": "MS-001", "domain": "Manage and secure Power BI", "topic": "Workspaces", "level": "easy", "question": "Lan builds sales reports in her My workspace. Five colleagues now need to edit and maintain these reports with her, and the reports must keep working if Lan leaves the company.\nWhat should she do?", "options": ["Keep the reports in My workspace and share each report with the colleagues", "Create a shared workspace, move the content there, and give the colleagues workspace roles", "Use Publish to web so everyone can open the reports", "Email the .pbix file to each colleague so everyone has a copy"], "answer": [1], "pick": 1, "tip": "My workspace = personal desk; shared workspace = team office.", "why": ["Wrong — sharing lets others view, but they can't co-edit content in her My workspace, and the content belongs to Lan's account.", "Correct — a shared workspace is built for collaboration: several people get roles, and the content does not depend on one person's account.", "Wrong — Publish to web makes the report public on the internet with no sign-in; it doesn't enable co-editi
